# Monthly pull requests for the pinned actions (their commit SHAs) and the Gradle dependencies
# (gradle/libs.versions.toml, the wrapper), one grouped pull request per ecosystem, assigned to
# the owner like every other pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    assignees: [marregui]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    assignees: [marregui]
    groups:
      gradle:
        patterns: ["*"]
    # these freeze comando on a page whose localStorage an earlier run left (record 190, StoredPageUiTest)
    ignore:
      - dependency-name: "org.openjfx:*"
        versions: ["25.0.5", "25.0.5.1"]
