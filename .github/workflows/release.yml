name: release

# A version tag (v2.1.0) builds comando's package on macOS, Linux and Windows and publishes the three files as the
# tag's GitHub release, its notes the commits since the previous tag. Run by hand, it builds the packages and keeps them
# as the run's artifacts, without a release; run by hand on a tag with dry run off, it makes that tag's release (when
# the tag's own run failed). Nothing is signed: the install clears macOS's quarantine flag (INSTALL.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and keep the packages as the run's artifacts, without a release
        type: boolean
        default: true

permissions:
  contents: read

# One run per tag or branch at a time; a release run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # The packages are built without the tests, which the build workflow runs.
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # On a tag the package and the version comando shows are the tag's, without its v; otherwise the project's.
      # Windows runs the batch wrapper, the one written for it.
      - name: Package
        shell: bash
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          GRADLEW: ${{ runner.os == 'Windows' && './gradlew.bat' || './gradlew' }}
        run: $GRADLEW :app:package ${VERSION:+-PreleaseVersion=${VERSION#v}}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comando-${{ runner.os }}
          path: app/build/package/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: package
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # the whole history and its tags, for the commits since the previous tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          {
            if [ -n "$previous" ]; then
              echo "Changes since $previous:"
              echo
              git log --no-merges --format='- %s' "$previous..$TAG"
            else
              echo "Changes:"
              echo
              git log --no-merges --format='- %s' "$TAG"
            fi
            echo
            echo "Install: ask Claude Code to install comando from this release; it follows INSTALL.md."
          } > notes.md
          ls -l dist
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
