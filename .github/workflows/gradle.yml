name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # unit and adapter tests: embedded QuestDB, Postgres in Docker (Testcontainers), recorded Claude streams
      - run: ./gradlew build
      # the transcript renderer's frame-time gate; reported, not enforced, because runner speed varies
      - run: ./gradlew :ui:transcriptGate || true
      # intent-log replays against the Swing shell need a display
      - run: xvfb-run --auto-servernum ./gradlew :app:uiTest
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/'
