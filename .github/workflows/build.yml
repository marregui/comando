name: build

# A change to the docs alone builds nothing, except the tutorial, which the ui jar bundles. Later patterns
# override earlier ones.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - 'docs/tutorial.md'
      - '!README.md'
      - '!INSTALL.md'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - 'docs/tutorial.md'
      - '!README.md'
      - '!INSTALL.md'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes its run in progress; every push to main that passes
# the paths filter is built.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Both systems on every push and pull request, in jobs side by side: the build with its unit tests, and the window
# replay split over several runners. Standard runners cost nothing on a public repository.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Every test: embedded QuestDB, recorded Claude streams, and PostgreSQL through Testcontainers
      # where the runner has Docker (Ubuntu; macOS runners have none, so that test is skipped there).
      - run: ./gradlew build
      # What ran, per module, in the job summary, with every skipped test named.
      - name: Test report
        if: success() || failure()
        run: java ci/TestReport.java
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  # The intent-log replay in a real window, a virtual display on Linux and the runner's own on macOS, in shards: each
  # runner replays the shard of the classes `-PuiShard` picks (app/build.gradle.kts, balanced on ci/ui-test-seconds.tsv),
  # still one JVM per class. macOS takes three shards, as its classes run about 40 % longer than Linux's.
  window:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, shard: 1, of: 3 }
          - { os: macos-latest, shard: 2, of: 3 }
          - { os: macos-latest, shard: 3, of: 3 }
          - { os: ubuntu-latest, shard: 1, of: 2 }
          - { os: ubuntu-latest, shard: 2, of: 2 }
    name: window replay (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.of }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Window replay
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum ' || '' }}./gradlew :app:uiTest -PuiShard=${{ matrix.shard }}/${{ matrix.of }}
      - name: Test report
        if: success() || failure()
        run: java ci/TestReport.java
      # The transcript renderer's frame-time gate, on the last shard: reported, not enforced, because runner speed
      # varies; a step here rather than a job of its own keeps a run to four macOS runners of the five a free account
      # gets at once.
      - name: Transcript gate
        if: matrix.shard == matrix.of
        continue-on-error: true
        run: ./gradlew :ui:transcriptGate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports-window-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  # The macOS disk image, as a smoke test of the packaging (jpackage, the trimmed runtime): in the weekly run only, as
  # a version tag builds the packages in release.yml.
  disk-image:
    if: github.event_name == 'schedule'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :app:dmg
