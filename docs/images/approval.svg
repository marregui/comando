<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>An approval: claude -p calls the approve tool on comando's MCP server with the tool's name, input and id; the server puts a card in the Approvals tab and waits until you answer, at most 24 hours; your answer goes back to Claude Code as allow or deny, with any changed input and any permission rule to remember</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9AA0A6" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="540" fill="url(#bg)"/>
  <text x="40" y="44" font-size="13" letter-spacing="3" fill="#E7C55A">CLAUDE CODE · ONE APPROVAL</text>
  <text x="40" y="78" font-size="24" font-weight="300" fill="#E8E8E8">Claude asks, comando shows a card, you decide</text>

  <!-- heads -->
  <g fill="#1E1E1E" stroke-width="1.3">
    <rect x="60" y="110" width="220" height="58" rx="8" stroke="#D98E5F"/>
    <rect x="390" y="110" width="220" height="58" rx="8" stroke="#6FAEE8"/>
    <rect x="720" y="110" width="220" height="58" rx="8" stroke="#E7C55A" stroke-width="2"/>
  </g>
  <text x="170" y="136" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#D98E5F">claude -p</text>
  <text x="170" y="156" text-anchor="middle" font-size="13" fill="#9AA0A6">a session's process</text>
  <text x="500" y="136" text-anchor="middle" font-size="16" fill="#6FAEE8">comando's MCP server</text>
  <text x="500" y="156" text-anchor="middle" font-size="13" fill="#9AA0A6">inside comando</text>
  <text x="830" y="136" text-anchor="middle" font-size="16" fill="#E7C55A">you</text>
  <text x="830" y="156" text-anchor="middle" font-size="13" fill="#9AA0A6">the Approvals tab</text>

  <!-- lifelines -->
  <g stroke="#3A3A3A" stroke-width="1">
    <line x1="170" y1="168" x2="170" y2="470"/><line x1="500" y1="168" x2="500" y2="470"/><line x1="830" y1="168" x2="830" y2="470"/>
  </g>

  <!-- messages -->
  <g stroke="#9AA0A6" stroke-width="1.1" fill="none">
    <line x1="170" y1="222" x2="499" y2="222" marker-end="url(#ar)"/>
    <line x1="500" y1="288" x2="829" y2="288" marker-end="url(#ar)"/>
    <line x1="830" y1="370" x2="501" y2="370" marker-end="url(#ar)"/>
    <line x1="500" y1="436" x2="171" y2="436" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  </g>
  <g font-size="13" letter-spacing="2" fill="#9AA0A6">
    <text x="186" y="196">1</text><text x="516" y="262">2</text><text x="516" y="344">3</text><text x="186" y="410">4</text>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#E8E8E8">
    <text x="206" y="196">tools/call approve</text>
    <text x="536" y="262">ApprovalRequested</text>
    <text x="536" y="344">ApprovalAnswered</text>
    <text x="206" y="410">allow | deny</text>
  </g>
  <g font-size="13" fill="#9AA0A6">
    <text x="186" y="214">tool_name, input, tool_use_id</text>
    <text x="516" y="280">a card: the tool, its input, a summary</text>
    <text x="516" y="362">allow once, for the session, always, or deny</text>
    <text x="186" y="428">updatedInput, updatedPermissions</text>
    <text x="516" y="316">the call waits here: 24 hours at most</text>
  </g>
  <rect x="494" y="296" width="12" height="66" rx="3" fill="#6FAEE8" opacity="0.55"/>

  <g font-size="13" fill="#9AA0A6">
    <text x="40" y="498">Claude Code runs the tool only after step 4. No answer in time counts as a deny.</text>
    <rect x="40" y="510" width="14" height="14" rx="3" fill="#E7C55A"/><text x="62" y="522">you</text>
    <rect x="104" y="510" width="14" height="14" rx="3" fill="#6FAEE8"/><text x="126" y="522">comando</text>
    <rect x="200" y="510" width="14" height="14" rx="3" fill="#D98E5F"/><text x="222" y="522">Claude Code</text>
    <text x="960" y="522" text-anchor="end">comando · docs/claude-code</text>
  </g>
</svg>
