<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>A result as a grid and as a plot, with the keys that act on it</title>
<rect width="1100" height="560" fill="#161616"/>
<text x="40" y="42" font-size="13" font-weight="600" fill="#E7C55A" letter-spacing="3">WORKBENCH · RESULTS</text>
<text x="40" y="74" font-size="22" font-weight="300" fill="#E8E8E8">One result, read as rows or as a plot</text>

<!-- grid -->
<text x="40" y="112" font-size="13" fill="#9AA0A6" letter-spacing="2">THE GRID · RESULTS TAB</text>
<rect x="40" y="124" width="490" height="250" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<rect x="41" y="125" width="488" height="30" rx="7" fill="#242424"/>
<g stroke="#2E2E2E"><line x1="40" y1="155" x2="530" y2="155" stroke="#3A3A3A"/><line x1="40" y1="191" x2="530" y2="191"/><line x1="40" y1="227" x2="530" y2="227"/><line x1="40" y1="263" x2="530" y2="263"/><line x1="40" y1="299" x2="530" y2="299"/><line x1="40" y1="335" x2="530" y2="335"/>
<line x1="250" y1="124" x2="250" y2="374"/><line x1="340" y1="124" x2="340" y2="374"/><line x1="440" y1="124" x2="440" y2="374"/></g>
<g font-size="13" font-weight="600" fill="#E8E8E8"><text x="54" y="145">ts <tspan fill="#E7C55A">▲</tspan></text><text x="264" y="145">sym</text><text x="354" y="145">price</text><text x="454" y="145">qty</text></g>
<g font-family="Menlo, Consolas, monospace" font-size="13" fill="#C8C8C8">
<text x="54" y="178">2026-03-02 09:00:00</text><text x="264" y="178">NVDA</text><text x="426" y="178" text-anchor="end">912.4</text><text x="516" y="178" text-anchor="end">120</text>
<text x="54" y="214">2026-03-02 09:00:01</text><text x="264" y="214">AAPL</text><text x="426" y="214" text-anchor="end">187.2</text><text x="516" y="214" text-anchor="end">40</text>
<text x="54" y="250">2026-03-02 09:00:03</text><text x="264" y="250">NVDA</text><text x="426" y="250" text-anchor="end">912.9</text><text x="516" y="250" text-anchor="end" fill="#8A8A8A" font-style="italic">null</text>
<text x="54" y="286">2026-03-02 09:00:04</text><text x="264" y="286">MSFT</text><text x="426" y="286" text-anchor="end">402.1</text><text x="516" y="286" text-anchor="end">75</text>
<text x="54" y="322">2026-03-02 09:00:07</text><text x="264" y="322">AAPL</text><text x="426" y="322" text-anchor="end">187.5</text><text x="516" y="322" text-anchor="end">310</text>
<text x="54" y="358">2026-03-02 09:00:09</text><text x="264" y="358">NVDA</text><text x="426" y="358" text-anchor="end">913.3</text><text x="516" y="358" text-anchor="end">60</text>
</g>
<text x="40" y="398" font-size="13" fill="#9AA0A6">A header click sorts. Columns drag. ⌘F finds in the cells.</text>
<text x="40" y="418" font-size="13" fill="#9AA0A6">A SQL NULL reads <tspan font-style="italic" fill="#8A8A8A">null</tspan> in muted italics.</text>

<!-- plot -->
<text x="570" y="112" font-size="13" fill="#9AA0A6" letter-spacing="2">THE PLOT · A VIEW TAB</text>
<rect x="570" y="124" width="490" height="250" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<g stroke="#2E2E2E"><line x1="620" y1="180" x2="1040" y2="180"/><line x1="620" y1="230" x2="1040" y2="230"/><line x1="620" y1="280" x2="1040" y2="280"/></g>
<g stroke="#5A5A5A"><line x1="620" y1="140" x2="620" y2="330"/><line x1="620" y1="330" x2="1040" y2="330"/></g>
<polyline points="620,300 660,286 700,292 740,262 780,270 820,232 860,240 900,204 940,214 980,178 1040,168" fill="none" stroke="#6FAEE8" stroke-width="2"/>
<polyline points="620,250 660,256 700,238 740,246 780,222 820,236 860,214 900,226 940,206 980,216 1040,198" fill="none" stroke="#E7C55A" stroke-width="2"/>
<rect x="770" y="150" width="120" height="170" fill="#E8E8E8" fill-opacity="0.05" stroke="#9AA0A6" stroke-dasharray="4 4"/>
<text x="830" y="168" text-anchor="middle" font-size="13" fill="#9AA0A6">drag to zoom</text>
<g font-size="13" fill="#9AA0A6"><text x="612" y="184" text-anchor="end">913</text><text x="612" y="284" text-anchor="end">912</text><text x="620" y="350">09:00</text><text x="1040" y="350" text-anchor="end">09:10</text></g>
<g font-size="13"><rect x="636" y="140" width="10" height="10" fill="#6FAEE8"/><text x="652" y="150" fill="#C8C8C8">price</text><rect x="700" y="140" width="10" height="10" fill="#E7C55A"/><text x="716" y="150" fill="#C8C8C8">avg</text></g>
<text x="570" y="398" font-size="13" fill="#9AA0A6">x is the first time column, else the first number.</text>
<text x="570" y="418" font-size="13" fill="#9AA0A6">Up to eight more numeric columns are series. A double click resets the zoom.</text>

<!-- keys -->
<line x1="40" y1="444" x2="1060" y2="444" stroke="#2C2C2C"/>
<g font-size="13">
<g transform="translate(40,464)"><rect width="46" height="28" rx="5" fill="#1E1E1E" stroke="#E7C55A"/><text x="23" y="19" text-anchor="middle" fill="#E7C55A">⌘J</text><text x="56" y="12" fill="#E8E8E8">Plot</text><text x="56" y="29" fill="#9AA0A6">the last result</text></g>
<g transform="translate(212,464)"><rect width="56" height="28" rx="5" fill="#1E1E1E" stroke="#E7C55A"/><text x="28" y="19" text-anchor="middle" fill="#E7C55A">⌘⇧J</text><text x="66" y="12" fill="#E8E8E8">Plot, refreshing…</text><text x="66" y="29" fill="#9AA0A6">re-runs every N s</text></g>
<g transform="translate(418,464)"><rect width="56" height="28" rx="5" fill="#1E1E1E" stroke="#E7C55A"/><text x="28" y="19" text-anchor="middle" fill="#E7C55A">⌘⇧R</text><text x="66" y="12" fill="#E8E8E8">Keep in a tab</text><text x="66" y="29" fill="#9AA0A6">the next run spares it</text></g>
<g transform="translate(646,464)"><rect width="56" height="28" rx="5" fill="#1E1E1E" stroke="#E7C55A"/><text x="28" y="19" text-anchor="middle" fill="#E7C55A">⌘⇧I</text><text x="66" y="12" fill="#E8E8E8">Attach to the editor</text><text x="66" y="29" fill="#9AA0A6">rows for a question</text></g>
<g transform="translate(878,464)"><rect width="56" height="28" rx="5" fill="#1E1E1E" stroke="#E7C55A"/><text x="28" y="19" text-anchor="middle" fill="#E7C55A">⌘⇧S</text><text x="66" y="12" fill="#E8E8E8">Export view…</text><text x="66" y="29" fill="#9AA0A6">CSV, or PNG of a plot</text></g>
</g>

<g font-size="13" fill="#9AA0A6">
<rect x="40" y="529" width="12" height="12" fill="#6FAEE8"/><text x="58" y="540">comando's views of the database</text>
<rect x="290" y="529" width="12" height="12" fill="#E7C55A"/><text x="308" y="540">keys</text>
<text x="1060" y="540" text-anchor="end">comando · docs/workbench</text>
</g>
</svg>
