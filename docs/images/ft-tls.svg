<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Frontear between machines: each machine has an Ed25519 key and a self-signed certificate, the user pairs the machines by hand with tokens that carry each key's fingerprint, and every connection is a full TLS 1.3 handshake in which both sides present their certificate and trust only a pinned key, with no certificate authority</title>
<defs>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#E7C55A" stroke-width="1.4"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6FAEE8" stroke-width="1.4"/></marker>
</defs>
<rect width="1200" height="740" fill="#161616"/>
<text x="40" y="44" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">FRONTEAR · BETWEEN MACHINES</text>
<text x="40" y="76" font-size="22" font-weight="300" fill="#E8E8E8">Mutual TLS 1.3 with pinned Ed25519 keys, and no certificate authority</text>

<!-- machine a -->
<rect x="40" y="104" width="340" height="326" rx="10" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="56" y="128" font-size="13" fill="#6FAEE8" letter-spacing="2">MACHINE a</text>
<text x="56" y="154" font-size="13" fill="#9AA0A6" font-family="Menlo, Consolas, monospace">~/.comando-machine/</text>
<rect x="56" y="166" width="308" height="64" rx="6" fill="#2B2618" stroke="#E7C55A" stroke-width="1.2"/>
<text x="70" y="188" font-size="13" fill="#E7C55A" font-family="Menlo, Consolas, monospace">machine.key</text>
<text x="70" y="208" font-size="13" fill="#E8E8E8">Ed25519 private key, PKCS#8;</text>
<text x="70" y="224" font-size="13" fill="#9AA0A6">readable by its owner alone</text>
<rect x="56" y="240" width="308" height="64" rx="6" fill="#242424" stroke="#3A3A3A"/>
<text x="70" y="262" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">machine.crt</text>
<text x="70" y="282" font-size="13" fill="#E8E8E8">self-signed, <tspan font-family="Menlo, Consolas, monospace">CN=a</tspan>, valid 20 years;</text>
<text x="70" y="298" font-size="13" fill="#9AA0A6">its one extension says: not a CA</text>
<text x="56" y="328" font-size="13" fill="#E8E8E8">fingerprint: SHA-256 of the public key,</text>
<text x="56" y="346" font-size="13" fill="#E8E8E8">64 hex digits</text>
<text x="56" y="376" font-size="13" fill="#9AA0A6" font-family="Menlo, Consolas, monospace">~/.comando-remotes.json</text>
<text x="56" y="396" font-size="13" fill="#E8E8E8">pins b: host, port, fingerprint</text>
<text x="56" y="414" font-size="13" fill="#9AA0A6">read again at each look, every 5 s</text>

<!-- machine b -->
<rect x="820" y="104" width="340" height="326" rx="10" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="836" y="128" font-size="13" fill="#6FAEE8" letter-spacing="2">MACHINE b</text>
<text x="836" y="154" font-size="13" fill="#9AA0A6" font-family="Menlo, Consolas, monospace">~/.comando-machine/</text>
<rect x="836" y="166" width="308" height="64" rx="6" fill="#2B2618" stroke="#E7C55A" stroke-width="1.2"/>
<text x="850" y="188" font-size="13" fill="#E7C55A" font-family="Menlo, Consolas, monospace">machine.key</text>
<text x="850" y="208" font-size="13" fill="#E8E8E8">Ed25519 private key, PKCS#8;</text>
<text x="850" y="224" font-size="13" fill="#9AA0A6">readable by its owner alone</text>
<rect x="836" y="240" width="308" height="64" rx="6" fill="#242424" stroke="#3A3A3A"/>
<text x="850" y="262" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">machine.crt</text>
<text x="850" y="282" font-size="13" fill="#E8E8E8">self-signed, <tspan font-family="Menlo, Consolas, monospace">CN=b</tspan>, valid 20 years;</text>
<text x="850" y="298" font-size="13" fill="#9AA0A6">its one extension says: not a CA</text>
<text x="836" y="328" font-size="13" fill="#E8E8E8">its border gateway listens with TLS</text>
<text x="836" y="346" font-size="13" fill="#E8E8E8">on one address, port 18893 by default</text>
<text x="836" y="376" font-size="13" fill="#9AA0A6" font-family="Menlo, Consolas, monospace">~/.comando-remotes.json</text>
<text x="836" y="396" font-size="13" fill="#E8E8E8">pins a: host, port, fingerprint</text>
<text x="836" y="414" font-size="13" fill="#9AA0A6">read again at each look, every 5 s</text>

<!-- 1 pairing -->
<text x="600" y="128" font-size="13" fill="#9AA0A6" letter-spacing="2" text-anchor="middle">1 · PAIR BY HAND, ON BOTH MACHINES</text>
<text x="600" y="152" font-size="13" fill="#E8E8E8" text-anchor="middle">each shows its token; given the other's,</text>
<text x="600" y="170" font-size="13" fill="#E8E8E8" text-anchor="middle">it stores it once the user confirms</text>
<text x="600" y="188" font-size="13" fill="#E8E8E8" text-anchor="middle">the fingerprint</text>
<rect x="404" y="200" width="392" height="30" rx="4" fill="#242424" stroke="#3A3A3A"/>
<text x="600" y="220" font-size="13" fill="#E7C55A" text-anchor="middle" font-family="Menlo, Consolas, monospace">comando-pair:1:a:&lt;host&gt;:&lt;port&gt;:&lt;fp&gt;</text>
<line x1="404" y1="215" x2="384" y2="215" stroke="#6FAEE8" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="796" y1="215" x2="816" y2="215" stroke="#6FAEE8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#b)"/>

<!-- 2 handshake -->
<text x="600" y="256" font-size="13" fill="#9AA0A6" letter-spacing="2" text-anchor="middle">2 · EVERY CONNECTION: A FULL HANDSHAKE</text>
<line x1="384" y1="292" x2="814" y2="292" stroke="#E7C55A" stroke-width="1.6" marker-end="url(#g)"/>
<text x="600" y="284" font-size="13" fill="#E8E8E8" text-anchor="middle">a's link connects; a presents machine.crt</text>
<line x1="816" y1="322" x2="386" y2="322" stroke="#E7C55A" stroke-width="1.6" marker-end="url(#g)"/>
<text x="600" y="316" font-size="13" fill="#E8E8E8" text-anchor="middle">b presents machine.crt</text>
<text x="600" y="346" font-size="13" fill="#E8E8E8" text-anchor="middle">each side: is the key of the first certificate</text>
<text x="600" y="364" font-size="13" fill="#E8E8E8" text-anchor="middle">pinned, and is this TLS 1.3? then trust it</text>
<text x="600" y="390" font-size="13" fill="#9AA0A6" text-anchor="middle">no CA, no validity dates, no host name;</text>
<text x="600" y="408" font-size="13" fill="#9AA0A6" text-anchor="middle">b's border gateway links to a the same way</text>

<!-- the classes -->
<rect x="40" y="456" width="270" height="140" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="56" y="480" font-size="13" fill="#9AA0A6" letter-spacing="2">THE KEY</text>
<text x="56" y="502" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">MachineKey</text>
<text x="56" y="522" font-size="13" fill="#E8E8E8">makes and keeps the pair</text>
<text x="56" y="546" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">MachineKeyManager</text>
<text x="56" y="566" font-size="13" fill="#E8E8E8">offers it as client and as</text>
<text x="56" y="584" font-size="13" fill="#E8E8E8">server</text>

<rect x="326" y="456" width="270" height="140" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.2"/>
<text x="342" y="480" font-size="13" fill="#E7C55A" letter-spacing="2">THE TRUST</text>
<text x="342" y="502" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">PinningTrustManager</text>
<text x="342" y="522" font-size="13" fill="#E8E8E8">trusts a pinned key over TLS 1.3</text>
<text x="342" y="546" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">Pins</text>
<text x="342" y="566" font-size="13" fill="#E8E8E8">the trusted fingerprints, replaced</text>
<text x="342" y="584" font-size="13" fill="#E8E8E8">whole, read without a lock</text>

<rect x="612" y="456" width="270" height="140" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="628" y="480" font-size="13" fill="#9AA0A6" letter-spacing="2">THE CONTEXT</text>
<text x="628" y="502" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">Tls</text>
<text x="628" y="522" font-size="13" fill="#E8E8E8">TLS 1.3 only; no session is</text>
<text x="628" y="542" font-size="13" fill="#E8E8E8">resumed; the JDK's own TLS,</text>
<text x="628" y="562" font-size="13" fill="#E8E8E8">no library</text>
<text x="628" y="584" font-size="13" fill="#9AA0A6"><tspan font-family="Menlo, Consolas, monospace">SelfSigned</tspan> writes the certificate</text>

<rect x="898" y="456" width="262" height="140" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="914" y="480" font-size="13" fill="#9AA0A6" letter-spacing="2">3 · UNPAIR</text>
<text x="914" y="502" font-size="13" fill="#E8E8E8">no session resumes, so the</text>
<text x="914" y="522" font-size="13" fill="#E8E8E8">next connection is refused;</text>
<text x="914" y="546" font-size="13" fill="#E8E8E8">an open connection is checked</text>
<text x="914" y="566" font-size="13" fill="#E8E8E8">again and ended once its key</text>
<text x="914" y="584" font-size="13" fill="#E8E8E8">is no longer pinned</text>

<text x="40" y="630" font-size="13" fill="#9AA0A6">A connection speaks for the machine its certificate names: the gateway stamps that machine as <tspan font-family="Menlo, Consolas, monospace">frontear-origin</tspan> on every message it sends,</text>
<text x="40" y="650" font-size="13" fill="#9AA0A6">whatever the client set there, and its gate lets it publish only what a remote machine may.</text>

<line x1="40" y1="678" x2="1160" y2="678" stroke="#2A2A2A" stroke-width="1"/>
<rect x="40" y="692" width="14" height="14" rx="3" fill="#E7C55A"/><text x="60" y="704" font-size="13" fill="#9AA0A6">what decides trust</text>
<rect x="200" y="692" width="14" height="14" rx="3" fill="#6FAEE8"/><text x="220" y="704" font-size="13" fill="#9AA0A6">comando, on each machine</text>
<text x="1160" y="704" font-size="13" fill="#9AA0A6" text-anchor="end">comando · docs/frontear.md</text>
</svg>
