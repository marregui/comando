<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>cdb: three doors in, one folder of column files on disk</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></radialGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA0A6"/></marker>
</defs>
<rect width="1100" height="600" fill="url(#bg)"/>
<text x="40" y="46" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">CDB · THE WHOLE PICTURE</text>
<text x="40" y="78" font-size="24" font-weight="300" fill="#E8E8E8">Three doors in, one folder of column files on disk</text>

<!-- clients -->
<rect x="40" y="120" width="290" height="86" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.2"/>
<text x="56" y="147" font-size="15" fill="#AEB6C1">your scripts and tools</text>
<text x="56" y="170" font-size="13" font-weight="300" fill="#C9CDD2">curl, a program, the kit's tools:</text>
<text x="56" y="189" font-size="13" font-weight="300" fill="#C9CDD2">SQL and rows over HTTP</text>

<rect x="40" y="236" width="290" height="86" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="56" y="263" font-size="15" fill="#6FAEE8">comando</text>
<text x="56" y="286" font-size="13" font-weight="300" fill="#C9CDD2">writes its metrics over HTTP;</text>
<text x="56" y="305" font-size="13" font-weight="300" fill="#C9CDD2">its SQL panels use the wire</text>

<rect x="40" y="352" width="290" height="86" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.2"/>
<text x="56" y="379" font-size="15" fill="#AEB6C1">PostgreSQL clients</text>
<text x="56" y="402" font-size="13" font-weight="300" fill="#C9CDD2">pgjdbc, Grafana's PostgreSQL</text>
<text x="56" y="421" font-size="13" font-weight="300" fill="#C9CDD2">data source</text>

<!-- cdb -->
<rect x="430" y="104" width="300" height="350" rx="10" fill="#191919" stroke="#E7C55A" stroke-width="1.6"/>
<text x="450" y="136" font-size="20" fill="#E7C55A">cdb</text>
<text x="496" y="136" font-size="13" font-weight="300" fill="#9AA0A6">one Java process, JDK only</text>

<rect x="450" y="158" width="260" height="78" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1"/>
<text x="466" y="186" font-size="15" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">GET /exec</text>
<text x="466" y="212" font-size="13" font-weight="300" fill="#C9CDD2">SQL in, JSON out</text>

<rect x="450" y="252" width="260" height="78" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1"/>
<text x="466" y="280" font-size="15" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">POST /write</text>
<text x="466" y="306" font-size="13" font-weight="300" fill="#C9CDD2">rows in, as line protocol</text>

<rect x="450" y="346" width="260" height="78" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1"/>
<text x="466" y="374" font-size="15" fill="#E8E8E8">PostgreSQL wire</text>
<text x="466" y="400" font-size="13" font-weight="300" fill="#C9CDD2">SQL in, rows out, protocol 3.0</text>

<!-- arrows clients to doors -->
<line x1="330" y1="150" x2="448" y2="190" stroke="#9AA0A6" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="330" y1="180" x2="448" y2="278" stroke="#9AA0A6" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="330" y1="270" x2="448" y2="298" stroke="#6FAEE8" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="330" y1="300" x2="448" y2="372" stroke="#6FAEE8" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="330" y1="395" x2="448" y2="392" stroke="#9AA0A6" stroke-width="1.1" marker-end="url(#a)"/>

<!-- disk -->
<rect x="840" y="104" width="220" height="350" rx="10" fill="#1E1E1E" stroke="#9AA0A6" stroke-width="1.2"/>
<text x="858" y="134" font-size="15" fill="#E8E8E8">the data root</text>
<text x="858" y="155" font-size="13" font-weight="300" fill="#9AA0A6">a folder on your disk</text>
<g font-family="Menlo, Consolas, monospace" font-size="13" fill="#C9CDD2">
<text x="858" y="192" fill="#E7C55A">rooms/</text>
<text x="874" y="214">_meta _txn _wal</text>
<text x="874" y="236" fill="#E8E8E8">2026-11-18.1/</text>
<text x="890" y="258">ts.d</text>
<text x="890" y="280">room.d</text>
<text x="890" y="302">temperature.d</text>
<text x="874" y="324" fill="#E8E8E8">2026-11-19.2/</text>
<text x="890" y="346">ts.d</text>
<text x="890" y="368">room.d</text>
<text x="890" y="390">temperature.d</text>
</g>
<text x="858" y="420" font-size="13" font-weight="300" fill="#9AA0A6">one folder per day,</text>
<text x="858" y="439" font-size="13" font-weight="300" fill="#9AA0A6">one file per column</text>

<line x1="730" y1="279" x2="838" y2="279" stroke="#E7C55A" stroke-width="1.3" marker-end="url(#a)"/>
<text x="785" y="268" text-anchor="middle" font-size="13" font-weight="300" fill="#C9CDD2">files</text>

<!-- legend -->
<line x1="40" y1="492" x2="1060" y2="492" stroke="#2E2E2E" stroke-width="1"/>
<rect x="40" y="514" width="14" height="14" rx="3" fill="#E7C55A"/>
<text x="62" y="526" font-size="13" fill="#C9CDD2">cdb</text>
<rect x="120" y="514" width="14" height="14" rx="3" fill="#6FAEE8"/>
<text x="142" y="526" font-size="13" fill="#C9CDD2">comando</text>
<rect x="240" y="514" width="14" height="14" rx="3" fill="#AEB6C1"/>
<text x="262" y="526" font-size="13" fill="#C9CDD2">everything else that speaks HTTP or the PostgreSQL wire</text>
<text x="1060" y="572" text-anchor="end" font-size="13" fill="#9AA0A6" letter-spacing="1">comando · docs/cdb</text>
</svg>
