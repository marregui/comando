<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The path of a cdb query: parse, plan, prune, execute as a tree of cursors, read a snapshot</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#9AA0A6" stroke-width="1.4"/></marker></defs>
<rect width="1100" height="640" fill="#161616"/>
<text x="40" y="44" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">MODULE · CDB · A QUERY</text>
<text x="40" y="76" font-size="22" font-weight="300" fill="#E8E8E8">Five steps from text to rows</text>

<rect x="40" y="100" width="1020" height="40" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="56" y="125" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">SELECT symbol, avg(price) FROM trades WHERE ts &gt;= '2026-11-15' AND price &gt; 100 GROUP BY symbol</text>

<rect x="40" y="170" width="188" height="96" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="56" y="196" font-size="13" fill="#9AA0A6" letter-spacing="2">1 · PARSE</text>
<text x="56" y="220" font-size="14" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">Lexer · Parser</text>
<text x="56" y="244" font-size="13" fill="#E8E8E8">text to a syntax tree</text>
<line x1="228" y1="218" x2="244" y2="218" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="248" y="170" width="188" height="96" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="264" y="196" font-size="13" fill="#9AA0A6" letter-spacing="2">2 · PLAN</text>
<text x="264" y="220" font-size="14" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">Planner · Binder</text>
<text x="264" y="244" font-size="13" fill="#E8E8E8">names, types, time range</text>
<line x1="436" y1="218" x2="452" y2="218" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="456" y="170" width="188" height="96" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="472" y="196" font-size="13" fill="#9AA0A6" letter-spacing="2">3 · PRUNE</text>
<text x="472" y="220" font-size="14" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">ColumnUse</text>
<text x="472" y="244" font-size="13" fill="#E8E8E8">only the columns used</text>
<line x1="644" y1="218" x2="660" y2="218" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="664" y="170" width="188" height="96" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="680" y="196" font-size="13" fill="#9AA0A6" letter-spacing="2">4 · EXECUTE</text>
<text x="680" y="220" font-size="14" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">Executor</text>
<text x="680" y="244" font-size="13" fill="#E8E8E8">builds a tree of cursors</text>
<line x1="852" y1="218" x2="868" y2="218" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="872" y="170" width="188" height="96" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<text x="888" y="196" font-size="13" fill="#9AA0A6" letter-spacing="2">5 · READ</text>
<text x="888" y="220" font-size="14" fill="#E7C55A" font-family="Menlo, Consolas, monospace">store</text>
<text x="888" y="244" font-size="13" fill="#E8E8E8">a snapshot, mapped files</text>

<text x="40" y="312" font-size="13" fill="#9AA0A6" letter-spacing="2">THE CURSOR TREE</text>
<text x="600" y="312" font-size="13" fill="#9AA0A6" letter-spacing="2">WHAT THE SCAN TOUCHES</text>

<rect x="40" y="326" width="500" height="62" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.2"/>
<text x="56" y="352" font-size="14" fill="#AEB6C1">the caller</text>
<text x="56" y="374" font-size="13" fill="#9AA0A6">asks for the next page until none is left</text>

<rect x="40" y="424" width="500" height="62" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="56" y="450" font-size="14" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">GroupByCursor</text>
<text x="56" y="472" font-size="13" fill="#9AA0A6">one bucket per symbol, an accumulator for avg(price)</text>

<rect x="40" y="522" width="500" height="62" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="56" y="548" font-size="14" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">ScanCursor</text>
<text x="56" y="570" font-size="13" fill="#9AA0A6">time range ts &gt;= …, scan term price &gt; 100</text>

<line x1="290" y1="424" x2="290" y2="392" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="290" y1="522" x2="290" y2="490" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>
<text x="304" y="412" font-size="13" fill="#E8E8E8">pages of up to 1,024 rows</text>
<text x="304" y="510" font-size="13" fill="#E8E8E8">pages of up to 1,024 rows</text>
<line x1="540" y1="553" x2="592" y2="553" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<text x="600" y="342" font-size="13" fill="#E8E8E8">partitions, one folder per day</text>
<rect x="600" y="354" width="58" height="40" rx="4" fill="#1E1E1E" stroke="#3A3A3A"/>
<rect x="664" y="354" width="58" height="40" rx="4" fill="#1E1E1E" stroke="#3A3A3A"/>
<rect x="728" y="354" width="58" height="40" rx="4" fill="#1E1E1E" stroke="#3A3A3A"/>
<rect x="792" y="354" width="58" height="40" rx="4" fill="#1E1E1E" stroke="#3A3A3A"/>
<rect x="856" y="354" width="58" height="40" rx="4" fill="#2A2618" stroke="#E7C55A" stroke-width="1.4"/>
<rect x="920" y="354" width="58" height="40" rx="4" fill="#2A2618" stroke="#E7C55A" stroke-width="1.4"/>
<rect x="984" y="354" width="58" height="40" rx="4" fill="#2A2618" stroke="#E7C55A" stroke-width="1.4"/>
<text x="629" y="379" font-size="13" fill="#9AA0A6" text-anchor="middle">11-11</text>
<text x="693" y="379" font-size="13" fill="#9AA0A6" text-anchor="middle">11-12</text>
<text x="757" y="379" font-size="13" fill="#9AA0A6" text-anchor="middle">11-13</text>
<text x="821" y="379" font-size="13" fill="#9AA0A6" text-anchor="middle">11-14</text>
<text x="885" y="379" font-size="13" fill="#E8E8E8" text-anchor="middle">11-15</text>
<text x="949" y="379" font-size="13" fill="#E8E8E8" text-anchor="middle">11-16</text>
<text x="1013" y="379" font-size="13" fill="#E8E8E8" text-anchor="middle">11-17</text>
<text x="600" y="416" font-size="13" fill="#9AA0A6">the time range leaves four folders unopened</text>

<text x="600" y="456" font-size="13" fill="#E8E8E8">columns, one file each</text>
<rect x="600" y="468" width="84" height="40" rx="4" fill="#2A2618" stroke="#E7C55A" stroke-width="1.4"/>
<rect x="690" y="468" width="84" height="40" rx="4" fill="#2A2618" stroke="#E7C55A" stroke-width="1.4"/>
<rect x="780" y="468" width="84" height="40" rx="4" fill="#2A2618" stroke="#E7C55A" stroke-width="1.4"/>
<rect x="870" y="468" width="84" height="40" rx="4" fill="#1E1E1E" stroke="#3A3A3A"/>
<rect x="960" y="468" width="84" height="40" rx="4" fill="#1E1E1E" stroke="#3A3A3A"/>
<text x="642" y="493" font-size="13" fill="#E8E8E8" text-anchor="middle" font-family="Menlo, Consolas, monospace">ts</text>
<text x="732" y="493" font-size="13" fill="#E8E8E8" text-anchor="middle" font-family="Menlo, Consolas, monospace">symbol</text>
<text x="822" y="493" font-size="13" fill="#E8E8E8" text-anchor="middle" font-family="Menlo, Consolas, monospace">price</text>
<text x="912" y="493" font-size="13" fill="#9AA0A6" text-anchor="middle" font-family="Menlo, Consolas, monospace">amount</text>
<text x="1002" y="493" font-size="13" fill="#9AA0A6" text-anchor="middle" font-family="Menlo, Consolas, monospace">side</text>
<text x="600" y="530" font-size="13" fill="#9AA0A6">the plan names three columns; the other files stay unmapped</text>

<text x="600" y="566" font-size="13" fill="#E8E8E8">blocks of 4,096 rows in the price file</text>
<text x="600" y="586" font-size="13" fill="#9AA0A6">a zone map skips a block whose maximum is 100 or less</text>

<rect x="600" y="606" width="14" height="14" rx="3" fill="#E7C55A"/><text x="620" y="618" font-size="13" fill="#9AA0A6">read</text>
<rect x="680" y="606" width="14" height="14" rx="3" fill="#1E1E1E" stroke="#3A3A3A"/><text x="700" y="618" font-size="13" fill="#9AA0A6">skipped</text>
<text x="40" y="618" font-size="13" fill="#9AA0A6">comando · docs/modules/cdb</text>
</svg>
