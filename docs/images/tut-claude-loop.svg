<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>How Claude works with your data: your prompt goes to the Claude Code session, the session calls one of comando's tools, a read-only statement runs at once on cdb, any other statement waits on an approval card until you press Run or Deny, and the result goes back to Claude, which answers</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E7C55A"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D98E5F"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6FAEE8"/></marker>
  </defs>
  <rect width="1000" height="620" fill="url(#bg)"/>
  <text x="32" y="44" font-size="13" letter-spacing="3" fill="#E7C55A">CLAUDE AND YOUR DATA</text>
  <text x="32" y="78" font-size="24" font-weight="300" fill="#E8E8E8">The model asks, a tool acts, you decide on writes</text>

  <!-- you -->
  <rect x="32" y="116" width="210" height="110" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="2"/>
  <text x="52" y="144" font-size="13" letter-spacing="2.5" fill="#E7C55A">YOU</text>
  <text x="52" y="172" font-size="15" fill="#E8E8E8">write a prompt</text>
  <text x="52" y="198" font-size="13" fill="#9AA0A6">a block in the editor</text>

  <!-- claude -->
  <rect x="312" y="116" width="250" height="110" rx="8" fill="#1E1E1E" stroke="#D98E5F" stroke-width="1.3"/>
  <text x="332" y="144" font-size="13" letter-spacing="2.5" fill="#D98E5F">CLAUDE CODE SESSION</text>
  <text x="332" y="172" font-size="15" fill="#E8E8E8">a model that picks tools</text>
  <text x="332" y="198" font-size="13" fill="#9AA0A6">it sees only what tools return</text>

  <!-- tools -->
  <rect x="632" y="116" width="336" height="186" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.3"/>
  <text x="652" y="144" font-size="13" letter-spacing="2.5" fill="#6FAEE8">COMANDO'S TOOLS</text>
  <g font-size="13" font-family="Menlo, Consolas, monospace" fill="#E8E8E8">
    <text x="652" y="174">db_describe</text><text x="652" y="198">db_run_sql</text><text x="652" y="222">result_read</text>
    <text x="652" y="246">result_stats</text><text x="652" y="270">ui_plot</text><text x="652" y="294">ui_insert</text>
  </g>
  <g font-size="13" fill="#9AA0A6">
    <text x="772" y="174">tables and columns</text><text x="772" y="198">run one statement</text><text x="772" y="222">rows of a result</text>
    <text x="772" y="246">figures of a result</text><text x="772" y="270">draw a plot tab</text><text x="772" y="294">write in your editor</text>
  </g>

  <!-- arrows top -->
  <line x1="242" y1="156" x2="308" y2="156" stroke="#E7C55A" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="275" y="146" font-size="13" text-anchor="middle" fill="#9AA0A6">prompt</text>
  <line x1="562" y1="156" x2="628" y2="156" stroke="#D98E5F" stroke-width="1.5" marker-end="url(#o)"/>
  <text x="595" y="146" font-size="13" text-anchor="middle" fill="#9AA0A6">tool call</text>
  <line x1="632" y1="200" x2="566" y2="200" stroke="#6FAEE8" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="598" y="220" font-size="13" text-anchor="middle" fill="#9AA0A6">result</text>
  <line x1="312" y1="200" x2="246" y2="200" stroke="#D98E5F" stroke-width="1.5" marker-end="url(#o)"/>
  <text x="278" y="220" font-size="13" text-anchor="middle" fill="#9AA0A6">answer</text>

  <!-- the gate -->
  <line x1="800" y1="302" x2="800" y2="344" stroke="#6FAEE8" stroke-width="1.5" marker-end="url(#b)"/>
  <rect x="632" y="348" width="336" height="84" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.3"/>
  <text x="652" y="376" font-size="15" fill="#E8E8E8">Is the statement read-only?</text>
  <text x="652" y="400" font-size="13" fill="#9AA0A6">it starts with SELECT, WITH, SHOW,</text>
  <text x="652" y="420" font-size="13" fill="#9AA0A6">EXPLAIN, DESCRIBE or TABLES</text>

  <!-- yes: cdb -->
  <line x1="880" y1="432" x2="880" y2="468" stroke="#6FAEE8" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="892" y="456" font-size="13" fill="#9AA0A6">yes</text>
  <rect x="632" y="472" width="336" height="76" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="2"/>
  <text x="652" y="500" font-size="13" letter-spacing="2.5" fill="#E7C55A">CDB</text>
  <text x="652" y="528" font-size="13" fill="#E8E8E8">runs it on the panel's connection</text>

  <!-- no: the card -->
  <line x1="632" y1="381" x2="566" y2="381" stroke="#6FAEE8" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="598" y="371" font-size="13" text-anchor="middle" fill="#9AA0A6">no</text>
  <rect x="232" y="326" width="330" height="140" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="2"/>
  <text x="252" y="354" font-size="13" letter-spacing="2.5" fill="#E7C55A">APPROVAL CARD · YOUR DECISION</text>
  <text x="252" y="382" font-size="13" fill="#E8E8E8">the connection and the exact statement</text>
  <rect x="252" y="402" width="120" height="40" rx="6" fill="#161616" stroke="#E7C55A" stroke-width="1.2"/>
  <text x="312" y="427" font-size="13" text-anchor="middle" fill="#E7C55A">Run</text>
  <rect x="388" y="402" width="154" height="40" rx="6" fill="#161616" stroke="#9AA0A6" stroke-width="1.2"/>
  <text x="465" y="427" font-size="13" text-anchor="middle" fill="#E8E8E8">Deny, with a note</text>

  <!-- run -> cdb -->
  <path d="M562 440 H596 V510 H628" stroke="#E7C55A" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="604" y="470" font-size="13" fill="#9AA0A6">Run</text>
  <!-- deny -> claude -->
  <path d="M437 326 V230" stroke="#D98E5F" stroke-width="1.5" fill="none" marker-end="url(#o)"/>
  <text x="448" y="278" font-size="13" fill="#9AA0A6">Deny: Claude</text>
  <text x="448" y="296" font-size="13" fill="#9AA0A6">reads your note</text>

  <!-- production -->
  <rect x="32" y="490" width="530" height="58" rx="8" fill="#1E1E1E" stroke="#9AA0A6" stroke-width="0.8"/>
  <text x="52" y="514" font-size="13" fill="#E8E8E8">A connection marked Production never gets a card:</text>
  <text x="52" y="534" font-size="13" fill="#9AA0A6">comando refuses every statement from Claude that is not read-only.</text>

  <!-- legend -->
  <g font-size="13" fill="#9AA0A6">
    <rect x="32" y="574" width="14" height="14" rx="3" fill="#E7C55A"/><text x="54" y="586">you and cdb</text>
    <rect x="160" y="574" width="14" height="14" rx="3" fill="#D98E5F"/><text x="182" y="586">Claude Code</text>
    <rect x="290" y="574" width="14" height="14" rx="3" fill="#6FAEE8"/><text x="312" y="586">comando</text>
    <text x="968" y="586" text-anchor="end">comando · docs/tutorial</text>
  </g>
</svg>
