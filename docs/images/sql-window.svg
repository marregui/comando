<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="484" viewBox="0 0 1100 484" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>How a window function works: every Madrid row stays and reads the temperature of the row before it; GROUP BY would fold the five rows into one</title>
<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6FAEE8" stroke-width="1.4"/></marker></defs>
<rect width="1100" height="484" fill="#161616"/>
<text x="40" y="44" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">CDB SQL · WINDOW FUNCTIONS</text>
<text x="40" y="76" font-size="22" font-weight="300" fill="#E8E8E8">A window function keeps every row and lets it look at its neighbours.</text>

<rect x="40" y="98" width="1020" height="40" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="56" y="123" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace"><tspan fill="#E7C55A">SELECT</tspan> ts, city, temp, temp - lag(temp) <tspan fill="#E7C55A">OVER</tspan> (PARTITION BY city ORDER BY ts) AS change <tspan fill="#E7C55A">FROM</tspan> weather <tspan fill="#E7C55A">WHERE</tspan> city = 'Madrid'</text>

<g font-size="13" fill="#9AA0A6" letter-spacing="2">
<text x="40" y="168">THE WINDOW OF MADRID, IN TIME ORDER</text><text x="690" y="168">FOLD OR KEEP</text>
</g>
<rect x="40" y="178" width="600" height="200" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<path d="M40,208 H640" stroke="#3A3A3A" stroke-width="1"/>
<g stroke="#2A2A2A" stroke-width="1"><path d="M40,242 H640"/><path d="M40,276 H640"/><path d="M40,310 H640"/><path d="M40,344 H640"/></g>
<g font-family="Menlo, Consolas, monospace" font-size="13">
<text x="54" y="198" fill="#9AA0A6">ts</text><text x="200" y="198" fill="#9AA0A6">temp</text><text x="330" y="198" fill="#6FAEE8">lag(temp)</text><text x="500" y="198" fill="#E7C55A">change</text>
</g>
<g font-family="Menlo, Consolas, monospace" font-size="13" fill="#E8E8E8">
<text x="54" y="230">06-01 06:00</text><text x="200" y="230">18.0</text><text x="330" y="230" fill="#9AA0A6">NULL</text><text x="500" y="230" fill="#9AA0A6">NULL</text>
<text x="54" y="264">06-01 12:00</text><text x="200" y="264">29.5</text><text x="330" y="264" fill="#6FAEE8">18.0</text><text x="500" y="264" fill="#E7C55A">11.5</text>
<text x="54" y="298">06-01 18:00</text><text x="200" y="298">27.0</text><text x="330" y="298" fill="#6FAEE8">29.5</text><text x="500" y="298" fill="#E7C55A">-2.5</text>
<text x="54" y="332">06-02 06:00</text><text x="200" y="332">19.5</text><text x="330" y="332" fill="#6FAEE8">27.0</text><text x="500" y="332" fill="#E7C55A">-7.5</text>
<text x="54" y="366">06-02 12:00</text><text x="200" y="366">31.0</text><text x="330" y="366" fill="#6FAEE8">19.5</text><text x="500" y="366" fill="#E7C55A">11.5</text>
</g>
<g fill="none" stroke="#6FAEE8" stroke-width="1.2" marker-end="url(#b)">
<path d="M240,229 L322,256"/><path d="M240,263 L322,290"/><path d="M240,297 L322,324"/><path d="M240,331 L322,358"/>
</g>
<text x="556" y="230" font-size="13" fill="#9AA0A6">no row before</text>

<g fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"><rect x="690" y="178" width="370" height="92" rx="8"/><rect x="690" y="286" width="370" height="92" rx="8"/></g>
<text x="706" y="200" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">GROUP BY city</text>
<text x="1044" y="200" font-size="13" fill="#9AA0A6" text-anchor="end">5 rows in, 1 row out</text>
<text x="706" y="308" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">OVER (PARTITION BY city)</text>
<text x="1044" y="308" font-size="13" fill="#9AA0A6" text-anchor="end">5 rows in, 5 rows out</text>
<g fill="#6FAEE8" fill-opacity="0.55">
<rect x="706" y="212" width="130" height="6"/><rect x="706" y="223" width="130" height="6"/><rect x="706" y="234" width="130" height="6"/><rect x="706" y="245" width="130" height="6"/><rect x="706" y="256" width="130" height="6"/>
<rect x="706" y="320" width="130" height="6"/><rect x="706" y="331" width="130" height="6"/><rect x="706" y="342" width="130" height="6"/><rect x="706" y="353" width="130" height="6"/><rect x="706" y="364" width="130" height="6"/>
<rect x="900" y="320" width="100" height="6"/><rect x="900" y="331" width="100" height="6"/><rect x="900" y="342" width="100" height="6"/><rect x="900" y="353" width="100" height="6"/><rect x="900" y="364" width="100" height="6"/>
</g>
<g fill="#E7C55A">
<rect x="900" y="234" width="144" height="6"/>
<rect x="1004" y="320" width="40" height="6"/><rect x="1004" y="331" width="40" height="6"/><rect x="1004" y="342" width="40" height="6"/><rect x="1004" y="353" width="40" height="6"/><rect x="1004" y="364" width="40" height="6"/>
</g>
<g fill="#9AA0A6"><path d="M860,231 L874,237 L860,243 Z"/><path d="M860,339 L874,345 L860,351 Z"/></g>

<text x="40" y="410" font-size="14" fill="#E8E8E8">PARTITION BY city gives each city its own window. ORDER BY ts makes "the row before" mean "the reading before".</text>
<text x="40" y="432" font-size="14" fill="#E8E8E8">Gold is what the function adds: one value per group, or one value per row.</text>
<text x="40" y="466" font-size="13" fill="#9AA0A6" letter-spacing="1">comando · docs/cdb-sql</text>
</svg>
