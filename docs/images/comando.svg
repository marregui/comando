<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- comando: three steps ahead (record 153). Three chevrons on a graphite tile: grey the kit, gold the brain,
       Claude's orange the work; each layer pushes the next forward. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2E2E"/>
      <stop offset="0.55" stop-color="#1C1C1C"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6DE8E"/>
      <stop offset="0.5" stop-color="#E7C55A"/>
      <stop offset="1" stop-color="#B8923A"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0A07F"/>
      <stop offset="1" stop-color="#C96442"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <!-- drop shadow, tile, top sheen, rim light -->
  <rect x="100" y="124" width="824" height="824" rx="186" fill="#000" opacity="0.45" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <rect x="104" y="104" width="816" height="816" rx="182" fill="none" stroke="url(#rim)" stroke-width="8"/>
  <!-- the kit, the brain, the work -->
  <g clip-path="url(#clip)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="70">
    <path d="M 270 340 L 430 512 L 270 684" stroke="#8C877C"/>
    <path d="M 430 340 L 590 512 L 430 684" stroke="url(#gold)"/>
    <path d="M 590 340 L 750 512 L 590 684" stroke="url(#orange)"/>
  </g>
</svg>
