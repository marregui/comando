<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>The fabric, one of two: by default EmbeddedEdge starts a HiveMQ Edge as a child process; with -Dcomando.fabric=frontear, FrontearFabric hosts a frontear node inside comando's own JVM; either way every instance connects as an MQTT 5 client to 127.0.0.1 port 18883</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9AA0A6" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="640" fill="url(#bg)"/>
  <text x="40" y="44" font-size="13" letter-spacing="3" fill="#E7C55A">MODULE APP · THE FABRIC</text>
  <text x="40" y="78" font-size="24" font-weight="300" fill="#E8E8E8">Two ways to run the broker, one address to meet on</text>

  <!-- comando Edge -->
  <rect x="40" y="106" width="448" height="290" rx="10" fill="none" stroke="#3A3A3A" stroke-width="1"/>
  <text x="58" y="132" font-size="13" letter-spacing="2" fill="#6FAEE8">COMANDO EDGE · THE DEFAULT</text>
  <rect x="58" y="150" width="172" height="76" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.3"/>
  <text x="72" y="180" font-family="Menlo, Consolas, monospace" font-size="14" fill="#6FAEE8">EmbeddedEdge</text>
  <text x="72" y="204" font-size="13" fill="#9AA0A6">inside comando's JVM</text>
  <rect x="298" y="150" width="172" height="76" rx="8" fill="#1E1E1E" stroke="#9AA0A6" stroke-width="1.3"/>
  <text x="312" y="180" font-size="15" fill="#E8E8E8">HiveMQ Edge</text>
  <text x="312" y="204" font-size="13" fill="#9AA0A6">a process of its own</text>
  <line x1="230" y1="188" x2="296" y2="188" stroke="#9AA0A6" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="264" y="178" text-anchor="middle" font-size="13" fill="#9AA0A6">starts</text>
  <text x="58" y="262" font-size="13" fill="#E8E8E8">MQTT 18883 · WebSocket 18800 · admin API 18080 · JMX 18010</text>
  <text x="58" y="296" font-family="Menlo, Consolas, monospace" font-size="13" fill="#E8E8E8">~/.comando-edge.json</text>
  <text x="226" y="296" font-size="13" fill="#9AA0A6">who started it, on which ports</text>
  <text x="58" y="330" font-family="Menlo, Consolas, monospace" font-size="13" fill="#E8E8E8">edge/</text>
  <text x="108" y="330" font-size="13" fill="#9AA0A6">the installed release, its data and its log</text>
  <text x="58" y="364" font-size="13" fill="#9AA0A6">A pinned release, downloaded once, checked by SHA-256.</text>

  <!-- frontear -->
  <rect x="512" y="106" width="448" height="290" rx="10" fill="none" stroke="#3A3A3A" stroke-width="1"/>
  <text x="530" y="132" font-size="13" letter-spacing="2" fill="#6FAEE8">FRONTEAR · -Dcomando.fabric=frontear</text>
  <rect x="530" y="150" width="412" height="76" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.3"/>
  <text x="544" y="180" font-family="Menlo, Consolas, monospace" font-size="14" fill="#6FAEE8">FrontearFabric</text>
  <text x="544" y="204" font-size="13" fill="#9AA0A6">inside comando's JVM</text>
  <rect x="722" y="162" width="208" height="52" rx="6" fill="#161616" stroke="#6FAEE8" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="826" y="184" text-anchor="middle" font-size="13" fill="#E8E8E8">a frontear node,</text>
  <text x="826" y="202" text-anchor="middle" font-size="13" fill="#E8E8E8">named comando</text>
  <text x="530" y="262" font-size="13" fill="#E8E8E8">MQTT 18883 · no download, no second process</text>
  <text x="530" y="296" font-family="Menlo, Consolas, monospace" font-size="13" fill="#E8E8E8">~/.comando-fabric.json</text>
  <text x="714" y="296" font-size="13" fill="#9AA0A6">who hosts it</text>
  <text x="530" y="330" font-family="Menlo, Consolas, monospace" font-size="13" fill="#E8E8E8">fabric/</text>
  <text x="596" y="330" font-size="13" fill="#9AA0A6">its data, and the control key pair</text>
  <text x="530" y="364" font-family="Menlo, Consolas, monospace" font-size="13" fill="#E8E8E8">pod.key  pod.pub</text>
  <text x="666" y="364" font-size="13" fill="#9AA0A6">Ed25519: one signs, one checks</text>

  <!-- the meeting point -->
  <line x1="264" y1="396" x2="264" y2="430" stroke="#9AA0A6" stroke-width="1.3"/>
  <line x1="736" y1="396" x2="736" y2="430" stroke="#9AA0A6" stroke-width="1.3"/>
  <rect x="140" y="430" width="720" height="40" rx="20" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
  <text x="500" y="455" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#E7C55A">127.0.0.1:18883 · MQTT 5 · one of the two, never both</text>

  <g stroke="#9AA0A6" stroke-width="1.3">
    <line x1="235" y1="506" x2="235" y2="474" marker-end="url(#ar)"/>
    <line x1="500" y1="506" x2="500" y2="474" marker-end="url(#ar)"/>
    <line x1="765" y1="506" x2="765" y2="474" marker-end="url(#ar)"/>
  </g>
  <g fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.3">
    <rect x="140" y="508" width="190" height="60" rx="8"/>
    <rect x="405" y="508" width="190" height="60" rx="8"/>
    <rect x="670" y="508" width="190" height="60" rx="8"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#AEB6C1" text-anchor="middle">
    <text x="235" y="533">MqttPeerBroker</text><text x="500" y="533">MqttPeerBroker</text><text x="765" y="533">MqttPeerBroker</text>
  </g>
  <g font-size="13" fill="#9AA0A6" text-anchor="middle">
    <text x="235" y="554">instance one</text><text x="500" y="554">instance two</text><text x="765" y="554">instance three</text>
  </g>

  <!-- legend -->
  <rect x="40" y="594" width="14" height="14" rx="3" fill="#6FAEE8"/>
  <text x="62" y="606" font-size="13" fill="#9AA0A6">comando</text>
  <rect x="150" y="594" width="14" height="14" rx="3" fill="#AEB6C1"/>
  <text x="172" y="606" font-size="13" fill="#9AA0A6">instances, each a client named comando-&lt;instance&gt;</text>
  <rect x="520" y="594" width="14" height="14" rx="3" fill="#E7C55A"/>
  <text x="542" y="606" font-size="13" fill="#9AA0A6">where they meet</text>
  <text x="40" y="630" font-size="13" fill="#9AA0A6">comando · docs/modules/app.md</text>
</svg>
