<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="476" viewBox="0 0 1100 476" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Partitions and TTL: a table cut into one partition per day; TTL 3 DAYS drops the three oldest, and a query for one day reads one partition</title>
<defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#E7C55A" stroke-width="1.4"/></marker></defs>
<rect width="1100" height="476" fill="#161616"/>
<text x="40" y="44" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">CDB SQL · PARTITIONS AND TTL</text>
<text x="40" y="76" font-size="22" font-weight="300" fill="#E8E8E8">A table is cut by time. Old pieces drop whole. A query opens only the pieces it needs.</text>

<rect x="40" y="98" width="1020" height="40" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="56" y="123" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace"><tspan fill="#E7C55A">CREATE TABLE</tspan> week (ts TIMESTAMP, v LONG) <tspan fill="#E7C55A">TIMESTAMP</tspan>(ts) <tspan fill="#E7C55A">PARTITION BY</tspan> DAY <tspan fill="#E7C55A">TTL</tspan> 3 DAYS</text>

<text x="40" y="168" font-size="13" fill="#9AA0A6" letter-spacing="2">ONE ROW A DAY AT 12:00, SEVEN DAYS · ONE PARTITION PER DAY</text>

<g fill="none" stroke="#5A5A5A" stroke-width="1" stroke-dasharray="5 4">
<rect x="40" y="226" width="132" height="76" rx="8"/><rect x="188" y="226" width="132" height="76" rx="8"/><rect x="336" y="226" width="132" height="76" rx="8"/>
</g>
<g fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2">
<rect x="484" y="226" width="132" height="76" rx="8"/><rect x="632" y="226" width="132" height="76" rx="8"/><rect x="928" y="226" width="132" height="76" rx="8"/>
</g>
<rect x="780" y="226" width="132" height="76" rx="8" fill="#E7C55A" fill-opacity="0.13" stroke="#E7C55A" stroke-width="1.6"/>
<g font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">
<text x="106" y="256" fill="#9AA0A6">2026-06-01</text><text x="254" y="256" fill="#9AA0A6">2026-06-02</text><text x="402" y="256" fill="#9AA0A6">2026-06-03</text>
<text x="550" y="256" fill="#E8E8E8">2026-06-04</text><text x="698" y="256" fill="#E8E8E8">2026-06-05</text><text x="846" y="256" fill="#E8E8E8">2026-06-06</text><text x="994" y="256" fill="#E8E8E8">2026-06-07</text>
</g>
<g font-size="13" text-anchor="middle">
<text x="106" y="282" fill="#9AA0A6">dropped</text><text x="254" y="282" fill="#9AA0A6">dropped</text><text x="402" y="282" fill="#9AA0A6">dropped</text>
<text x="550" y="282" fill="#6FAEE8">kept</text><text x="698" y="282" fill="#6FAEE8">kept</text><text x="846" y="282" fill="#E7C55A">kept · read</text><text x="994" y="282" fill="#6FAEE8">kept</text>
</g>

<path d="M550,206 H994" stroke="#E8E8E8" stroke-width="1.2"/>
<path d="M550,200 V226 M550,302 V320" stroke="#E8E8E8" stroke-width="1.2"/>
<path d="M994,200 V212" stroke="#E8E8E8" stroke-width="1.2"/>
<circle cx="994" cy="206" r="4" fill="#E8E8E8"/>
<text x="772" y="196" font-size="13" fill="#E8E8E8" text-anchor="middle">TTL 3 DAYS, counted back from the newest row</text>
<text x="550" y="336" font-size="13" fill="#E8E8E8" text-anchor="middle">the cut: 2026-06-04 12:00</text>
<text x="40" y="336" font-size="13" fill="#9AA0A6">ends before the cut: the whole partition goes</text>

<rect x="560" y="366" width="500" height="40" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.2"/>
<text x="576" y="391" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace"><tspan fill="#E7C55A">SELECT</tspan> sum(v) <tspan fill="#E7C55A">FROM</tspan> week <tspan fill="#E7C55A">WHERE</tspan> ts IN '2026-06-06'</text>
<path d="M846,366 V308" fill="none" stroke="#E7C55A" stroke-width="1.2" marker-end="url(#c)"/>
<text x="40" y="383" font-size="14" fill="#E8E8E8">2026-06-04 straddles the cut and stays whole.</text>
<text x="40" y="403" font-size="14" fill="#E8E8E8">The query names one day, so cdb reads one partition of four.</text>

<g font-size="13" fill="#9AA0A6">
<rect x="40" y="426" width="22" height="14" rx="3" fill="none" stroke="#5A5A5A" stroke-dasharray="5 4"/><text x="72" y="438">dropped by the TTL</text>
<rect x="230" y="426" width="22" height="14" rx="3" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/><text x="262" y="438">kept</text>
<rect x="320" y="426" width="22" height="14" rx="3" fill="#E7C55A" fill-opacity="0.13" stroke="#E7C55A" stroke-width="1.6"/><text x="352" y="438">read by the query</text>
</g>
<text x="40" y="462" font-size="13" fill="#9AA0A6" letter-spacing="1">comando · docs/cdb-sql</text>
</svg>
