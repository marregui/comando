<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The frontear octopus network: every comando instance hosts a node on 127.0.0.1 and links it to every other instance's node at hop limit 1 (the border gateway at 3 while a machine is paired), through the node's control plane alexander and signed with the instance's pod key; the instance's sessions reach the network through its client; main's node is the border gateway, which links over pinned TLS 1.3 to another machine's border gateway</title>
<defs>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#E7C55A" stroke-width="1.4"/></marker>
</defs>
<rect width="1200" height="790" fill="#161616"/>
<text x="40" y="44" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">FRONTEAR · THE OCTOPUS NETWORK</text>
<text x="40" y="76" font-size="22" font-weight="300" fill="#E8E8E8">Every instance hosts a node and links it to the others; main's node is the border gateway</text>

<!-- machine a -->
<rect x="30" y="100" width="730" height="460" rx="10" fill="none" stroke="#3A3A3A" stroke-width="1"/>
<text x="46" y="124" font-size="13" fill="#9AA0A6" letter-spacing="2">MACHINE a · ONE COMANDO PROCESS PER INSTANCE</text>

<!-- node build -->
<rect x="50" y="140" width="250" height="140" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.4"/>
<text x="66" y="164" font-size="13" fill="#E7C55A" letter-spacing="2">NODE build</text>
<text x="284" y="164" font-size="13" fill="#9AA0A6" text-anchor="end" font-family="Menlo, Consolas, monospace">127.0.0.1</text>
<text x="66" y="188" font-size="13" fill="#E8E8E8">a gateway, alexander, a link</text>
<text x="66" y="206" font-size="13" fill="#E8E8E8">to every other node</text>
<text x="66" y="228" font-size="13" fill="#6FAEE8">links put signed with <tspan font-family="Menlo, Consolas, monospace">pod.key</tspan></text>
<rect x="62" y="238" width="226" height="32" rx="5" fill="#242424" stroke="#AEB6C1"/>
<text x="74" y="259" font-size="13" fill="#AEB6C1">client <tspan font-family="Menlo, Consolas, monospace" fill="#E8E8E8">comando-build</tspan></text>

<!-- node review -->
<rect x="50" y="400" width="250" height="140" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.4"/>
<text x="66" y="424" font-size="13" fill="#E7C55A" letter-spacing="2">NODE review</text>
<text x="284" y="424" font-size="13" fill="#9AA0A6" text-anchor="end" font-family="Menlo, Consolas, monospace">127.0.0.1</text>
<text x="66" y="448" font-size="13" fill="#E8E8E8">a gateway, alexander, a link</text>
<text x="66" y="466" font-size="13" fill="#E8E8E8">to every other node</text>
<text x="66" y="488" font-size="13" fill="#6FAEE8">links put signed with <tspan font-family="Menlo, Consolas, monospace">pod.key</tspan></text>
<rect x="62" y="498" width="226" height="32" rx="5" fill="#242424" stroke="#AEB6C1"/>
<text x="74" y="519" font-size="13" fill="#AEB6C1">client <tspan font-family="Menlo, Consolas, monospace" fill="#E8E8E8">comando-review</tspan></text>

<!-- node main, the border gateway -->
<rect x="440" y="214" width="300" height="236" rx="8" fill="#2B2618" stroke="#E7C55A" stroke-width="1.8"/>
<text x="456" y="238" font-size="13" fill="#E7C55A" letter-spacing="2">BORDER GATEWAY · NODE main</text>
<text x="456" y="260" font-size="13" fill="#9AA0A6" font-family="Menlo, Consolas, monospace">127.0.0.1</text>
<text x="456" y="284" font-size="13" fill="#E8E8E8">a gateway, alexander, a link to every</text>
<text x="456" y="302" font-size="13" fill="#E8E8E8">other node; hop limit 3 while paired</text>
<text x="456" y="328" font-size="13" fill="#E8E8E8">remote listener on this machine's</text>
<text x="456" y="346" font-size="13" fill="#E8E8E8">address: TLS 1.3, port 18893, at most</text>
<text x="456" y="364" font-size="13" fill="#E8E8E8">64 connections</text>
<text x="456" y="390" font-size="13" fill="#6FAEE8">links put signed with <tspan font-family="Menlo, Consolas, monospace">pod.key</tspan></text>
<rect x="452" y="402" width="276" height="32" rx="5" fill="#242424" stroke="#AEB6C1"/>
<text x="464" y="423" font-size="13" fill="#AEB6C1">client <tspan font-family="Menlo, Consolas, monospace" fill="#E8E8E8">comando-main</tspan></text>

<!-- local links, one each way -->
<g stroke="#E7C55A" stroke-width="1.4">
<line x1="160" y1="282" x2="160" y2="396" marker-end="url(#g)"/>
<line x1="190" y1="398" x2="190" y2="284" marker-end="url(#g)"/>
<line x1="302" y1="196" x2="436" y2="262" marker-end="url(#g)"/>
<line x1="438" y1="286" x2="304" y2="220" marker-end="url(#g)"/>
<line x1="302" y1="470" x2="436" y2="406" marker-end="url(#g)"/>
<line x1="438" y1="382" x2="304" y2="446" marker-end="url(#g)"/>
</g>
<text x="204" y="336" font-size="13" fill="#E8E8E8">two links,</text>
<text x="204" y="354" font-size="13" fill="#E8E8E8">hop limit 1</text>
<text x="352" y="206" font-size="13" fill="#E8E8E8" text-anchor="middle" transform="rotate(26 352 206)">hop limit 1</text>
<text x="354" y="476" font-size="13" fill="#E8E8E8" text-anchor="middle" transform="rotate(-25 354 476)">hop limit 1</text>

<!-- machine b -->
<rect x="900" y="100" width="270" height="460" rx="10" fill="none" stroke="#3A3A3A" stroke-width="1"/>
<text x="916" y="124" font-size="13" fill="#9AA0A6" letter-spacing="2">MACHINE b</text>
<rect x="920" y="214" width="230" height="160" rx="8" fill="#2B2618" stroke="#E7C55A" stroke-width="1.8"/>
<text x="936" y="238" font-size="13" fill="#E7C55A" letter-spacing="2">BORDER GATEWAY</text>
<text x="936" y="258" font-size="13" fill="#E7C55A" letter-spacing="2">NODE main</text>
<text x="936" y="284" font-size="13" fill="#E8E8E8">remote listener: TLS 1.3,</text>
<text x="936" y="302" font-size="13" fill="#E8E8E8">port 18893</text>
<text x="936" y="328" font-size="13" fill="#E8E8E8">its link to each instance</text>
<text x="936" y="346" font-size="13" fill="#E8E8E8">here at hop limit 3</text>
<rect x="920" y="400" width="230" height="130" rx="8" fill="none" stroke="#4A4A4A" stroke-dasharray="5 4"/>
<text x="936" y="424" font-size="13" fill="#9AA0A6">its instances' nodes,</text>
<text x="936" y="442" font-size="13" fill="#9AA0A6">linked as on machine a;</text>
<text x="936" y="460" font-size="13" fill="#9AA0A6">among them</text>
<text x="936" y="482" font-size="13" fill="#E8E8E8">NODE review</text>
<text x="936" y="500" font-size="13" fill="#AEB6C1">client <tspan font-family="Menlo, Consolas, monospace" fill="#E8E8E8">comando-review</tspan></text>
<line x1="1035" y1="376" x2="1035" y2="396" stroke="#E7C55A" stroke-width="1.4" marker-end="url(#g)"/>

<!-- the link between machines -->
<g stroke="#E7C55A" stroke-width="2">
<line x1="742" y1="290" x2="916" y2="290" marker-end="url(#g)"/>
<line x1="918" y1="340" x2="744" y2="340" marker-end="url(#g)"/>
</g>
<text x="830" y="280" font-size="13" fill="#E7C55A" text-anchor="middle" font-family="Menlo, Consolas, monospace">main@b</text>
<text x="830" y="312" font-size="13" fill="#E8E8E8" text-anchor="middle">TLS 1.3, pinned</text>
<text x="830" y="330" font-size="13" fill="#E8E8E8" text-anchor="middle">hop limit 2</text>
<text x="830" y="360" font-size="13" fill="#E7C55A" text-anchor="middle" font-family="Menlo, Consolas, monospace">main@a</text>

<!-- what a link carries -->
<text x="40" y="594" font-size="13" fill="#9AA0A6" letter-spacing="2">WHAT A LINK CARRIES · OUT FILTERS ONLY</text>
<text x="40" y="618" font-size="13" fill="#E8E8E8">build's link to review: review's inbox and reply, build's presence: <tspan font-family="Menlo, Consolas, monospace">comando/v1/local/instance/review/inbox</tspan>, <tspan font-family="Menlo, Consolas, monospace">…/review/reply</tspan>, <tspan font-family="Menlo, Consolas, monospace">…/build/presence</tspan></text>
<text x="40" y="638" font-size="13" fill="#9AA0A6">At hop limit 1 a link forwards only what a client published on its node, never what came over another link. A link to a node that is down stays, and queues in its log.</text>

<!-- one question across machines -->
<text x="40" y="672" font-size="13" fill="#9AA0A6" letter-spacing="2">ONE QUESTION FROM build ON a TO review ON b · <tspan font-family="Menlo, Consolas, monospace" letter-spacing="0">comando/v1/b/instance/review/inbox</tspan></text>
<g font-size="13" fill="#E8E8E8">
<text x="40" y="696">1 · comando-build publishes on node build</text>
<text x="305" y="696">2 · build's link to main, limit 1: hops 0 → 1</text>
<text x="570" y="696">3 · main@b, limit 2: hops 1 → 2</text>
<text x="790" y="696">4 · b&apos;s main to review, limit 3: hops 2 → 3</text>
</g>

<line x1="40" y1="732" x2="1160" y2="732" stroke="#2A2A2A" stroke-width="1"/>
<rect x="40" y="746" width="14" height="14" rx="3" fill="#E7C55A"/><text x="60" y="758" font-size="13" fill="#9AA0A6">frontear node and link</text>
<rect x="220" y="746" width="14" height="14" rx="3" fill="#6FAEE8"/><text x="240" y="758" font-size="13" fill="#9AA0A6">comando, signing with its pod key</text>
<rect x="470" y="746" width="14" height="14" rx="3" fill="#AEB6C1"/><text x="490" y="758" font-size="13" fill="#9AA0A6">instance client, its sessions' messages</text>
<text x="1160" y="758" font-size="13" fill="#9AA0A6" text-anchor="end">comando · docs/frontear.md</text>
</svg>
