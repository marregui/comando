<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>How a write becomes durable in cdb: the log first, the column files later</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></radialGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA0A6"/></marker>
</defs>
<rect width="1100" height="560" fill="url(#bg)"/>
<text x="40" y="46" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">CDB · THE LIFE OF A WRITE</text>
<text x="40" y="78" font-size="24" font-weight="300" fill="#E8E8E8">The log first, the column files later</text>

<!-- lane 1 -->
<text x="40" y="126" font-size="13" fill="#9AA0A6" letter-spacing="2">BEFORE THE ANSWER · ONE SMALL APPEND</text>
<rect x="40" y="142" width="200" height="92" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.2"/>
<text x="56" y="169" font-size="15" fill="#E8E8E8">1 · a commit arrives</text>
<text x="56" y="193" font-size="13" font-weight="300" fill="#C9CDD2">an INSERT, or a batch of</text>
<text x="56" y="212" font-size="13" font-weight="300" fill="#C9CDD2">line-protocol rows</text>

<rect x="300" y="142" width="220" height="92" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.5"/>
<text x="316" y="169" font-size="15" fill="#E7C55A">2 · append to the log</text>
<text x="316" y="193" font-size="13" font-weight="300" fill="#C9CDD2">one record at the end of</text>
<text x="316" y="212" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">_wal</text>
<text x="354" y="212" font-size="13" font-weight="300" fill="#C9CDD2">, with a CRC32C</text>

<rect x="580" y="142" width="200" height="92" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.5"/>
<text x="596" y="169" font-size="15" fill="#E7C55A">3 · force it to disk</text>
<text x="596" y="193" font-size="13" font-weight="300" fill="#C9CDD2">the record leaves memory</text>
<text x="596" y="212" font-size="13" font-weight="300" fill="#C9CDD2">for the device</text>

<rect x="840" y="142" width="220" height="92" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.2"/>
<text x="856" y="169" font-size="15" fill="#E8E8E8">4 · answer the client</text>
<text x="856" y="193" font-size="13" font-weight="300" fill="#C9CDD2">from here on, the commit</text>
<text x="856" y="212" font-size="13" font-weight="300" fill="#C9CDD2">survives a crash</text>

<line x1="240" y1="188" x2="298" y2="188" stroke="#9AA0A6" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="520" y1="188" x2="578" y2="188" stroke="#9AA0A6" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="780" y1="188" x2="838" y2="188" stroke="#9AA0A6" stroke-width="1.1" marker-end="url(#a)"/>

<!-- lane 2 -->
<text x="40" y="292" font-size="13" fill="#9AA0A6" letter-spacing="2">LATER, IN THE BACKGROUND</text>
<line x1="410" y1="234" x2="410" y2="304" stroke="#9AA0A6" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#a)"/>
<rect x="300" y="308" width="220" height="92" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.2"/>
<text x="316" y="335" font-size="15" fill="#E7C55A">5 · the applier</text>
<text x="316" y="359" font-size="13" font-weight="300" fill="#C9CDD2">moves the logged commits</text>
<text x="316" y="378" font-size="13" font-weight="300" fill="#C9CDD2">into the column files</text>

<rect x="580" y="308" width="200" height="92" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.2"/>
<text x="596" y="335" font-size="15" fill="#E7C55A">6 · a checkpoint</text>
<text x="596" y="359" font-size="13" font-weight="300" fill="#C9CDD2">forces the files, replaces</text>
<text x="596" y="378" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">_txn</text>
<text x="632" y="378" font-size="13" font-weight="300" fill="#C9CDD2">, cuts the log</text>

<rect x="840" y="308" width="220" height="92" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.2"/>
<text x="856" y="335" font-size="15" fill="#E8E8E8">the column files</text>
<text x="856" y="359" font-size="13" font-weight="300" fill="#C9CDD2">sorted by time; what every</text>
<text x="856" y="378" font-size="13" font-weight="300" fill="#C9CDD2">query reads</text>

<line x1="520" y1="354" x2="578" y2="354" stroke="#9AA0A6" stroke-width="1.1" marker-end="url(#a)"/>
<line x1="780" y1="354" x2="838" y2="354" stroke="#9AA0A6" stroke-width="1.1" marker-end="url(#a)"/>

<!-- crash -->
<rect x="40" y="440" width="1020" height="62" rx="8" fill="#191919" stroke="#3A3A3A" stroke-width="1"/>
<text x="56" y="466" font-size="13" fill="#E7C55A" letter-spacing="2">AFTER A CRASH</text>
<text x="56" y="488" font-size="13" font-weight="300" fill="#C9CDD2">cdb opens the table at its last checkpoint, replays the records still in the log, and checkpoints. No answered commit is lost.</text>
<text x="1060" y="536" text-anchor="end" font-size="13" fill="#9AA0A6" letter-spacing="1">comando · docs/cdb</text>
</svg>
