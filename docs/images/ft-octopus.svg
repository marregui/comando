<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>A frontear link joins two gateways: out, what matches its out filters is checked against the hop limit, logged, sent and acknowledged; in, what matches its in filters on the peer is published locally; the control plane changes links through the Octopus interface</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#9AA0A6" stroke-width="1.4"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#E7C55A" stroke-width="1.4"/></marker>
<marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#AEB6C1" stroke-width="1.4"/></marker>
</defs>
<rect width="1200" height="730" fill="#161616"/>
<text x="40" y="44" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">FRONTEAR · A LINK</text>
<text x="40" y="76" font-size="22" font-weight="300" fill="#E8E8E8">A link joins two gateways and carries the topics its filters name</text>

<!-- gateway a -->
<rect x="40" y="120" width="230" height="268" rx="8" fill="#1E1E1E" stroke="#9AA0A6" stroke-width="1"/>
<text x="56" y="144" font-size="13" fill="#9AA0A6" letter-spacing="2">GATEWAY a</text>
<text x="56" y="172" font-size="13" fill="#E8E8E8">a client publishes</text>
<text x="56" y="192" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">jobs/1</text>
<text x="56" y="226" font-size="13" fill="#E8E8E8">the link is one of its</text>
<text x="56" y="246" font-size="13" fill="#E8E8E8">internal subscribers,</text>
<text x="56" y="266" font-size="13" fill="#E7C55A" font-family="Menlo, Consolas, monospace">$link/b</text>
<text x="56" y="290" font-size="13" fill="#9AA0A6">which answers 0x00 once forced</text>
<text x="56" y="322" font-size="13" fill="#E8E8E8">its subscribers get</text>
<text x="56" y="342" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">results/7</text>

<!-- gateway b -->
<rect x="930" y="120" width="230" height="268" rx="8" fill="#1E1E1E" stroke="#9AA0A6" stroke-width="1"/>
<text x="946" y="144" font-size="13" fill="#9AA0A6" letter-spacing="2">GATEWAY b</text>
<text x="946" y="172" font-size="13" fill="#E8E8E8">sees the link as one</text>
<text x="946" y="192" font-size="13" fill="#E8E8E8">more MQTT client;</text>
<text x="946" y="226" font-size="13" fill="#E8E8E8">its subscribers get</text>
<text x="946" y="246" font-size="13" fill="#E8E8E8"><tspan font-family="Menlo, Consolas, monospace">jobs/1</tspan>, hops 1</text>
<text x="946" y="312" font-size="13" fill="#E8E8E8">a client publishes</text>
<text x="946" y="332" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">results/7</text>

<!-- the link -->
<rect x="300" y="110" width="600" height="290" rx="10" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<text x="316" y="134" font-size="13" fill="#E7C55A" letter-spacing="2">LINK b · OF GATEWAY a</text>
<text x="884" y="134" font-size="13" fill="#9AA0A6" text-anchor="end">one strand, <tspan font-family="Menlo, Consolas, monospace">link-b</tspan>, runs every step</text>
<text x="316" y="160" font-size="13" fill="#9AA0A6" letter-spacing="2">OUT · <tspan font-family="Menlo, Consolas, monospace" letter-spacing="0" fill="#E8E8E8">jobs/#</tspan></text>

<g fill="#242424" stroke="#3A3A3A" stroke-width="1">
<rect x="316" y="172" width="135" height="78" rx="6"/>
<rect x="461" y="172" width="135" height="78" rx="6"/>
<rect x="751" y="172" width="135" height="78" rx="6"/>
</g>
<rect x="606" y="172" width="135" height="78" rx="6" fill="#2B2618" stroke="#E7C55A" stroke-width="1.2"/>
<text x="328" y="194" font-size="13" fill="#9AA0A6" letter-spacing="1">1 · HANDED</text>
<text x="328" y="216" font-size="13" fill="#E8E8E8">gateway a gives</text>
<text x="328" y="236" font-size="13" fill="#E8E8E8">it to <tspan font-family="Menlo, Consolas, monospace">$link/b</tspan></text>
<text x="473" y="194" font-size="13" fill="#9AA0A6" letter-spacing="1">2 · HOPS</text>
<text x="473" y="216" font-size="13" fill="#E8E8E8">below the limit?</text>
<text x="473" y="236" font-size="13" fill="#E8E8E8">if not, dropped</text>
<text x="618" y="194" font-size="13" fill="#E7C55A" letter-spacing="1">3 · LOG</text>
<text x="618" y="216" font-size="13" fill="#E8E8E8">appended, hops + 1;</text>
<text x="618" y="236" font-size="13" fill="#E8E8E8">forced, then 0x00</text>
<text x="763" y="194" font-size="13" fill="#9AA0A6" letter-spacing="1">4 · SEND</text>
<text x="763" y="216" font-size="13" fill="#E8E8E8">QoS 1, from the</text>
<text x="763" y="236" font-size="13" fill="#E8E8E8">cursor, a window</text>
<g stroke="#9AA0A6" stroke-width="1.2">
<line x1="451" y1="211" x2="458" y2="211" marker-end="url(#a)"/>
<line x1="596" y1="211" x2="603" y2="211" marker-end="url(#a)"/>
<line x1="741" y1="211" x2="748" y2="211" marker-end="url(#a)"/>
</g>
<line x1="270" y1="211" x2="312" y2="211" stroke="#AEB6C1" stroke-width="1.2" marker-end="url(#s)"/>
<line x1="886" y1="211" x2="926" y2="211" stroke="#E7C55A" stroke-width="1.6" marker-end="url(#g)"/>
<text x="316" y="276" font-size="13" fill="#E8E8E8">5 · b's PUBACK moves the cursor past what b took; a lost connection sends again from the cursor</text>

<line x1="316" y1="292" x2="884" y2="292" stroke="#3A3A3A" stroke-width="1"/>
<text x="316" y="316" font-size="13" fill="#9AA0A6" letter-spacing="2">IN · <tspan font-family="Menlo, Consolas, monospace" letter-spacing="0" fill="#E8E8E8">results/#</tspan></text>
<text x="436" y="316" font-size="13" fill="#E8E8E8">the link subscribes on b with No Local: its own sends do not come back</text>
<text x="316" y="338" font-size="13" fill="#E8E8E8">published on a as <tspan font-family="Menlo, Consolas, monospace" fill="#E7C55A">$link/b</tspan>; b's PUBACK waits for that publish</text>
<line x1="926" y1="358" x2="274" y2="358" stroke="#AEB6C1" stroke-width="1.2" marker-end="url(#s)"/>
<text x="316" y="384" font-size="13" fill="#9AA0A6">a message that no IN filter covers is dropped and counted</text>

<!-- the spec -->
<rect x="40" y="430" width="360" height="200" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="56" y="454" font-size="13" fill="#9AA0A6" letter-spacing="2">THE LINK'S SPEC · <tspan font-family="Menlo, Consolas, monospace" letter-spacing="0">LinkSpec</tspan></text>
<g font-size="13" font-family="Menlo, Consolas, monospace">
<text x="56" y="480" fill="#9AA0A6">id</text><text x="160" y="480" fill="#E8E8E8">b</text>
<text x="56" y="500" fill="#9AA0A6">host, port</text><text x="160" y="500" fill="#E8E8E8">127.0.0.1, b's port</text>
<text x="56" y="520" fill="#9AA0A6">out</text><text x="160" y="520" fill="#E8E8E8">jobs/#</text>
<text x="56" y="540" fill="#9AA0A6">in</text><text x="160" y="540" fill="#E8E8E8">results/#</text>
<text x="56" y="560" fill="#9AA0A6">hopLimit</text><text x="160" y="560" fill="#E7C55A">1</text>
<text x="56" y="580" fill="#9AA0A6">tls</text><text x="160" y="580" fill="#E8E8E8">false</text>
</g>
<text x="56" y="606" font-size="13" fill="#9AA0A6">kept beside its log as <tspan font-family="Menlo, Consolas, monospace">link.json</tspan>, forced</text>
<text x="56" y="622" font-size="13" fill="#9AA0A6">before a change takes effect</text>

<!-- the hop limit -->
<rect x="420" y="430" width="360" height="200" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="436" y="454" font-size="13" fill="#9AA0A6" letter-spacing="2">THE HOP LIMIT</text>
<text x="436" y="480" font-size="13" fill="#E8E8E8">A link stamps <tspan font-family="Menlo, Consolas, monospace">frontear-hops</tspan> on what it</text>
<text x="436" y="500" font-size="13" fill="#E8E8E8">carries. A client's message has 0 hops.</text>
<text x="436" y="526" font-size="13" fill="#E8E8E8">A link carries a message only while its</text>
<text x="436" y="546" font-size="13" fill="#E8E8E8">hops are below the link's hop limit,</text>
<text x="436" y="566" font-size="13" fill="#E8E8E8">and adds one.</text>
<text x="436" y="594" font-size="13" fill="#E7C55A">Hop limit 1: what came over a link</text>
<text x="436" y="614" font-size="13" fill="#E7C55A">goes over no other.</text>

<!-- the interface -->
<rect x="800" y="430" width="360" height="200" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="816" y="454" font-size="13" fill="#9AA0A6" letter-spacing="2">THE INTERFACE · <tspan font-family="Menlo, Consolas, monospace" letter-spacing="0">Octopus</tspan></text>
<g font-size="13" font-family="Menlo, Consolas, monospace" fill="#E8E8E8">
<text x="816" y="480">put(spec)</text>
<text x="816" y="500">remove(id)</text>
<text x="816" y="520">filters(id, direction, filters)</text>
<text x="816" y="540">state()</text>
</g>
<text x="816" y="566" font-size="13" fill="#E8E8E8">alexander changes the links only</text>
<text x="816" y="586" font-size="13" fill="#E8E8E8">through it; <tspan font-family="Menlo, Consolas, monospace">Links</tspan> implements it.</text>
<text x="816" y="612" font-size="13" fill="#9AA0A6">A removed link keeps its log.</text>

<text x="40" y="664" font-size="13" fill="#9AA0A6">A link that cannot connect tries again after a backoff that grows from 1 s to at most 30 s; the messages for b wait in its log meanwhile.</text>

<line x1="40" y1="684" x2="1160" y2="684" stroke="#2A2A2A" stroke-width="1"/>
<rect x="40" y="698" width="14" height="14" rx="3" fill="#E7C55A"/><text x="60" y="710" font-size="13" fill="#9AA0A6">the link, and what makes a message durable</text>
<rect x="360" y="698" width="14" height="14" rx="3" fill="#AEB6C1"/><text x="380" y="710" font-size="13" fill="#9AA0A6">messages from clients</text>
<text x="1160" y="710" font-size="13" fill="#9AA0A6" text-anchor="end">comando · docs/frontear.md</text>
</svg>
