<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#101010"/></radialGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#9A9A9A" stroke-width="1.4"/></marker></defs>
<rect width="1600" height="640" fill="url(#bg)"/>
<text x="60" y="52" text-anchor="start" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">COMANDO · AT A GLANCE</text>
<text x="60" y="84" text-anchor="start" font-size="24" font-weight="300" fill="#F2F2F2" >Where a block goes, and what comes back</text>
<rect x="60" y="230" width="330" height="150" rx="8" fill="#1E1E1E" stroke="#F2F2F2" stroke-width="1.2"/>
<text x="74" y="256" text-anchor="start" font-size="15" font-weight="400" fill="#F2F2F2" >a block in the editor</text>
<text x="74" y="278" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >a run of lines between blank lines;</text>
<text x="74" y="297" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >the gutter marks where it goes</text>
<text x="74" y="316" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >before it runs</text>
<rect x="600" y="150" width="380" height="110" rx="8" fill="#1E1E1E" stroke="#BDBDBD" stroke-width="1.2"/>
<text x="614" y="176" text-anchor="start" font-size="15" font-weight="400" fill="#BDBDBD" >the panel's database</text>
<text x="614" y="198" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >PostgreSQL or QuestDB, over the</text>
<text x="614" y="217" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >PostgreSQL wire protocol</text>
<rect x="600" y="350" width="380" height="110" rx="8" fill="#1E1E1E" stroke="#D98E5F" stroke-width="1.2"/>
<text x="614" y="376" text-anchor="start" font-size="15" font-weight="400" fill="#D98E5F" >the panel's claude -p session</text>
<text x="614" y="398" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >your Claude Code setup, headless,</text>
<text x="614" y="417" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >one process per session</text>
<rect x="1180" y="150" width="360" height="110" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="1194" y="176" text-anchor="start" font-size="15" font-weight="400" fill="#6FAEE8" >results in the window</text>
<text x="1194" y="198" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >the grid, plots and live plots,</text>
<text x="1194" y="217" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >EXPLAIN trees</text>
<rect x="1180" y="330" width="360" height="110" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="1194" y="356" text-anchor="start" font-size="15" font-weight="400" fill="#6FAEE8" >placed in the window</text>
<text x="1194" y="378" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >tables, plots, diffs, files, Markdown,</text>
<text x="1194" y="397" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >trees, text in the editor</text>
<rect x="1180" y="470" width="360" height="90" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.2"/>
<text x="1194" y="496" text-anchor="start" font-size="15" font-weight="400" fill="#E7C55A" >approval cards</text>
<text x="1194" y="518" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >what the session must ask you</text>
<line x1="390" y1="280" x2="600" y2="205" stroke="#9A9A9A" stroke-width="1.1" marker-end="url(#a)"/>
<text x="490" y="228" text-anchor="middle" font-size="13" font-weight="300" fill="#BDBDBD" stroke="#171717" stroke-width="5" paint-order="stroke" stroke-linejoin="round" >SQL · ⌥⏎</text>
<line x1="390" y1="330" x2="600" y2="405" stroke="#9A9A9A" stroke-width="1.1" marker-end="url(#a)"/>
<text x="505" y="410" text-anchor="middle" font-size="13" font-weight="300" fill="#BDBDBD" stroke="#171717" stroke-width="5" paint-order="stroke" stroke-linejoin="round" >a prompt or /command · ⌘⇧⏎</text>
<text x="225" y="420" text-anchor="middle" font-size="13" font-weight="300" fill="#BDBDBD" >⌘⏎: where the gutter says</text>
<line x1="980" y1="205" x2="1180" y2="205" stroke="#9A9A9A" stroke-width="1.1" marker-end="url(#a)"/>
<text x="1080" y="196" text-anchor="middle" font-size="13" font-weight="300" fill="#BDBDBD" stroke="#171717" stroke-width="5" paint-order="stroke" stroke-linejoin="round" >rows</text>
<line x1="980" y1="385" x2="1180" y2="385" stroke="#9A9A9A" stroke-width="1.1" marker-end="url(#a)"/>
<text x="1080" y="376" text-anchor="middle" font-size="13" font-weight="300" fill="#BDBDBD" stroke="#171717" stroke-width="5" paint-order="stroke" stroke-linejoin="round" >comando's MCP tools</text>
<line x1="980" y1="440" x2="1180" y2="500" stroke="#9A9A9A" stroke-width="1.1" marker-end="url(#a)"/>
<text x="1060" y="450" text-anchor="middle" font-size="13" font-weight="300" fill="#BDBDBD" stroke="#171717" stroke-width="5" paint-order="stroke" stroke-linejoin="round" >permission requests</text>
<line x1="1180" y1="535" x2="980" y2="456" stroke="#9A9A9A" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="1060" y="532" text-anchor="middle" font-size="13" font-weight="300" fill="#BDBDBD" stroke="#171717" stroke-width="5" paint-order="stroke" stroke-linejoin="round" >allow or deny</text>
<text x="60" y="600" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >Blue: comando. Copper: Claude Code. Gold: what waits for you. Solid: a request. Dashed: what comes back.</text>
<text x="1540" y="600" text-anchor="end" font-size="13" font-weight="300" fill="#8E8E8E" >comando · README</text>
</svg>
