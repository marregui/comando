<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Where a block goes: SQL to the panel's database, a prompt or a slash command to the panel's claude -p session; back come results, plots and EXPLAIN trees from the database, and from the session a transcript, tables, plots, diffs and approval cards</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9AA0A6" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="480" fill="url(#bg)"/>
  <text x="40" y="44" font-size="13" letter-spacing="3" fill="#E7C55A">COMANDO · AT A GLANCE</text>
  <text x="40" y="78" font-size="24" font-weight="300" fill="#E8E8E8">One editor, two places a block can go</text>

  <g fill="#1E1E1E" stroke-width="1.3">
    <rect x="40" y="170" width="280" height="170" rx="8" stroke="#E7C55A" stroke-width="2"/>
    <rect x="640" y="120" width="320" height="120" rx="8" stroke="#6FAEE8"/>
    <rect x="640" y="270" width="320" height="120" rx="8" stroke="#D98E5F"/>
  </g>
  <text x="56" y="198" font-size="13" letter-spacing="2.5" fill="#E7C55A">A BLOCK IN THE EDITOR</text>
  <g font-size="13" fill="#9AA0A6">
    <text x="56" y="224">the lines around the caret,</text>
    <text x="56" y="242">up to a blank line</text>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="13">
    <text x="56" y="276" fill="#6FAEE8">select count(*) from trades;</text>
    <text x="56" y="312" fill="#D98E5F">why is this query slow?</text>
  </g>

  <text x="656" y="148" font-size="13" letter-spacing="2.5" fill="#6FAEE8">THE PANEL'S DATABASE</text>
  <text x="656" y="176" font-size="16" fill="#E8E8E8">PostgreSQL, QuestDB or cdb</text>
  <g font-size="13" fill="#9AA0A6">
    <text x="656" y="200">back: result grids, plots,</text>
    <text x="656" y="218">EXPLAIN trees</text>
  </g>
  <text x="656" y="298" font-size="13" letter-spacing="2.5" fill="#D98E5F">THE PANEL'S SESSION</text>
  <text x="656" y="326" font-family="Menlo, Consolas, monospace" font-size="15" fill="#E8E8E8">claude -p</text>
  <g font-size="13" fill="#9AA0A6">
    <text x="656" y="350">back: a transcript, tables, plots,</text>
    <text x="656" y="368">diffs, approval cards</text>
  </g>

  <g stroke="#9AA0A6" stroke-width="1.1" fill="none">
    <path d="M320 230 L420 230 L420 160 L639 160" marker-end="url(#ar)"/>
    <path d="M640 210 L470 210 L470 262 L321 262" stroke-dasharray="6 5" marker-end="url(#ar)"/>
    <path d="M320 318 L420 318 L420 350 L639 350" marker-end="url(#ar)"/>
    <path d="M640 300 L470 300 L470 290 L321 290" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  </g>
  <g font-size="13" fill="#9AA0A6">
    <text x="432" y="152">SQL · Alt+Enter</text>
    <text x="340" y="374">a prompt or a /command · Cmd+Shift+Enter</text>
  </g>

  <g font-size="13" fill="#9AA0A6">
    <text x="40" y="420">Cmd+Enter sends the block where the gutter says it goes. Ctrl replaces Cmd on Linux and Windows.</text>
    <rect x="40" y="440" width="14" height="14" rx="3" fill="#E7C55A"/><text x="62" y="452">you</text>
    <rect x="104" y="440" width="14" height="14" rx="3" fill="#6FAEE8"/><text x="126" y="452">comando and its databases</text>
    <rect x="306" y="440" width="14" height="14" rx="3" fill="#D98E5F"/><text x="328" y="452">Claude Code</text>
    <text x="430" y="452">Solid: what you send. Dashed: what comes back.</text>
    <text x="960" y="452" text-anchor="end">comando · README</text>
  </g>
</svg>
