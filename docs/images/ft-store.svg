<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>A frontear link log: the link's strand appends records to a round in memory, the forcer writes and forces them to segment files in groups, the strand reads from the cursor and acknowledges, and the forcer saves the cursor and deletes the segments below it; a quota bounds the bytes on disk</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#9AA0A6" stroke-width="1.4"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#E7C55A" stroke-width="1.4"/></marker>
</defs>
<rect width="1200" height="750" fill="#161616"/>
<text x="40" y="44" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">FRONTEAR · THE LINK LOG</text>
<text x="40" y="76" font-size="22" font-weight="300" fill="#E8E8E8">Append in memory, force in groups, read from the cursor, delete behind it</text>

<!-- the actors -->
<rect x="40" y="104" width="250" height="116" rx="8" fill="#1E1E1E" stroke="#9AA0A6" stroke-width="1"/>
<text x="56" y="128" font-size="13" fill="#9AA0A6" letter-spacing="2">THE LINK'S STRAND</text>
<text x="56" y="150" font-size="13" fill="#9AA0A6" font-family="Menlo, Consolas, monospace">link-b</text>
<text x="56" y="176" font-size="13" fill="#E8E8E8">1 · append: copies the record,</text>
<text x="56" y="196" font-size="13" fill="#E8E8E8">takes the next offset, returns;</text>
<text x="56" y="214" font-size="13" fill="#E8E8E8">it writes no file</text>

<rect x="330" y="104" width="250" height="116" rx="8" fill="#2B2618" stroke="#E7C55A" stroke-width="1.4"/>
<text x="346" y="128" font-size="13" fill="#E7C55A" letter-spacing="2">THE ROUND</text>
<text x="346" y="154" font-size="13" fill="#E8E8E8">records in memory that wait</text>
<text x="346" y="174" font-size="13" fill="#E8E8E8">for the forcer, at most</text>
<text x="346" y="194" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">maxRoundBytes</text>

<rect x="620" y="104" width="250" height="116" rx="8" fill="#1E1E1E" stroke="#9AA0A6" stroke-width="1"/>
<text x="636" y="128" font-size="13" fill="#9AA0A6" letter-spacing="2">THE FORCER</text>
<text x="636" y="150" font-size="13" fill="#9AA0A6" font-family="Menlo, Consolas, monospace">frontear-log-force-&lt;folder&gt;</text>
<text x="636" y="176" font-size="13" fill="#E8E8E8">one platform thread; it runs at</text>
<text x="636" y="196" font-size="13" fill="#E8E8E8">most <tspan font-family="Menlo, Consolas, monospace">forceEvery</tspan> after the first</text>
<text x="636" y="214" font-size="13" fill="#E8E8E8">record it has not covered</text>

<rect x="910" y="104" width="250" height="116" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.4"/>
<text x="926" y="128" font-size="13" fill="#E7C55A" letter-spacing="2">SEGMENT FILES</text>
<text x="926" y="154" font-size="13" fill="#E8E8E8">2 · the forcer writes the round's</text>
<text x="926" y="174" font-size="13" fill="#E8E8E8">frames, forces every segment</text>
<text x="926" y="194" font-size="13" fill="#E8E8E8">it wrote, and the folder when</text>
<text x="926" y="212" font-size="13" fill="#E8E8E8">it made a segment</text>

<line x1="290" y1="150" x2="326" y2="150" stroke="#E7C55A" stroke-width="1.4" marker-end="url(#g)"/>
<line x1="580" y1="150" x2="616" y2="150" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="870" y1="150" x2="906" y2="150" stroke="#E7C55A" stroke-width="1.4" marker-end="url(#g)"/>
<path d="M745,220 L745,244 L165,244 L165,224" fill="none" stroke="#E7C55A" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#g)"/>
<text x="455" y="264" font-size="13" fill="#E8E8E8" text-anchor="middle">3 · the appends it covered complete, in offset order: only now does the link answer 0x00</text>

<!-- the segments -->
<text x="40" y="306" font-size="13" fill="#9AA0A6" letter-spacing="2">THE SEGMENTS OF ONE LINK, IN ITS FOLDER</text>
<rect x="40" y="320" width="272" height="56" rx="6" fill="none" stroke="#3A3A3A" stroke-dasharray="5 4"/>
<rect x="320" y="320" width="272" height="56" rx="6" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.2"/>
<rect x="600" y="320" width="272" height="56" rx="6" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.2"/>
<rect x="880" y="320" width="280" height="56" rx="6" fill="#2B2618" stroke="#E7C55A" stroke-width="1.2"/>
<g font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">
<text x="176" y="344" fill="#9AA0A6">00000000000000000000.log</text>
<text x="456" y="344" fill="#E8E8E8">00000000000000000400.log</text>
<text x="736" y="344" fill="#E8E8E8">00000000000000000800.log</text>
<text x="1020" y="344" fill="#E8E8E8">00000000000000001200.log</text>
</g>
<g font-size="13" text-anchor="middle">
<text x="176" y="364" fill="#9AA0A6">deleted</text>
<text x="456" y="364" fill="#9AA0A6">sealed: mapped once, at its first read</text>
<text x="736" y="364" fill="#9AA0A6">sealed</text>
<text x="1020" y="364" fill="#9AA0A6">open: the next append goes here</text>
</g>
<line x1="338" y1="310" x2="338" y2="390" stroke="#6FAEE8" stroke-width="2"/>
<text x="338" y="408" font-size="13" fill="#6FAEE8" text-anchor="middle">cursor</text>
<line x1="1142" y1="310" x2="1142" y2="390" stroke="#6FAEE8" stroke-width="2"/>
<text x="1142" y="408" font-size="13" fill="#6FAEE8" text-anchor="middle">tail</text>
<line x1="366" y1="400" x2="1124" y2="400" stroke="#3A3A3A" stroke-width="1"/>
<text x="740" y="420" font-size="13" fill="#E8E8E8" text-anchor="middle">queued = tail − cursor: waiting for the peer, sent again after a lost connection</text>

<g font-size="13" fill="#E8E8E8">
<text x="40" y="452">4 · read: the strand reads from the cursor, a window at a time; what just became durable is read from memory</text>
<text x="40" y="474">5 · acknowledge: after the peer's PUBACK the strand records the cursor past it</text>
<text x="40" y="496">6 · trim: the forcer saves the cursor, then deletes every segment wholly below it</text>
</g>

<!-- the frame -->
<rect x="40" y="520" width="540" height="140" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="56" y="544" font-size="13" fill="#9AA0A6" letter-spacing="2">ONE FRAME PER RECORD</text>
<rect x="56" y="556" width="96" height="30" fill="#242424" stroke="#4A4A4A"/>
<rect x="152" y="556" width="96" height="30" fill="#242424" stroke="#4A4A4A"/>
<rect x="248" y="556" width="316" height="30" fill="#2B2618" stroke="#E7C55A"/>
<g font-size="13" font-family="Menlo, Consolas, monospace" text-anchor="middle">
<text x="104" y="576" fill="#E8E8E8">length</text>
<text x="200" y="576" fill="#E8E8E8">CRC32C</text>
<text x="406" y="576" fill="#E7C55A">the record's bytes</text>
</g>
<text x="56" y="610" font-size="13" fill="#E8E8E8">The record is a PUBLISH as MQTT writes it. The CRC covers its offset,</text>
<text x="56" y="628" font-size="13" fill="#E8E8E8">length and bytes, so a frame read at the wrong place fails.</text>
<text x="56" y="648" font-size="13" fill="#9AA0A6">A segment starts with <tspan font-family="Menlo, Consolas, monospace">FTLG</tspan>, version 1 and its base offset.</text>

<!-- the cursor file -->
<rect x="600" y="520" width="270" height="140" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="616" y="544" font-size="13" fill="#9AA0A6" letter-spacing="2">THE FILE <tspan font-family="Menlo, Consolas, monospace" letter-spacing="0">cursor</tspan></text>
<text x="616" y="568" font-size="13" fill="#E8E8E8"><tspan font-family="Menlo, Consolas, monospace">FTCR</tspan>, version 1, the cursor,</text>
<text x="616" y="586" font-size="13" fill="#E8E8E8">a CRC32C; replaced whole:</text>
<text x="616" y="610" font-size="13" fill="#E8E8E8"><tspan font-family="Menlo, Consolas, monospace">cursor.tmp</tspan> written, forced,</text>
<text x="616" y="628" font-size="13" fill="#E8E8E8">moved over, the folder forced</text>

<!-- quota and recovery -->
<rect x="890" y="520" width="270" height="140" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="906" y="544" font-size="13" fill="#9AA0A6" letter-spacing="2">THE QUOTA</text>
<text x="906" y="568" font-size="13" fill="#E8E8E8">past <tspan font-family="Menlo, Consolas, monospace">maxBytes</tspan> on disk, an append</text>
<text x="906" y="586" font-size="13" fill="#E8E8E8">fails at once and adds nothing;</text>
<text x="906" y="604" font-size="13" fill="#E8E8E8">the link answers 0x97</text>
<text x="906" y="630" font-size="13" fill="#9AA0A6" letter-spacing="2">ON OPEN</text>
<text x="906" y="650" font-size="13" fill="#E8E8E8">the log ends at its first bad frame</text>

<text x="40" y="690" font-size="13" fill="#9AA0A6">A record whose append completed survives a crash; the records after the last saved cursor are read again after one: at least once.</text>

<line x1="40" y1="706" x2="1160" y2="706" stroke="#2A2A2A" stroke-width="1"/>
<rect x="40" y="720" width="14" height="14" rx="3" fill="#E7C55A"/><text x="60" y="732" font-size="13" fill="#9AA0A6">what makes a record durable</text>
<rect x="270" y="720" width="14" height="14" rx="3" fill="#6FAEE8"/><text x="290" y="732" font-size="13" fill="#9AA0A6">positions in the log</text>
<text x="1160" y="732" font-size="13" fill="#9AA0A6" text-anchor="end">comando · docs/frontear.md</text>
</svg>
