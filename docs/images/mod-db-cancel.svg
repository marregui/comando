<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The cancel handshake: each side writes first and reads second, so a cancel is never lost</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></radialGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#9AA0A6" stroke-width="1.4"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6FAEE8" stroke-width="1.4"/></marker>
</defs>
<rect width="1200" height="580" fill="url(#bg)"/>
<text x="48" y="48" font-size="13" fill="#E7C55A" letter-spacing="3">MODULE · DB · CANCEL</text>
<text x="48" y="82" font-size="24" font-weight="300" fill="#E8E8E8">Two threads, two notes: each writes its own, then reads the other's</text>

<rect x="48" y="120" width="340" height="200" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="64" y="148" font-size="13" fill="#9AA0A6" letter-spacing="2">THE CALLER · ANY THREAD</text>
<text x="64" y="178" font-size="14" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">cancel(7)</text>
<g font-size="13" fill="#121212" text-anchor="middle" font-weight="600">
<circle cx="76" cy="211" r="11" fill="#E7C55A"/><text x="76" y="216">1</text>
<circle cx="76" cy="251" r="11" fill="#E7C55A"/><text x="76" y="256">2</text>
</g>
<text x="98" y="216" font-size="14" fill="#E8E8E8">write: request 7 is cancelled</text>
<text x="98" y="256" font-size="14" fill="#E8E8E8">read: is a statement running?</text>
<text x="98" y="290" font-size="14" fill="#9AA0A6">yes: cancel that statement</text>

<rect x="812" y="120" width="340" height="200" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="828" y="148" font-size="13" fill="#9AA0A6" letter-spacing="2">THE LANE · STRAND db-local</text>
<text x="828" y="178" font-size="14" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">run request 7</text>
<g font-size="13" fill="#121212" text-anchor="middle" font-weight="600">
<circle cx="840" cy="211" r="11" fill="#E7C55A"/><text x="840" y="216">1</text>
<circle cx="840" cy="251" r="11" fill="#E7C55A"/><text x="840" y="256">2</text>
</g>
<text x="862" y="216" font-size="14" fill="#E8E8E8">write: this statement is running</text>
<text x="862" y="256" font-size="14" fill="#E8E8E8">read: is request 7 cancelled?</text>
<text x="862" y="290" font-size="14" fill="#9AA0A6">yes: stop before executing</text>

<text x="600" y="136" font-size="13" fill="#9AA0A6" letter-spacing="2" text-anchor="middle">SHARED BY BOTH</text>
<rect x="480" y="150" width="240" height="64" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.4"/>
<text x="600" y="178" font-size="14" fill="#E7C55A" font-family="Menlo, Consolas, monospace" text-anchor="middle">cancelled</text>
<text x="600" y="200" font-size="13" fill="#9AA0A6" text-anchor="middle">a set of request ids</text>
<rect x="480" y="244" width="240" height="64" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.4"/>
<text x="600" y="272" font-size="14" fill="#E7C55A" font-family="Menlo, Consolas, monospace" text-anchor="middle">running</text>
<text x="600" y="294" font-size="13" fill="#9AA0A6" text-anchor="middle">the statement, volatile</text>

<g fill="none" stroke="#6FAEE8" stroke-width="1.4" marker-end="url(#w)">
<path d="M388,211 L476,186"/>
<path d="M812,211 L724,268"/>
</g>
<g fill="none" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#a)">
<path d="M480,280 L392,254"/>
<path d="M720,190 L808,248"/>
</g>

<text x="48" y="366" font-size="13" fill="#9AA0A6" letter-spacing="2">WHEN THE STATEMENT IS ALREADY RUNNING</text>
<line x1="48" y1="378" x2="1152" y2="378" stroke="#3A3A3A" stroke-width="1"/>
<g fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2">
<rect x="48" y="396" width="330" height="76" rx="8"/>
<rect x="435" y="396" width="330" height="76" rx="8"/>
<rect x="822" y="396" width="330" height="76" rx="8"/>
</g>
<text x="64" y="426" font-size="13" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">statement.cancel()</text>
<text x="64" y="452" font-size="14" fill="#E8E8E8">sent from a canceller thread</text>
<text x="451" y="426" font-size="13" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">abortAfterMillis = 2 000</text>
<text x="451" y="452" font-size="14" fill="#E8E8E8">still running 2 s later?</text>
<text x="838" y="426" font-size="13" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">connection.abort()</text>
<text x="838" y="452" font-size="14" fill="#E8E8E8">frees a read stuck on the socket</text>
<g fill="none" stroke="#9AA0A6" stroke-width="1" marker-end="url(#a)">
<path d="M378,434 L431,434"/>
<path d="M765,434 L818,434"/>
</g>

<g font-size="13" fill="#9AA0A6">
<path d="M48,512 L84,512" fill="none" stroke="#6FAEE8" stroke-width="1.4" marker-end="url(#w)"/>
<text x="94" y="516">writes</text>
<path d="M170,512 L206,512" fill="none" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="216" y="516">reads</text>
<text x="300" y="516" fill="#E8E8E8" font-size="14">Whoever reads second sees the other's note. Either way the loop hears SqlCancelled.</text>
</g>
<text x="48" y="556" font-size="13" fill="#9AA0A6" letter-spacing="1">comando · docs/modules/db.md</text>
</svg>
