<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>The path of a new feature in eight steps: an Intent names what happens; a rule in the Reducer turns state and intent into new state and effects; an Effect asks for work and EffectRouter sends it to a port; the port is an interface in core.port with a recording fake in testkit; an adapter module implements the port; an entry in Actions makes the feature an MCP tool; a command or widget in ui makes it a gesture; tests, the owning document and a decision record close it</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></radialGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9AA0A6" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="520" fill="url(#bg)"/>
  <text x="40" y="44" font-size="13" letter-spacing="3" fill="#E7C55A">ADDING A FEATURE</text>
  <text x="40" y="78" font-size="24" font-weight="300" fill="#E8E8E8">Eight steps, from the core outwards</text>

  <g fill="#1E1E1E" stroke-width="1.3">
    <rect x="40" y="112" width="215" height="116" rx="8" stroke="#6FAEE8"/>
    <rect x="275" y="112" width="215" height="116" rx="8" stroke="#E7C55A" stroke-width="2"/>
    <rect x="510" y="112" width="215" height="116" rx="8" stroke="#6FAEE8"/>
    <rect x="745" y="112" width="215" height="116" rx="8" stroke="#6FAEE8"/>
    <rect x="745" y="282" width="215" height="116" rx="8" stroke="#6FAEE8"/>
    <rect x="510" y="282" width="215" height="116" rx="8" stroke="#6FAEE8"/>
    <rect x="275" y="282" width="215" height="116" rx="8" stroke="#6FAEE8"/>
    <rect x="40" y="282" width="215" height="116" rx="8" stroke="#AEB6C1"/>
  </g>

  <g font-size="13" letter-spacing="2" fill="#9AA0A6">
    <text x="54" y="136">1 · CORE</text>
    <text x="289" y="136" fill="#E7C55A">2 · CORE</text>
    <text x="524" y="136">3 · CORE</text>
    <text x="759" y="136">4 · CORE, TESTKIT</text>
    <text x="759" y="306">5 · AN ADAPTER</text>
    <text x="524" y="306">6 · CORE, MCP</text>
    <text x="289" y="306">7 · UI</text>
    <text x="54" y="306">8 · THE CLOSE</text>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="14">
    <text x="54" y="162" fill="#6FAEE8">Intent</text>
    <text x="289" y="162" fill="#E7C55A">Reducer</text>
    <text x="524" y="162" fill="#6FAEE8">Effect</text>
    <text x="759" y="162" fill="#6FAEE8">core.port</text>
    <text x="759" y="332" fill="#6FAEE8">claude, db, tools</text>
    <text x="524" y="332" fill="#6FAEE8">Actions</text>
    <text x="289" y="332" fill="#6FAEE8">Commands</text>
  </g>
  <text x="54" y="332" font-size="14" fill="#E8E8E8">tests, a page, a record</text>
  <g font-size="13" fill="#9AA0A6">
    <text x="54" y="186">a record that names what</text>
    <text x="54" y="204">happened or is wanted</text>
    <text x="289" y="186">a pure rule: state and</text>
    <text x="289" y="204">intent in, new state and</text>
    <text x="289" y="222">effects out</text>
    <text x="524" y="186">a request for work;</text>
    <text x="524" y="204">EffectRouter hands it</text>
    <text x="524" y="222">to a port</text>
    <text x="759" y="186">an interface; its fake in</text>
    <text x="759" y="204">RecordingPorts records</text>
    <text x="759" y="222">each call</text>
    <text x="759" y="356">does the work on its own</text>
    <text x="759" y="374">threads, answers with</text>
    <text x="759" y="392">intents</text>
    <text x="524" y="356">one entry makes it a</text>
    <text x="524" y="374">tool an agent can call;</text>
    <text x="524" y="392">ActionParityTest checks</text>
    <text x="289" y="356">a command with its key,</text>
    <text x="289" y="374">a widget that draws</text>
    <text x="289" y="392">the new state</text>
    <text x="54" y="356">a test per behaviour, the</text>
    <text x="54" y="374">owning document, a</text>
    <text x="54" y="392">decision in docs/adr/</text>
  </g>

  <g stroke="#9AA0A6" stroke-width="1.3" fill="none" marker-end="url(#a)">
    <path d="M255 170 H273"/>
    <path d="M490 170 H508"/>
    <path d="M725 170 H743"/>
    <path d="M852 228 V280"/>
    <path d="M745 340 H727"/>
    <path d="M510 340 H492"/>
    <path d="M275 340 H257"/>
  </g>

  <path d="M40 430 H960" stroke="#9AA0A6" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="40" y="456" font-size="13" letter-spacing="2" fill="#E7C55A">A NEW MODULE</text>
  <text x="186" y="456" font-size="13" fill="#9AA0A6">a line in settings.gradle.kts · depends on core alone · wired in app · a page in docs/modules/</text>

  <g font-size="13" fill="#9AA0A6">
    <rect x="40" y="486" width="14" height="14" rx="3" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.5"/>
    <text x="62" y="498">the one writer of state</text>
    <rect x="226" y="486" width="14" height="14" rx="3" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.5"/>
    <text x="248" y="498">code</text>
    <rect x="300" y="486" width="14" height="14" rx="3" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.5"/>
    <text x="322" y="498">tests and documents</text>
    <text x="960" y="498" text-anchor="end">comando · docs/development.md</text>
  </g>
</svg>
