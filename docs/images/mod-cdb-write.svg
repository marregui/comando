<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The path of a cdb commit: log first, answer, apply later, checkpoint, cut the log</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#9AA0A6" stroke-width="1.4"/></marker></defs>
<rect width="1100" height="560" fill="#161616"/>
<text x="40" y="44" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">MODULE · CDB · A COMMIT</text>
<text x="40" y="76" font-size="22" font-weight="300" fill="#E8E8E8">Log first, answer, write the column files later</text>

<text x="40" y="116" font-size="13" fill="#9AA0A6" letter-spacing="2">THE WRITER'S THREAD</text>
<rect x="40" y="128" width="230" height="92" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="56" y="154" font-size="13" fill="#9AA0A6" letter-spacing="2">1 · LEASE</text>
<text x="56" y="178" font-size="14" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">TableState.lease</text>
<text x="56" y="202" font-size="13" fill="#E8E8E8">one writer per table</text>
<line x1="270" y1="174" x2="296" y2="174" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="300" y="128" width="250" height="92" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<text x="316" y="154" font-size="13" fill="#9AA0A6" letter-spacing="2">2 · LOG</text>
<text x="316" y="178" font-size="14" fill="#E7C55A" font-family="Menlo, Consolas, monospace">Wal</text>
<text x="352" y="178" font-size="13" fill="#E8E8E8">one frame, forced to disk</text>
<text x="316" y="202" font-size="13" fill="#9AA0A6">the commit is durable from here</text>
<line x1="550" y1="174" x2="576" y2="174" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="580" y="128" width="220" height="92" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="596" y="154" font-size="13" fill="#9AA0A6" letter-spacing="2">3 · ANSWER</text>
<text x="596" y="178" font-size="14" fill="#E8E8E8">the caller hears "done"</text>
<text x="596" y="202" font-size="13" fill="#9AA0A6">no column file touched yet</text>
<line x1="800" y1="174" x2="826" y2="174" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="830" y="128" width="230" height="92" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="846" y="154" font-size="13" fill="#9AA0A6" letter-spacing="2">4 · QUEUE</text>
<text x="846" y="178" font-size="14" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">RowBlock</text>
<text x="846" y="202" font-size="13" fill="#E8E8E8">the rows wait off the heap</text>

<path d="M945,220 L945,262 L255,262 L255,300" fill="none" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<text x="40" y="292" font-size="13" fill="#9AA0A6" letter-spacing="2">THE APPLIER'S THREAD</text>
<rect x="40" y="304" width="230" height="92" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="56" y="330" font-size="13" fill="#9AA0A6" letter-spacing="2">5 · BATCH</text>
<text x="56" y="354" font-size="14" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">Applier</text>
<text x="56" y="378" font-size="13" fill="#E8E8E8">up to 100,000 rows, log order</text>
<line x1="270" y1="350" x2="296" y2="350" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="300" y="304" width="250" height="92" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="316" y="330" font-size="13" fill="#9AA0A6" letter-spacing="2">6 · WRITE</text>
<text x="316" y="354" font-size="14" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">TableWriter</text>
<text x="316" y="378" font-size="13" fill="#E8E8E8">append, or merge a new folder</text>
<line x1="550" y1="350" x2="576" y2="350" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="580" y="304" width="220" height="92" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="596" y="330" font-size="13" fill="#9AA0A6" letter-spacing="2">7 · PUBLISH</text>
<text x="596" y="354" font-size="14" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">Version</text>
<text x="596" y="378" font-size="13" fill="#E8E8E8">new readers see the rows</text>
<line x1="800" y1="350" x2="826" y2="350" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="830" y="304" width="230" height="92" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<text x="846" y="330" font-size="13" fill="#9AA0A6" letter-spacing="2">8 · CHECKPOINT</text>
<text x="846" y="354" font-size="14" fill="#E7C55A" font-family="Menlo, Consolas, monospace">Checkpoint</text>
<text x="846" y="378" font-size="13" fill="#E8E8E8">force files, swap _txn, cut log</text>

<text x="40" y="446" font-size="13" fill="#9AA0A6" letter-spacing="2">AFTER A CRASH</text>
<rect x="40" y="458" width="1020" height="52" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="56" y="490" font-size="13" fill="#E8E8E8">Open reads <tspan font-family="Menlo, Consolas, monospace" fill="#E7C55A">_txn</tspan>, the last checkpoint, then replays every whole frame of <tspan font-family="Menlo, Consolas, monospace" fill="#E7C55A">_wal</tspan>. A torn last frame fails its CRC and is cut.</text>

<rect x="700" y="528" width="14" height="14" rx="3" fill="#E7C55A"/><text x="720" y="540" font-size="13" fill="#9AA0A6">what makes it durable</text>
<rect x="900" y="528" width="14" height="14" rx="3" fill="#6FAEE8"/><text x="920" y="540" font-size="13" fill="#9AA0A6">cdb's classes</text>
<text x="40" y="540" font-size="13" fill="#9AA0A6">comando · docs/modules/cdb</text>
</svg>
