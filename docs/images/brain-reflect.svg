<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">The reflect cycle: three ways it starts, its six steps from Measure to Report, the three checks of the knowledge base gate, and which steps a full run and an automatic run take</title>
  <defs>
    <style>
      .cap{font-size:13px;font-weight:600;letter-spacing:2.5px}
      .n{font-size:13px;font-weight:600;letter-spacing:1.5px}
      .t{font-size:15px;fill:#E8E8E8}
      .b{font-size:13px;fill:#E8E8E8}
      .s{font-size:14px;fill:#9AA0A6}
      .m{font-family:Menlo, Consolas, monospace;font-size:13px;fill:#E8E8E8}
      .foot{font-size:13px;fill:#9AA0A6;letter-spacing:.5px}
    </style>
  </defs>
  <rect width="1100" height="600" fill="#161616"/>

  <text x="40" y="44" class="cap" fill="#E7C55A">REFLECT · A SESSION BECOMES MEMORY</text>
  <text x="40" y="68" class="s">One skill of the kit, six steps. The next session recalls more of what matters from fewer bytes.</text>

  <!-- when -->
  <text x="40" y="108" class="cap" fill="#9AA0A6">WHEN</text>
  <rect x="40" y="120" width="230" height="36" rx="18" fill="#1E1E1E" stroke="#E8E8E8" stroke-opacity=".6"/>
  <text x="155" y="143" text-anchor="middle" class="s" fill="#E8E8E8">you type /reflect</text>
  <rect x="286" y="120" width="310" height="36" rx="18" fill="#1E1E1E" stroke="#6FAEE8"/>
  <text x="441" y="143" text-anchor="middle" class="s" fill="#E8E8E8">you click Reflect: the checkpoint command</text>
  <rect x="612" y="120" width="448" height="36" rx="18" fill="#1E1E1E" stroke="#6FAEE8"/>
  <text x="836" y="143" text-anchor="middle" class="s" fill="#E8E8E8">at the threshold: the command with --auto, then /compact</text>

  <!-- the steps -->
  <text x="40" y="196" class="cap" fill="#9AA0A6">THE STEPS</text>
  <line x1="40" y1="266" x2="1060" y2="266" stroke="#6CC69A" stroke-width="1.5"/>
  <g fill="#6CC69A">
    <path d="M201,261 L209,266 L201,271 Z"/>
    <path d="M373,261 L381,266 L373,271 Z"/>
    <path d="M545,261 L553,266 L545,271 Z"/>
    <path d="M717,261 L725,266 L717,271 Z"/>
    <path d="M889,261 L897,266 L889,271 Z"/>
  </g>
  <g fill="#1E1E1E" stroke="#6CC69A" stroke-opacity=".8">
    <rect x="40" y="208" width="160" height="116" rx="6"/>
    <rect x="212" y="208" width="160" height="116" rx="6"/>
    <rect x="384" y="208" width="160" height="116" rx="6"/>
    <rect x="556" y="208" width="160" height="116" rx="6"/>
    <rect x="728" y="208" width="160" height="116" rx="6"/>
    <rect x="900" y="208" width="160" height="116" rx="6"/>
  </g>
  <g>
    <text x="54" y="234" class="n" fill="#6CC69A">1 · MEASURE</text>
    <text x="54" y="260" class="b">a snapshot of</text>
    <text x="54" y="280" class="b">memory, for the</text>
    <text x="54" y="300" class="b">report; reads only</text>

    <text x="226" y="234" class="n" fill="#6CC69A">2 · MEMORY</text>
    <text x="226" y="260" class="b">entries rewritten,</text>
    <text x="226" y="280" class="b">cues sharpened,</text>
    <text x="226" y="300" class="b">state brought up</text>

    <text x="398" y="234" class="n" fill="#6CC69A">3 · KB</text>
    <text x="398" y="260" class="b">what the session</text>
    <text x="398" y="280" class="b">proved, through</text>
    <text x="398" y="300" class="b">the gate below</text>

    <text x="570" y="234" class="n" fill="#6CC69A">4 · SCRATCHPAD</text>
    <text x="570" y="260" class="b">done tasks folded</text>
    <text x="570" y="280" class="b">and cleared; open</text>
    <text x="570" y="300" class="b">ones: State, Next</text>

    <text x="742" y="234" class="n" fill="#6CC69A">5 · INDEXES</text>
    <text x="742" y="260" class="b">every file written</text>
    <text x="742" y="280" class="b">has its line in</text>
    <text x="742" y="300" class="b">its index</text>

    <text x="914" y="234" class="n" fill="#6CC69A">6 · REPORT</text>
    <text x="914" y="260" class="b">what changed,</text>
    <text x="914" y="280" class="b">budget warnings;</text>
    <text x="914" y="300" class="b">four lines at most</text>
  </g>

  <!-- the gate -->
  <line x1="464" y1="324" x2="464" y2="354" stroke="#E7C55A" stroke-width="1.5"/>
  <rect x="40" y="354" width="700" height="64" rx="6" fill="#1E1E1E" stroke="#E7C55A" stroke-opacity=".7"/>
  <text x="60" y="380" class="cap" fill="#E7C55A">THE KB GATE · THREE CHECKS PER STATEMENT</text>
  <text x="60" y="404" class="s" fill="#E8E8E8">1 verified against its source   →   2 a reviewer agent tries to refute it   →   3 you approve</text>
  <text x="760" y="380" class="t">A run that cannot ask you</text>
  <text x="760" y="402" class="t">writes nothing to the KB.</text>

  <!-- depth -->
  <text x="40" y="456" class="cap" fill="#9AA0A6">DEPTH</text>
  <text x="130" y="456" class="s" fill="#E8E8E8">a run you start takes every step and asks its decisions</text>
  <line x1="40" y1="470" x2="1060" y2="470" stroke="#E8E8E8" stroke-width="3" stroke-linecap="round"/>
  <text x="130" y="506" class="s" fill="#E8E8E8">an automatic run takes steps 1 and 2 and keeps open tasks current; it asks nothing</text>
  <line x1="40" y1="520" x2="1060" y2="520" stroke="#3A3A3A" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 8"/>
  <line x1="40" y1="520" x2="372" y2="520" stroke="#6FAEE8" stroke-width="3" stroke-linecap="round"/>
  <line x1="556" y1="520" x2="716" y2="520" stroke="#6FAEE8" stroke-width="3" stroke-linecap="round"/>

  <line x1="40" y1="552" x2="1060" y2="552" stroke="#2A2A2A"/>
  <circle cx="46" cy="574" r="5" fill="#6CC69A"/><text x="60" y="579" class="foot">kit: the reflect skill</text>
  <circle cx="226" cy="574" r="5" fill="#6FAEE8"/><text x="240" y="579" class="foot">comando</text>
  <circle cx="326" cy="574" r="5" fill="#E7C55A"/><text x="340" y="579" class="foot">brain</text>
  <circle cx="406" cy="574" r="5" fill="#E8E8E8"/><text x="420" y="579" class="foot">you</text>
  <text x="1060" y="579" text-anchor="end" class="foot">comando · docs/brain</text>
</svg>
