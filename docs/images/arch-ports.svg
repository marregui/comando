<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Ports and adapters: core declares six ports its effects go to; in the app each port is implemented by an adapter of another module; in a test one fake from testkit, RecordingPorts, implements all six and records each call</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9AA0A6" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="510" fill="url(#bg)"/>
  <text x="40" y="44" font-size="13" letter-spacing="3" fill="#E7C55A">ARCHITECTURE · PORTS AND ADAPTERS</text>
  <text x="40" y="78" font-size="24" font-weight="300" fill="#E8E8E8">core names the sockets; the app and the tests bring the plugs</text>

  <g font-size="13" letter-spacing="2.5">
    <text x="40" y="126" fill="#6FAEE8">IN THE APP · AN ADAPTER EACH</text>
    <text x="390" y="126" fill="#E7C55A">CORE · THE PORTS</text>
    <text x="690" y="126" fill="#6FAEE8">IN A TEST · ONE FAKE</text>
  </g>

  <rect x="370" y="140" width="260" height="312" rx="10" fill="#161616" stroke="#E7C55A" stroke-width="2"/>
  <g fill="#1E1E1E" stroke-width="1.3">
    <g stroke="#6FAEE8">
      <rect x="40" y="152" width="270" height="40" rx="8"/><rect x="40" y="202" width="270" height="40" rx="8"/><rect x="40" y="252" width="270" height="40" rx="8"/>
      <rect x="40" y="302" width="270" height="40" rx="8"/><rect x="40" y="352" width="270" height="40" rx="8"/><rect x="40" y="402" width="270" height="40" rx="8"/>
      <rect x="690" y="152" width="270" height="290" rx="8" stroke-dasharray="6 5"/>
    </g>
    <g stroke="#E7C55A">
      <rect x="390" y="152" width="220" height="40" rx="8"/><rect x="390" y="202" width="220" height="40" rx="8"/><rect x="390" y="252" width="220" height="40" rx="8"/>
      <rect x="390" y="302" width="220" height="40" rx="8"/><rect x="390" y="352" width="220" height="40" rx="8"/><rect x="390" y="402" width="220" height="40" rx="8"/>
    </g>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="14">
    <g fill="#6FAEE8">
      <text x="56" y="177">DbRouter</text><text x="56" y="227">ClaudeAdapter</text><text x="56" y="277">McpServer</text>
      <text x="56" y="327">ComandoUi</text><text x="56" y="377">Store</text><text x="56" y="427">ToolsAdapter</text>
      <text x="706" y="182">RecordingPorts</text>
    </g>
    <g fill="#E7C55A">
      <text x="406" y="177">DatabasePort</text><text x="406" y="227">ClaudePort</text><text x="406" y="277">ApprovalPort</text>
      <text x="406" y="327">UiPort</text><text x="406" y="377">PersistencePort</text><text x="406" y="427">ToolPort</text>
    </g>
  </g>
  <g font-size="13" fill="#9AA0A6" text-anchor="end">
    <text x="294" y="177">module db</text><text x="294" y="227">module claude</text><text x="294" y="277">module mcp</text>
    <text x="294" y="327">module ui</text><text x="294" y="377">module app</text><text x="294" y="427">module tools</text>
  </g>
  <g font-size="13" fill="#9AA0A6">
    <text x="706" y="206">module testkit</text>
    <text x="706" y="250">It implements all six ports.</text>
    <text x="706" y="272">It does no work: it writes each</text>
    <text x="706" y="290">call down, and the test reads</text>
    <text x="706" y="308">the list.</text>
    <text x="706" y="352">So a test of the reducer needs</text>
    <text x="706" y="370">no database, no Claude Code</text>
    <text x="706" y="388">and no window.</text>
  </g>
  <g stroke="#9AA0A6" stroke-width="1.1" marker-end="url(#ar)">
    <line x1="310" y1="172" x2="389" y2="172"/><line x1="310" y1="222" x2="389" y2="222"/><line x1="310" y1="272" x2="389" y2="272"/>
    <line x1="310" y1="322" x2="389" y2="322"/><line x1="310" y1="372" x2="389" y2="372"/><line x1="310" y1="422" x2="389" y2="422"/>
    <line x1="690" y1="297" x2="631" y2="297"/>
  </g>

  <g font-size="13" fill="#9AA0A6">
    <rect x="40" y="472" width="14" height="14" rx="3" fill="#E7C55A"/><text x="62" y="484">core</text>
    <rect x="112" y="472" width="14" height="14" rx="3" fill="#6FAEE8"/><text x="134" y="484">comando's other modules</text>
    <text x="320" y="484">An arrow reads "implements". Dashed: tests only.</text>
    <text x="960" y="484" text-anchor="end">comando · docs/architecture</text>
  </g>
</svg>
