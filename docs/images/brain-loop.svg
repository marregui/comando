<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">The learning loop as a cycle of five stations: use, record, measure, report and reflect, each lap leaving the brain sharper</title>
  <defs>
    <style>
      .cap{font-size:13px;font-weight:600;letter-spacing:2.5px}
      .t{font-size:15px;fill:#E8E8E8}
      .s{font-size:14px;fill:#9AA0A6}
      .foot{font-size:13px;fill:#9AA0A6;letter-spacing:.5px}
    </style>
  </defs>
  <rect width="1100" height="590" fill="#161616"/>

  <text x="40" y="44" class="cap" fill="#E7C55A">THE LEARNING LOOP</text>
  <text x="40" y="68" class="s">Every session is used, recorded, measured and reflected on.</text>

  <!-- the cycle -->
  <circle cx="550" cy="300" r="170" fill="none" stroke="#3A3A3A" stroke-width="1.5"/>
  <g fill="#9AA0A6">
    <path d="M-7,-5 L7,0 L-7,5 Z" transform="translate(649.9,162.5) rotate(36)"/>
    <path d="M-7,-5 L7,0 L-7,5 Z" transform="translate(711.7,352.5) rotate(108)"/>
    <path d="M-7,-5 L7,0 L-7,5 Z" transform="translate(550,470) rotate(180)"/>
    <path d="M-7,-5 L7,0 L-7,5 Z" transform="translate(388.3,352.5) rotate(252)"/>
    <path d="M-7,-5 L7,0 L-7,5 Z" transform="translate(450.1,162.5) rotate(324)"/>
  </g>

  <!-- centre -->
  <circle cx="550" cy="300" r="74" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.5"/>
  <text x="550" y="294" text-anchor="middle" class="cap" fill="#E7C55A">THE BRAIN</text>
  <text x="550" y="318" text-anchor="middle" class="s" fill="#E8E8E8">sharper each lap</text>

  <!-- stations -->
  <circle cx="550" cy="130" r="8" fill="#161616" stroke="#D98E5F" stroke-width="2.5"/>
  <circle cx="711.7" cy="247.5" r="8" fill="#161616" stroke="#6FAEE8" stroke-width="2.5"/>
  <circle cx="649.9" cy="437.5" r="8" fill="#161616" stroke="#6CC69A" stroke-width="2.5"/>
  <circle cx="450.1" cy="437.5" r="8" fill="#161616" stroke="#E7C55A" stroke-width="2.5"/>
  <circle cx="388.3" cy="247.5" r="8" fill="#161616" stroke="#6CC69A" stroke-width="2.5"/>

  <text x="574" y="112" class="cap" fill="#D98E5F">1 · USE</text>
  <text x="574" y="134" class="t">the session reads the index and opens memory on cue</text>

  <text x="736" y="236" class="cap" fill="#6FAEE8">2 · RECORD</text>
  <text x="736" y="258" class="t">Claude Code keeps the transcript;</text>
  <text x="736" y="278" class="t">comando keeps metrics and an audit</text>

  <text x="674" y="440" class="cap" fill="#6CC69A">3 · MEASURE</text>
  <text x="674" y="462" class="t">the kit's scheduled jobs score recall,</text>
  <text x="674" y="482" class="t">corrections and knowledge-base drift</text>

  <g text-anchor="end">
    <text x="426" y="440" class="cap" fill="#E7C55A">4 · REPORT</text>
    <text x="426" y="462" class="t">findings wait as tasks in the</text>
    <text x="426" y="482" class="t">scratchpad; some wait on you</text>

    <text x="364" y="236" class="cap" fill="#6CC69A">5 · REFLECT</text>
    <text x="364" y="258" class="t">findings and the session become</text>
    <text x="364" y="278" class="t">memory, KB and kit changes</text>
  </g>

  <text x="550" y="528" text-anchor="middle" class="s">EVAL, optional: an answer key of past prompts and the memory files each one needed. It scores the index.</text>

  <line x1="40" y1="546" x2="1060" y2="546" stroke="#2A2A2A"/>
  <circle cx="46" cy="566" r="5" fill="#D98E5F"/><text x="60" y="571" class="foot">Claude Code session</text>
  <circle cx="220" cy="566" r="5" fill="#6FAEE8"/><text x="234" y="571" class="foot">comando</text>
  <circle cx="320" cy="566" r="5" fill="#6CC69A"/><text x="334" y="571" class="foot">kit</text>
  <circle cx="386" cy="566" r="5" fill="#E7C55A"/><text x="400" y="571" class="foot">brain</text>
  <text x="1060" y="571" text-anchor="end" class="foot">comando · docs/brain</text>
</svg>
