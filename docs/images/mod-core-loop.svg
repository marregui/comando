<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The loop: an intent enters, the reducer answers with a new state and effects, effects leave through ports</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></radialGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#9AA0A6" stroke-width="1.4"/></marker>
</defs>
<rect width="1200" height="600" fill="url(#bg)"/>
<text x="48" y="48" font-size="13" fill="#E7C55A" letter-spacing="3">MODULE · CORE · THE LOOP</text>
<text x="48" y="82" font-size="24" font-weight="300" fill="#E8E8E8">One intent at a time: state in, new state and effects out</text>

<rect x="48" y="190" width="210" height="150" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="64" y="216" font-size="13" fill="#9AA0A6" letter-spacing="2">WHO SENDS</text>
<text x="64" y="244" font-size="14" fill="#E8E8E8">the window (ui)</text>
<text x="64" y="266" font-size="14" fill="#E8E8E8">an agent's tool (mcp)</text>
<text x="64" y="288" font-size="14" fill="#E8E8E8">an adapter's answer</text>
<text x="64" y="322" font-size="13" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">dispatch(intent)</text>

<rect x="300" y="210" width="110" height="110" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="316" y="234" font-size="13" fill="#9AA0A6" letter-spacing="2">QUEUE</text>
<rect x="316" y="246" width="78" height="15" rx="3" fill="#2A2A2A" stroke="#6FAEE8" stroke-width="1"/>
<rect x="316" y="268" width="78" height="15" rx="3" fill="#2A2A2A" stroke="#6FAEE8" stroke-width="1"/>
<rect x="316" y="290" width="78" height="15" rx="3" fill="#2A2A2A" stroke="#6FAEE8" stroke-width="1"/>

<rect x="452" y="120" width="400" height="330" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<text x="472" y="152" font-size="16" fill="#E7C55A" font-family="Menlo, Consolas, monospace">StateLoop</text>
<text x="472" y="174" font-size="13" fill="#9AA0A6">one thread, named comando-reducer</text>
<g font-size="13" fill="#121212" text-anchor="middle" font-weight="600">
<circle cx="486" cy="213" r="11" fill="#E7C55A"/><text x="486" y="218">1</text>
<circle cx="486" cy="259" r="11" fill="#E7C55A"/><text x="486" y="264">2</text>
<circle cx="486" cy="305" r="11" fill="#E7C55A"/><text x="486" y="310">3</text>
<circle cx="486" cy="351" r="11" fill="#E7C55A"/><text x="486" y="356">4</text>
<circle cx="486" cy="397" r="11" fill="#E7C55A"/><text x="486" y="402">5</text>
</g>
<text x="510" y="218" font-size="14" fill="#E8E8E8">observers see the intent</text>
<text x="510" y="264" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">reducer.apply(state, intent)</text>
<text x="510" y="310" font-size="14" fill="#E8E8E8">the new state replaces the old one</text>
<text x="510" y="356" font-size="14" fill="#E8E8E8">each effect goes to the router</text>
<text x="510" y="402" font-size="14" fill="#E8E8E8">listeners hear: previous, next</text>
<text x="472" y="436" font-size="13" fill="#9AA0A6">Nothing here waits for the outside world.</text>

<rect x="900" y="120" width="252" height="330" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="916" y="152" font-size="16" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">EffectRouter</text>
<text x="916" y="174" font-size="13" fill="#9AA0A6">one switch, six ports</text>
<g font-family="Menlo, Consolas, monospace" font-size="13" fill="#E8E8E8">
<text x="916" y="212">DatabasePort</text>
<text x="916" y="246">ClaudePort</text>
<text x="916" y="280">ApprovalPort</text>
<text x="916" y="314">UiPort</text>
<text x="916" y="348">ToolPort</text>
<text x="916" y="382">PersistencePort</text>
</g>
<g font-size="13" fill="#9AA0A6" text-anchor="end">
<text x="1136" y="212">8 effects</text>
<text x="1136" y="246">8</text>
<text x="1136" y="280">1</text>
<text x="1136" y="314">10</text>
<text x="1136" y="348">11</text>
<text x="1136" y="382">4</text>
</g>
<line x1="916" y1="400" x2="1136" y2="400" stroke="#3A3A3A" stroke-width="1"/>
<text x="916" y="428" font-size="13" fill="#9AA0A6">42 kinds of effect in all</text>

<g fill="none" stroke="#9AA0A6" stroke-width="1" marker-end="url(#a)">
<path d="M258,265 L298,265"/>
<path d="M410,265 L450,265"/>
<path d="M852,285 L898,285"/>
<path d="M1026,450 L1026,512 L153,512 L153,342"/>
</g>
<text x="590" y="540" font-size="14" fill="#E8E8E8" text-anchor="middle">Adapters do the slow work on their own threads, then answer with a new intent.</text>
<text x="48" y="580" font-size="13" fill="#9AA0A6" letter-spacing="1">comando · docs/modules/core.md</text>
</svg>
