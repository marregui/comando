<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The frontear gateway: an MQTT 5 server on 127.0.0.1 where clients connect, the gate decides what each may do, the topic tree matches a publish to its subscribers, and the message is delivered through their sessions or to the links inside the process</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#9AA0A6" stroke-width="1.4"/></marker>
<marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#AEB6C1" stroke-width="1.4"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#E7C55A" stroke-width="1.4"/></marker>
</defs>
<rect width="1200" height="700" fill="#161616"/>
<text x="40" y="44" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">FRONTEAR · THE GATEWAY</text>
<text x="40" y="76" font-size="22" font-weight="300" fill="#E8E8E8">An MQTT 5 server on 127.0.0.1: clients connect, subscribe and publish</text>

<!-- the publisher and what it sends -->
<rect x="40" y="104" width="250" height="60" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.2"/>
<text x="56" y="128" font-size="13" fill="#9AA0A6" letter-spacing="2">PUBLISHER</text>
<text x="56" y="150" font-size="13" fill="#E8E8E8">an MQTT 5 client</text>
<text x="40" y="188" font-size="13" fill="#E8E8E8">1 · CONNECT</text>
<line x1="130" y1="184" x2="332" y2="184" stroke="#AEB6C1" stroke-width="1.2" marker-end="url(#s)"/>
<text x="40" y="210" font-size="13" fill="#9AA0A6">CONNACK</text>
<line x1="332" y1="206" x2="112" y2="206" stroke="#9AA0A6" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="40" y="232" font-size="13" fill="#E8E8E8">3 · PUBLISH <tspan font-family="Menlo, Consolas, monospace">jobs/1</tspan></text>
<line x1="196" y1="228" x2="332" y2="228" stroke="#AEB6C1" stroke-width="1.2" marker-end="url(#s)"/>
<text x="40" y="254" font-size="13" fill="#E7C55A">6 · PUBACK</text>
<line x1="332" y1="250" x2="128" y2="250" stroke="#E7C55A" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#g)"/>
<text x="40" y="284" font-size="13" fill="#9AA0A6">QoS 1: the PUBACK leaves once</text>
<text x="40" y="302" font-size="13" fill="#9AA0A6">every internal subscriber the</text>
<text x="40" y="320" font-size="13" fill="#9AA0A6">message reached is done with it,</text>
<text x="40" y="338" font-size="13" fill="#9AA0A6">with the worst of their codes</text>

<!-- the gateway -->
<rect x="320" y="104" width="560" height="482" rx="10" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<text x="336" y="128" font-size="13" fill="#E7C55A" letter-spacing="2">GATEWAY</text>
<text x="866" y="128" font-size="13" fill="#9AA0A6" text-anchor="end" font-family="Menlo, Consolas, monospace">127.0.0.1 · a port of its own</text>

<g fill="#242424" stroke="#3A3A3A" stroke-width="1">
<rect x="336" y="146" width="250" height="110" rx="6"/>
<rect x="616" y="146" width="250" height="110" rx="6"/>
<rect x="336" y="272" width="250" height="96" rx="6"/>
<rect x="336" y="384" width="250" height="96" rx="6"/>
<rect x="616" y="384" width="250" height="96" rx="6"/>
</g>
<rect x="616" y="272" width="250" height="96" rx="6" fill="#2B2618" stroke="#E7C55A" stroke-width="1.2"/>

<text x="352" y="170" font-size="13" fill="#9AA0A6" letter-spacing="2">CONNECTION</text>
<text x="352" y="194" font-size="13" fill="#E8E8E8">one per client:</text>
<text x="352" y="214" font-size="13" fill="#E8E8E8">a reader strand, packets in order;</text>
<text x="352" y="234" font-size="13" fill="#E8E8E8">a writer strand, what it is sent</text>

<text x="632" y="170" font-size="13" fill="#9AA0A6" letter-spacing="2">GATE</text>
<text x="632" y="194" font-size="13" fill="#E8E8E8">may this client do it? if not, 0x87</text>
<text x="632" y="216" font-size="13" fill="#9AA0A6" font-family="Menlo, Consolas, monospace">mayConnect · mayPublish</text>
<text x="632" y="236" font-size="13" fill="#9AA0A6" font-family="Menlo, Consolas, monospace">maySubscribe · mayRetain</text>
<line x1="586" y1="200" x2="612" y2="200" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<text x="632" y="296" font-size="13" fill="#E7C55A" letter-spacing="2">4 · TOPIC TREE</text>
<text x="632" y="318" font-size="13" fill="#E8E8E8">every subscription's filter;</text>
<text x="632" y="338" font-size="13" fill="#E8E8E8">a topic matches one entry per</text>
<text x="632" y="356" font-size="13" fill="#E8E8E8">subscriber, at its highest QoS</text>
<line x1="741" y1="256" x2="741" y2="268" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<text x="352" y="296" font-size="13" fill="#9AA0A6" letter-spacing="2">RETAINED · PRESENCE</text>
<text x="352" y="318" font-size="13" fill="#E8E8E8">the last retained message per topic</text>
<text x="352" y="340" font-size="13" fill="#9AA0A6" font-family="Menlo, Consolas, monospace">$frontear/presence/&lt;id&gt;</text>
<text x="352" y="358" font-size="13" fill="#E8E8E8">retained while the client is on</text>

<text x="632" y="408" font-size="13" fill="#9AA0A6" letter-spacing="2">5 · SESSIONS</text>
<text x="632" y="430" font-size="13" fill="#E8E8E8">per client, in memory: QoS 1</text>
<text x="632" y="450" font-size="13" fill="#E8E8E8">messages in flight and queued,</text>
<text x="632" y="470" font-size="13" fill="#E8E8E8">and the will it left</text>
<line x1="741" y1="368" x2="741" y2="380" stroke="#E7C55A" stroke-width="1.4" marker-end="url(#g)"/>

<text x="352" y="408" font-size="13" fill="#9AA0A6" letter-spacing="2">5 · INTERNAL SUBSCRIBERS</text>
<text x="352" y="430" font-size="13" fill="#E8E8E8">inside the process; each link</text>
<text x="352" y="450" font-size="13" fill="#E8E8E8">is one, under the name</text>
<text x="352" y="470" font-size="13" fill="#E7C55A" font-family="Menlo, Consolas, monospace">$link/&lt;id&gt;</text>
<path d="M616,350 L601,350 L601,432 L590,432" fill="none" stroke="#E7C55A" stroke-width="1.4" marker-end="url(#g)"/>

<rect x="336" y="496" width="530" height="76" rx="6" fill="none" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="5 4"/>
<text x="352" y="520" font-size="13" fill="#9AA0A6" letter-spacing="2">REMOTE LISTENER · BORDER GATEWAY ONLY</text>
<text x="352" y="542" font-size="13" fill="#E8E8E8">TLS 1.3 on one address, port 18893 by default;</text>
<text x="352" y="562" font-size="13" fill="#E8E8E8">each connection speaks for the machine its certificate names</text>

<!-- the subscriber -->
<rect x="910" y="104" width="250" height="88" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="926" y="128" font-size="13" fill="#9AA0A6" letter-spacing="2">CONNACK STATES</text>
<text x="926" y="150" font-size="13" fill="#E8E8E8">QoS 0 and 1; no QoS 2, no</text>
<text x="926" y="170" font-size="13" fill="#E8E8E8">subscription ids, no shared ones</text>
<path d="M1130,384 L1130,210 L870,210" fill="none" stroke="#AEB6C1" stroke-width="1.2" marker-end="url(#s)"/>
<text x="1118" y="262" font-size="13" fill="#E8E8E8" text-anchor="end">2 · SUBSCRIBE <tspan font-family="Menlo, Consolas, monospace">jobs/#</tspan></text>
<text x="1118" y="282" font-size="13" fill="#9AA0A6" text-anchor="end">the gate is asked, the tree</text>
<text x="1118" y="300" font-size="13" fill="#9AA0A6" text-anchor="end">adds it, SUBACK goes back</text>
<line x1="866" y1="432" x2="906" y2="432" stroke="#E7C55A" stroke-width="1.4" marker-end="url(#g)"/>
<rect x="910" y="384" width="250" height="96" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.2"/>
<text x="926" y="408" font-size="13" fill="#9AA0A6" letter-spacing="2">SUBSCRIBER</text>
<text x="926" y="430" font-size="13" fill="#E8E8E8">an MQTT 5 client; gets</text>
<text x="926" y="450" font-size="13" fill="#E8E8E8">PUBLISH <tspan font-family="Menlo, Consolas, monospace">jobs/1</tspan> from its writer</text>
<text x="926" y="470" font-size="13" fill="#9AA0A6">and answers with a PUBACK</text>

<text x="40" y="616" font-size="13" fill="#9AA0A6">No lock is held while a message is routed: the gate and the internal subscribers run on the client's reader strand and must not block.</text>
<text x="40" y="636" font-size="13" fill="#9AA0A6">QoS 1 is at least once while the gateway runs and within a session's bounds; the sessions are in memory, so a restart loses what they held.</text>

<line x1="40" y1="656" x2="1160" y2="656" stroke="#2A2A2A" stroke-width="1"/>
<rect x="40" y="668" width="14" height="14" rx="3" fill="#E7C55A"/><text x="60" y="680" font-size="13" fill="#9AA0A6">the gateway, and a message's way</text>
<rect x="300" y="668" width="14" height="14" rx="3" fill="#AEB6C1"/><text x="320" y="680" font-size="13" fill="#9AA0A6">MQTT clients</text>
<rect x="440" y="668" width="14" height="14" rx="3" fill="none" stroke="#9AA0A6" stroke-dasharray="3 2"/><text x="460" y="680" font-size="13" fill="#9AA0A6">only on the border gateway</text>
<text x="1160" y="680" font-size="13" fill="#9AA0A6" text-anchor="end">comando · docs/frontear.md</text>
</svg>
