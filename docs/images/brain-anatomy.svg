<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">The brain's three stores side by side: scratchpad, memory and knowledge base, by what each holds, how certain it is, who writes it and how long it lives</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#E7C55A"/></marker>
    <style>
      .cap{font-size:13px;font-weight:600;letter-spacing:2.5px}
      .h{font-size:21px;font-weight:300;fill:#E8E8E8}
      .t{font-size:15px;fill:#E8E8E8}
      .s{font-size:14px;fill:#9AA0A6}
      .k{font-size:13px;font-weight:600;letter-spacing:1.5px;fill:#9AA0A6}
      .m{font-family:Menlo, Consolas, monospace;font-size:13px;fill:#9AA0A6}
      .foot{font-size:13px;fill:#9AA0A6;letter-spacing:.5px}
    </style>
  </defs>
  <rect width="1100" height="580" fill="#161616"/>

  <text x="40" y="44" class="cap" fill="#E7C55A">THE BRAIN · THREE STORES</text>
  <text x="40" y="68" class="s">Each store has its own certainty, its own writers and its own lifetime.</text>

  <g fill="#1E1E1E" stroke="#E7C55A" stroke-opacity=".7">
    <rect x="40" y="96" width="320" height="356" rx="6"/>
    <rect x="390" y="96" width="320" height="356" rx="6"/>
    <rect x="740" y="96" width="320" height="356" rx="6"/>
  </g>

  <!-- scratchpad -->
  <text x="60" y="128" class="cap" fill="#E7C55A">SCRATCHPAD</text>
  <text x="340" y="128" text-anchor="end" class="m">SCRATCHPAD/</text>
  <text x="60" y="160" class="h">today's work</text>
  <line x1="60" y1="178" x2="340" y2="178" stroke="#2A2A2A"/>
  <text x="60" y="204" class="k">HOLDS</text>
  <text x="60" y="226" class="t">a task index, topic folders,</text>
  <text x="60" y="246" class="t">agents' reports</text>
  <text x="60" y="280" class="k">CERTAINTY</text>
  <text x="60" y="302" class="t">provisional: it may be wrong</text>
  <text x="60" y="336" class="k">WRITTEN BY</text>
  <text x="60" y="358" class="t">any session, agent or job</text>
  <text x="60" y="392" class="k">LIVES</text>
  <text x="60" y="414" class="t">until its task is done</text>

  <!-- memory -->
  <text x="410" y="128" class="cap" fill="#E7C55A">MEMORY</text>
  <text x="690" y="128" text-anchor="end" class="m">MEMORY/</text>
  <text x="410" y="160" class="h">working context</text>
  <line x1="410" y1="178" x2="690" y2="178" stroke="#2A2A2A"/>
  <text x="410" y="204" class="k">HOLDS</text>
  <text x="410" y="226" class="t">the state of the work, preferences,</text>
  <text x="410" y="246" class="t">corrections, lessons, pointers</text>
  <text x="410" y="280" class="k">CERTAINTY</text>
  <text x="410" y="302" class="t">true when it was written</text>
  <text x="410" y="336" class="k">WRITTEN BY</text>
  <text x="410" y="358" class="t">any session, and /reflect</text>
  <text x="410" y="392" class="k">LIVES</text>
  <text x="410" y="414" class="t">as long as it changes what you do</text>

  <!-- knowledge base -->
  <text x="760" y="128" class="cap" fill="#E7C55A">KNOWLEDGE BASE</text>
  <text x="1040" y="128" text-anchor="end" class="m">KB/</text>
  <text x="760" y="160" class="h">checked knowledge</text>
  <line x1="760" y1="178" x2="1040" y2="178" stroke="#2A2A2A"/>
  <text x="760" y="204" class="k">HOLDS</text>
  <text x="760" y="226" class="t">documents in sets, each kept true</text>
  <text x="760" y="246" class="t">against a named source</text>
  <text x="760" y="280" class="k">CERTAINTY</text>
  <text x="760" y="302" class="t">must match its sources</text>
  <text x="760" y="336" class="k">WRITTEN BY</text>
  <text x="760" y="358" class="t">/reflect only, through a gate</text>
  <text x="760" y="392" class="k">LIVES</text>
  <text x="760" y="414" class="t">while its source still agrees</text>

  <!-- certainty arrow -->
  <line x1="40" y1="486" x2="1056" y2="486" stroke="#E7C55A" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="40" y="514" class="cap" fill="#E7C55A">CERTAINTY GROWS</text>
  <text x="1060" y="514" text-anchor="end" class="s">/reflect carries what proved true to the right; the scratchpad empties as tasks finish</text>

  <line x1="40" y1="536" x2="1060" y2="536" stroke="#2A2A2A"/>
  <text x="1060" y="561" text-anchor="end" class="foot">comando · docs/brain</text>
</svg>
