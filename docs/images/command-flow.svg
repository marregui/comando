<text x="1204" y="342" text-anchor="start" font-size="15" font-weight="400" fill="#6FAEE8" >claude processes</text>
<text x="1204" y="364" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >a strand and a reader per session</text>
