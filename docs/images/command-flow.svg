<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#101010"/></radialGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#9A9A9A" stroke-width="1.4"/></marker></defs>
<rect width="1600" height="860" fill="url(#bg)"/>
<text x="60" y="52" text-anchor="start" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">ARCHITECTURE · ONE COMMAND</text>
<text x="60" y="84" text-anchor="start" font-size="24" font-weight="300" fill="#F2F2F2" >Intents in, one reducer, effects out</text>
<rect x="60" y="170" width="340" height="450" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="74" y="196" text-anchor="start" font-size="15" font-weight="400" fill="#6FAEE8" >ui · the EDT</text>
<rect x="80" y="220" width="300" height="90" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="94" y="246" text-anchor="start" font-size="15" font-weight="400" fill="#6FAEE8" >editor, sidebar, cards</text>
<text x="94" y="268" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >keys and clicks become intents</text>
