<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>One command's path: a key on the EDT becomes an intent in the queue; the reducer applies it on its own thread and returns the next AppState and a list of effects; the effect router hands each effect to its port; the adapters do the work on their own threads and report back with intents; the window renders the state; Claude Code's calls to the MCP server become intents too</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9AA0A6" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="560" fill="url(#bg)"/>
  <text x="40" y="44" font-size="13" letter-spacing="3" fill="#E7C55A">ARCHITECTURE · ONE COMMAND</text>
  <text x="40" y="78" font-size="24" font-weight="300" fill="#E8E8E8">Intents in, one reducer, effects out</text>

  <!-- lanes -->
  <g font-size="13" letter-spacing="2.5">
    <text x="40" y="128" fill="#6FAEE8">UI · THE EDT</text>
    <text x="300" y="128" fill="#E7C55A">CORE · THE REDUCER THREAD</text>
    <text x="760" y="128" fill="#6FAEE8">THE ADAPTERS</text>
  </g>

  <g fill="#1E1E1E" stroke-width="1.3">
    <rect x="40" y="146" width="200" height="76" rx="8" stroke="#6FAEE8"/>
    <rect x="40" y="398" width="200" height="76" rx="8" stroke="#6FAEE8"/>
    <rect x="300" y="146" width="240" height="76" rx="8" stroke="#E7C55A"/>
    <rect x="300" y="264" width="240" height="92" rx="8" stroke="#E7C55A" stroke-width="2"/>
    <rect x="300" y="398" width="240" height="76" rx="8" stroke="#E7C55A" stroke-dasharray="6 5"/>
    <rect x="590" y="272" width="130" height="76" rx="8" stroke="#E7C55A"/>
    <rect x="760" y="146" width="200" height="246" rx="8" stroke="#6FAEE8"/>
    <rect x="760" y="420" width="200" height="54" rx="8" stroke="#D98E5F"/>
  </g>

  <g font-size="16">
    <text x="56" y="174" fill="#6FAEE8">keys and clicks</text>
    <text x="56" y="426" fill="#6FAEE8">render</text>
    <text x="316" y="174" fill="#E7C55A">the intent queue</text>
    <text x="316" y="454" font-size="13" fill="#9AA0A6">immutable; the reducer its one writer</text>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="15" fill="#E7C55A">
    <text x="316" y="292">Reducer.apply</text>
    <text x="316" y="426">AppState</text>
    <text x="604" y="300">EffectRouter</text>
  </g>
  <g font-size="13" fill="#9AA0A6">
    <text x="56" y="196">become intents</text>
    <text x="56" y="448">the window follows the state</text>
    <text x="316" y="196">unbounded; order kept per sender</text>
    <text x="316" y="314">(state, intent) gives the next</text>
    <text x="316" y="332">state and a list of effects</text>
    <text x="604" y="322">each effect to</text>
    <text x="604" y="340">its port</text>
  </g>

  <!-- adapters -->
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#6FAEE8">
    <text x="776" y="176">db</text><text x="776" y="216">claude</text><text x="776" y="256">mcp</text>
    <text x="776" y="296">tools</text><text x="776" y="336">ui</text><text x="776" y="376">app</text>
  </g>
  <g font-size="13" fill="#9AA0A6">
    <text x="846" y="176">SQL on a lane</text><text x="846" y="216">a session</text><text x="846" y="256">approvals</text>
    <text x="846" y="296">Gradle, git</text><text x="846" y="336">the window</text><text x="846" y="376">the store</text>
  </g>
  <text x="776" y="452" font-size="16" fill="#D98E5F">Claude Code</text>
  <text x="880" y="452" font-size="13" fill="#9AA0A6">MCP calls</text>

  <!-- arrows -->
  <g stroke="#9AA0A6" stroke-width="1.1" fill="none" marker-end="url(#ar)">
    <line x1="240" y1="184" x2="299" y2="184"/>
    <line x1="420" y1="222" x2="420" y2="263"/>
    <line x1="420" y1="356" x2="420" y2="397"/>
    <line x1="300" y1="436" x2="241" y2="436"/>
    <line x1="540" y1="310" x2="589" y2="310"/>
    <line x1="720" y1="310" x2="759" y2="310"/>
    <path d="M930 146 L930 100 L420 100 L420 145"/>
    <line x1="860" y1="420" x2="860" y2="393"/>
  </g>
  <g font-size="13" fill="#9AA0A6">
    <text x="252" y="176">intent</text>
    <text x="432" y="248">one at a time</text>
    <text x="432" y="382">next state</text>
    <text x="248" y="428">state</text>
    <text x="546" y="302">effects</text>
    <text x="520" y="94">intents back, from the adapters' own threads: rows, events, outcomes</text>
  </g>

  <g font-size="13" fill="#9AA0A6">
    <rect x="40" y="508" width="14" height="14" rx="3" fill="#E7C55A"/><text x="62" y="520">core</text>
    <rect x="112" y="508" width="14" height="14" rx="3" fill="#6FAEE8"/><text x="134" y="520">comando's other modules</text>
    <rect x="304" y="508" width="14" height="14" rx="3" fill="#D98E5F"/><text x="326" y="520">Claude Code</text>
    <text x="960" y="520" text-anchor="end">comando · docs/architecture</text>
  </g>
</svg>
