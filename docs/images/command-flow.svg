<text x="94" y="516" text-anchor="start" font-size="15" font-weight="400" fill="#6FAEE8" >results, transcript, views</text>
<text x="94" y="538" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >render the state, coalesced</text>
