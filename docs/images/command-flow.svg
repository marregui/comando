<text x="559" y="246" text-anchor="start" font-size="15" font-weight="400" fill="#E7C55A" >intent queue</text>
<text x="559" y="268" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >unbounded; one thread's intents keep order</text>
<rect x="545" y="340" width="350" height="90" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.2"/>
<text x="559" y="366" text-anchor="start" font-size="15" font-weight="400" fill="#E7C55A" >Reducer.apply</text>
<text x="559" y="388" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >(state, intent) → next state + effects</text>
<text x="559" y="407" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >pure in its arguments and a Clock</text>
<rect x="545" y="490" width="350" height="90" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="559" y="516" text-anchor="start" font-size="15" font-weight="400" fill="#E7C55A" >AppState</text>
<text x="559" y="538" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >immutable; the reducer its one writer</text>
