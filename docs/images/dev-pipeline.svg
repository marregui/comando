<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>From a clone to a release in six stages: your clone with JDK 25 and the Gradle wrapper; ./gradlew build, where warnings and Checkstyle reports fail the build and the unit and adapter tests run; :app:uiTest, the tests on the real window; the gates for frame times, threads, file reads and layers; CI on macOS and Ubuntu for every push and pull request; a tag v* that builds the dmg, tar.gz and zip packages. The first four stages run on your machine, the last two on GitHub Actions</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></radialGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9AA0A6" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="380" fill="url(#bg)"/>
  <text x="40" y="44" font-size="13" letter-spacing="3" fill="#E7C55A">DEVELOPMENT</text>
  <text x="40" y="78" font-size="24" font-weight="300" fill="#E8E8E8">From a clone to a release, each stage a stricter check</text>

  <g fill="#1E1E1E" stroke-width="1.3">
    <rect x="40" y="120" width="140" height="124" rx="8" stroke="#E7C55A" stroke-width="2"/>
    <rect x="196" y="120" width="140" height="124" rx="8" stroke="#6FAEE8"/>
    <rect x="352" y="120" width="140" height="124" rx="8" stroke="#6FAEE8"/>
    <rect x="508" y="120" width="140" height="124" rx="8" stroke="#6FAEE8"/>
    <rect x="664" y="120" width="140" height="124" rx="8" stroke="#AEB6C1"/>
    <rect x="820" y="120" width="140" height="124" rx="8" stroke="#AEB6C1"/>
  </g>
  <g font-size="13" letter-spacing="2">
    <text x="52" y="148" fill="#E7C55A">YOUR CLONE</text>
    <text x="520" y="148" fill="#6FAEE8">GATES</text>
    <text x="676" y="148" fill="#AEB6C1">CI</text>
    <text x="832" y="148" fill="#AEB6C1">RELEASE</text>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#6FAEE8">
    <text x="208" y="148">build</text>
    <text x="364" y="148">:app:uiTest</text>
  </g>
  <g font-size="13" fill="#9AA0A6">
    <text x="52" y="176">JDK 25</text>
    <text x="52" y="196">the Gradle wrapper</text>
    <text x="52" y="216">Claude Code CLI</text>
    <text x="208" y="176">warnings fail it</text>
    <text x="208" y="196">Checkstyle fails it</text>
    <text x="208" y="216">unit, adapter tests</text>
    <text x="364" y="176">the real window,</text>
    <text x="364" y="196">off screen, one</text>
    <text x="364" y="216">JVM per class</text>
    <text x="520" y="176">frame times, p99</text>
    <text x="520" y="196">threads, file reads</text>
    <text x="520" y="216">layers, test docs</text>
    <text x="676" y="176">macOS and Ubuntu</text>
    <text x="676" y="196">every push and</text>
    <text x="676" y="216">pull request</text>
    <text x="832" y="176">a tag v*</text>
    <text x="832" y="196">dmg, tar.gz, zip</text>
    <text x="832" y="216">unsigned</text>
  </g>
  <g stroke="#9AA0A6" stroke-width="1.3" fill="none" marker-end="url(#a)">
    <path d="M180 182 H194"/>
    <path d="M336 182 H350"/>
    <path d="M492 182 H506"/>
    <path d="M648 182 H662"/>
    <path d="M804 182 H818"/>
  </g>

  <path d="M40 278 V286 H648 V278" fill="none" stroke="#6FAEE8" stroke-width="1.2"/>
  <path d="M664 278 V286 H960 V278" fill="none" stroke="#AEB6C1" stroke-width="1.2"/>
  <text x="344" y="308" font-size="13" letter-spacing="2" text-anchor="middle" fill="#6FAEE8">ON YOUR MACHINE</text>
  <text x="812" y="308" font-size="13" letter-spacing="2" text-anchor="middle" fill="#AEB6C1">ON GITHUB ACTIONS</text>

  <text x="40" y="354" font-size="13" fill="#9AA0A6">A stage runs only what the stage before it let through.</text>
  <text x="960" y="354" font-size="13" text-anchor="end" fill="#9AA0A6">comando · docs/development.md</text>
</svg>
