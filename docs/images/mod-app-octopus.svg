<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>The octopus network: three instances, each with a frontear node inside its own JVM, hosted by its FrontearOctopus on its own port from 18883 up, and its MqttPeerGateway as that node's client; each node has a link to every other node, one each way, and each link keeps a log at its sender until the peer acknowledges; the registry ~/.comando-fabric.json holds each instance's port</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9AA0A6" stroke-width="1.5"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#E7C55A" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="670" fill="url(#bg)"/>
  <text x="40" y="44" font-size="13" letter-spacing="3" fill="#E7C55A">MODULE APP · THE OCTOPUS</text>
  <text x="40" y="78" font-size="24" font-weight="300" fill="#E8E8E8">One node per instance, a link to every other, each link with its log</text>

  <!-- instance one -->
  <rect x="40" y="110" width="300" height="200" rx="10" fill="none" stroke="#3A3A3A" stroke-width="1"/>
  <text x="58" y="136" font-size="13" letter-spacing="2" fill="#6FAEE8">INSTANCE ONE · ITS JVM</text>
  <rect x="58" y="150" width="264" height="40" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.3"/>
  <text x="72" y="175" font-family="Menlo, Consolas, monospace" font-size="13" fill="#AEB6C1">MqttPeerGateway</text>
  <text x="198" y="175" font-size="13" fill="#9AA0A6">client comando-one</text>
  <line x1="190" y1="190" x2="190" y2="246" stroke="#9AA0A6" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="58" y="216" width="264" height="80" rx="8" fill="none" stroke="#6FAEE8" stroke-width="1.3"/>
  <text x="72" y="236" font-family="Menlo, Consolas, monospace" font-size="13" fill="#6FAEE8">FrontearOctopus</text>
  <rect x="72" y="248" width="236" height="40" rx="6" fill="#161616" stroke="#6FAEE8" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="190" y="273" text-anchor="middle" font-size="13" fill="#E8E8E8">node one · port 18883</text>

  <!-- instance two -->
  <rect x="660" y="110" width="300" height="200" rx="10" fill="none" stroke="#3A3A3A" stroke-width="1"/>
  <text x="678" y="136" font-size="13" letter-spacing="2" fill="#6FAEE8">INSTANCE TWO · ITS JVM</text>
  <rect x="678" y="150" width="264" height="40" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.3"/>
  <text x="692" y="175" font-family="Menlo, Consolas, monospace" font-size="13" fill="#AEB6C1">MqttPeerGateway</text>
  <text x="818" y="175" font-size="13" fill="#9AA0A6">client comando-two</text>
  <line x1="810" y1="190" x2="810" y2="246" stroke="#9AA0A6" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="678" y="216" width="264" height="80" rx="8" fill="none" stroke="#6FAEE8" stroke-width="1.3"/>
  <text x="692" y="236" font-family="Menlo, Consolas, monospace" font-size="13" fill="#6FAEE8">FrontearOctopus</text>
  <rect x="692" y="248" width="236" height="40" rx="6" fill="#161616" stroke="#6FAEE8" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="810" y="273" text-anchor="middle" font-size="13" fill="#E8E8E8">node two · port 18884</text>

  <!-- instance three -->
  <rect x="350" y="390" width="300" height="200" rx="10" fill="none" stroke="#3A3A3A" stroke-width="1"/>
  <rect x="368" y="404" width="264" height="80" rx="8" fill="none" stroke="#6FAEE8" stroke-width="1.3"/>
  <rect x="382" y="414" width="236" height="40" rx="6" fill="#161616" stroke="#6FAEE8" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="500" y="439" text-anchor="middle" font-size="13" fill="#E8E8E8">node three · port 18885</text>
  <text x="382" y="474" font-family="Menlo, Consolas, monospace" font-size="13" fill="#6FAEE8">FrontearOctopus</text>
  <line x1="500" y1="500" x2="500" y2="457" stroke="#9AA0A6" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="368" y="500" width="264" height="40" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.3"/>
  <text x="382" y="525" font-family="Menlo, Consolas, monospace" font-size="13" fill="#AEB6C1">MqttPeerGateway</text>
  <text x="498" y="525" font-size="13" fill="#9AA0A6">client comando-three</text>
  <text x="368" y="570" font-size="13" letter-spacing="2" fill="#6FAEE8">INSTANCE THREE · ITS JVM</text>

  <!-- the links, one each way; each log sits at its sender -->
  <g stroke="#E7C55A" stroke-width="1.6" marker-end="url(#ag)">
    <line x1="308" y1="260" x2="690" y2="260"/>
    <line x1="692" y1="276" x2="310" y2="276"/>
    <line x1="250" y1="288" x2="409" y2="412"/>
    <line x1="446" y1="414" x2="287" y2="290"/>
    <line x1="750" y1="288" x2="591" y2="412"/>
    <line x1="554" y1="414" x2="713" y2="290"/>
  </g>
  <g fill="#E7C55A">
    <rect x="352" y="252" width="12" height="16" rx="2"/>
    <rect x="636" y="268" width="12" height="16" rx="2"/>
    <rect x="297" y="322" width="12" height="16" rx="2"/>
    <rect x="387" y="364" width="12" height="16" rx="2"/>
    <rect x="691" y="322" width="12" height="16" rx="2"/>
    <rect x="601" y="364" width="12" height="16" rx="2"/>
  </g>
  <text x="500" y="250" text-anchor="middle" font-size="13" fill="#E8E8E8">a link each way, hop limit 1</text>
  <text x="500" y="298" text-anchor="middle" font-size="13" fill="#9AA0A6">put again at every look, every 5 s</text>
  <text x="500" y="336" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#E8E8E8">~/.comando-fabric.json</text>
  <text x="500" y="354" text-anchor="middle" font-size="13" fill="#9AA0A6">each instance's port, pid and start</text>

  <!-- legend -->
  <rect x="40" y="606" width="14" height="14" rx="3" fill="#6FAEE8"/>
  <text x="62" y="618" font-size="13" fill="#9AA0A6">the node, in its instance's JVM</text>
  <rect x="270" y="606" width="14" height="14" rx="3" fill="#AEB6C1"/>
  <text x="292" y="618" font-size="13" fill="#9AA0A6">the instance's client of its own node</text>
  <rect x="530" y="606" width="14" height="14" rx="3" fill="#E7C55A"/>
  <text x="552" y="618" font-size="13" fill="#9AA0A6">a link, and its log until the peer acknowledges</text>
  <text x="40" y="650" font-size="13" fill="#9AA0A6">comando · docs/modules/app.md</text>
</svg>
