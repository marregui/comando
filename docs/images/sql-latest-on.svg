<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="462" viewBox="0 0 1100 462" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>How LATEST ON works: one time line per city, and the newest reading of each line is the answer</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#E7C55A" stroke-width="1.4"/></marker></defs>
<rect width="1100" height="462" fill="#161616"/>
<text x="40" y="44" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">CDB SQL · LATEST ON</text>
<text x="40" y="76" font-size="22" font-weight="300" fill="#E8E8E8">LATEST ON keeps the newest row of each group.</text>

<rect x="40" y="98" width="1020" height="40" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="56" y="123" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace"><tspan fill="#E7C55A">SELECT</tspan> * <tspan fill="#E7C55A">FROM</tspan> weather <tspan fill="#E7C55A">LATEST ON</tspan> ts <tspan fill="#E7C55A">PARTITION BY</tspan> city</text>

<g font-size="13" fill="#9AA0A6" letter-spacing="2">
<text x="40" y="168">ONE TIME LINE PER CITY</text><text x="800" y="168">THE ANSWER · 3 ROWS</text>
</g>
<g stroke="#3A3A3A" stroke-width="1"><path d="M150,206 H726"/><path d="M150,256 H726"/><path d="M150,306 H726"/></g>
<g stroke="#2A2A2A" stroke-width="1"><path d="M150,184 V332"/><path d="M294,184 V332"/><path d="M438,184 V332"/><path d="M582,184 V332"/><path d="M726,184 V332"/></g>
<g font-size="14">
<text x="40" y="211" fill="#6FAEE8">Madrid</text><text x="40" y="261" fill="#6CC69A">Oslo</text><text x="40" y="311" fill="#D98E5F">Lima</text>
</g>
<g fill="#6FAEE8"><circle cx="222" cy="206" r="5.5"/><circle cx="294" cy="206" r="5.5"/><circle cx="366" cy="206" r="5.5"/><circle cx="510" cy="206" r="5.5"/><circle cx="582" cy="206" r="5.5"/></g>
<g fill="#6CC69A"><circle cx="222" cy="256" r="5.5"/><circle cx="294" cy="256" r="5.5"/><circle cx="366" cy="256" r="5.5"/><circle cx="510" cy="256" r="5.5"/><circle cx="582" cy="256" r="5.5"/></g>
<g fill="#D98E5F"><circle cx="300" cy="306" r="5.5"/><circle cx="582" cy="306" r="5.5"/></g>
<g fill="none" stroke="#E7C55A" stroke-width="2"><circle cx="582" cy="206" r="11"/><circle cx="582" cy="256" r="11"/><circle cx="582" cy="306" r="11"/></g>
<g fill="none" stroke="#E7C55A" stroke-width="1.2" marker-end="url(#a)"><path d="M595,206 H794"/><path d="M595,256 H794"/><path d="M595,306 H794"/></g>

<g font-size="13" fill="#9AA0A6" text-anchor="middle" font-family="Menlo, Consolas, monospace">
<text x="150" y="350">00:00</text><text x="294" y="350">12:00</text><text x="438" y="350">00:00</text><text x="582" y="350">12:00</text><text x="726" y="350">00:00</text>
</g>
<g font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace"><text x="150" y="370">2026-06-01</text><text x="438" y="370">2026-06-02</text></g>

<g fill="#E7C55A" fill-opacity="0.13" stroke="#E7C55A" stroke-width="1.2">
<rect x="800" y="188" width="260" height="36" rx="6"/><rect x="800" y="238" width="260" height="36" rx="6"/><rect x="800" y="288" width="260" height="36" rx="6"/>
</g>
<g font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">
<text x="812" y="211">06-02 12:00</text><text x="916" y="211">Madrid</text><text x="990" y="211">31.0</text>
<text x="812" y="261">06-02 12:00</text><text x="916" y="261">Oslo</text><text x="990" y="261" fill="#9AA0A6">NULL</text>
<text x="812" y="311">06-02 12:00</text><text x="916" y="311">Lima</text><text x="990" y="311">18.5</text>
</g>

<text x="40" y="398" font-size="14" fill="#E8E8E8">LATEST ON picks by time alone, so Oslo answers with its NULL reading. WHERE runs first:</text>
<text x="40" y="418" font-size="14" fill="#E8E8E8">add <tspan font-family="Menlo, Consolas, monospace" font-size="13">WHERE temp IS NOT NULL</tspan> and Oslo answers with 06-02 06:00, 8.0.</text>
<text x="40" y="446" font-size="13" fill="#9AA0A6" letter-spacing="1">comando · docs/cdb-sql</text>
</svg>
