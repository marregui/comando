<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The files of one cdb table and the format of a write-ahead log frame</title>
<rect width="1100" height="600" fill="#161616"/>
<text x="40" y="44" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">MODULE · CDB · THE FILES</text>
<text x="40" y="76" font-size="22" font-weight="300" fill="#E8E8E8">One folder per table, one file per column</text>

<text x="40" y="116" font-size="13" fill="#9AA0A6" letter-spacing="2">THE TABLE'S FOLDER</text>
<rect x="40" y="128" width="500" height="408" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<g font-family="Menlo, Consolas, monospace" font-size="14">
<text x="60" y="160" fill="#6FAEE8">&lt;root&gt;/trades/</text>
<text x="84" y="192" fill="#E8E8E8">_meta</text>
<text x="84" y="224" fill="#E7C55A">_txn</text>
<text x="84" y="256" fill="#E7C55A">_wal</text>
<text x="84" y="288" fill="#E8E8E8">symbol.sym</text>
<text x="84" y="320" fill="#6FAEE8">2026-11-17.42/</text>
<text x="108" y="352" fill="#E8E8E8">ts.d</text>
<text x="108" y="384" fill="#E8E8E8">price.d</text>
<text x="108" y="416" fill="#E8E8E8">symbol.d</text>
<text x="108" y="448" fill="#E8E8E8">note.i</text>
<text x="108" y="480" fill="#E8E8E8">note.d</text>
<text x="84" y="512" fill="#6FAEE8">2026-11-18.57/</text>
</g>
<g font-size="13" fill="#9AA0A6">
<text x="240" y="192">the table's definition</text>
<text x="240" y="224">the last checkpoint: folders and row counts</text>
<text x="240" y="256">commits since that checkpoint</text>
<text x="240" y="288">the dictionary of the symbol column</text>
<text x="240" y="320">a partition, written at txn 42</text>
<text x="240" y="352">8 bytes per row</text>
<text x="240" y="384">8 bytes per row</text>
<text x="240" y="416">a 4-byte dictionary key per row</text>
<text x="240" y="448">8-byte end offsets, one per row</text>
<text x="240" y="480">the text itself, UTF-8</text>
<text x="240" y="512">the next day</text>
</g>
<line x1="66" y1="170" x2="66" y2="507" stroke="#3A3A3A" stroke-width="1"/>
<line x1="90" y1="330" x2="90" y2="475" stroke="#3A3A3A" stroke-width="1"/>

<text x="580" y="116" font-size="13" fill="#9AA0A6" letter-spacing="2">THE LOG FILE, _wal</text>
<rect x="580" y="128" width="480" height="60" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<line x1="700" y1="128" x2="700" y2="188" stroke="#E7C55A" stroke-width="1"/>
<line x1="820" y1="128" x2="820" y2="188" stroke="#E7C55A" stroke-width="1"/>
<text x="640" y="154" font-size="13" fill="#E8E8E8" text-anchor="middle">magic</text>
<text x="640" y="174" font-size="13" fill="#9AA0A6" text-anchor="middle" font-family="Menlo, Consolas, monospace">CWAL</text>
<text x="760" y="154" font-size="13" fill="#E8E8E8" text-anchor="middle">version</text>
<text x="760" y="174" font-size="13" fill="#9AA0A6" text-anchor="middle">4 bytes</text>
<text x="940" y="154" font-size="13" fill="#E8E8E8" text-anchor="middle">salt</text>
<text x="940" y="174" font-size="13" fill="#9AA0A6" text-anchor="middle">8 bytes, new at every cut</text>
<text x="580" y="210" font-size="13" fill="#9AA0A6">the header, 16 bytes</text>

<rect x="580" y="236" width="480" height="60" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<line x1="700" y1="236" x2="700" y2="296" stroke="#E7C55A" stroke-width="1"/>
<line x1="820" y1="236" x2="820" y2="296" stroke="#E7C55A" stroke-width="1"/>
<text x="640" y="262" font-size="13" fill="#E8E8E8" text-anchor="middle">length</text>
<text x="640" y="282" font-size="13" fill="#9AA0A6" text-anchor="middle">4 bytes</text>
<text x="760" y="262" font-size="13" fill="#E8E8E8" text-anchor="middle">CRC32C</text>
<text x="760" y="282" font-size="13" fill="#9AA0A6" text-anchor="middle">of salt + body</text>
<text x="940" y="262" font-size="13" fill="#E8E8E8" text-anchor="middle">body</text>
<text x="940" y="282" font-size="13" fill="#9AA0A6" text-anchor="middle">txn, flags, rows by column</text>
<text x="580" y="318" font-size="13" fill="#9AA0A6">one frame per commit, appended</text>

<rect x="580" y="344" width="480" height="60" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1" stroke-dasharray="5 4"/>
<text x="820" y="380" font-size="13" fill="#9AA0A6" text-anchor="middle">a torn frame: its CRC does not match, open cuts it</text>

<text x="580" y="446" font-size="13" fill="#9AA0A6" letter-spacing="2">WHY A SALT</text>
<text x="580" y="472" font-size="13" fill="#E8E8E8">After a checkpoint the log is cut back to its header.</text>
<text x="580" y="494" font-size="13" fill="#E8E8E8">Old frames may still sit in the reused blocks of the file.</text>
<text x="580" y="516" font-size="13" fill="#E8E8E8">Their CRC carries the old salt, so replay never takes them.</text>

<rect x="760" y="564" width="14" height="14" rx="3" fill="#E7C55A"/><text x="780" y="576" font-size="13" fill="#9AA0A6">recovery reads these</text>
<rect x="940" y="564" width="14" height="14" rx="3" fill="#6FAEE8"/><text x="960" y="576" font-size="13" fill="#9AA0A6">folders</text>
<text x="40" y="576" font-size="13" fill="#9AA0A6">comando · docs/modules/cdb</text>
</svg>
