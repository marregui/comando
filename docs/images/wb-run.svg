<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>How a block of text becomes SQL for the connection or a prompt for the session</title>
<defs>
<marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#6FAEE8"/></marker>
<marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#D98E5F"/></marker>
<marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#9AA0A6"/></marker>
</defs>
<rect width="1100" height="580" fill="#161616"/>
<text x="40" y="42" font-size="13" font-weight="600" fill="#E7C55A" letter-spacing="3">WORKBENCH · RUNNING TEXT</text>
<text x="40" y="74" font-size="22" font-weight="300" fill="#E8E8E8">One editor, two targets: each block goes where its text belongs</text>

<!-- editor -->
<text x="40" y="112" font-size="13" fill="#9AA0A6" letter-spacing="2">THE PANEL'S EDITOR</text>
<rect x="40" y="124" width="340" height="276" rx="8" fill="#1E1E1E" stroke="#3A3A3A"/>
<line x1="76" y1="124" x2="76" y2="400" stroke="#2C2C2C"/>
<g font-family="Menlo, Consolas, monospace" font-size="13" fill="#E8E8E8">
<rect x="50" y="143" width="16" height="16" rx="3" fill="none" stroke="#6FAEE8" stroke-width="1.4"/>
<rect x="84" y="138" width="286" height="46" rx="4" fill="#232a33"/>
<text x="92" y="156"><tspan fill="#E7C55A">select</tspan> count()</text>
<text x="92" y="176"><tspan fill="#E7C55A">from</tspan> trades;</text>
<circle cx="58" cy="227" r="8" fill="none" stroke="#D98E5F" stroke-width="1.4"/>
<text x="92" y="232">Why is the count lower</text>
<text x="92" y="252">than yesterday?</text>
<rect x="50" y="295" width="16" height="16" rx="3" fill="none" stroke="#6FAEE8" stroke-width="1.4"/>
<text x="92" y="308" fill="#9AA0A6">-- @sql</text>
<text x="92" y="328">analyze trades;</text>
<text x="92" y="376" fill="#9AA0A6">-- only a comment</text>
</g>
<text x="40" y="424" font-size="13" fill="#9AA0A6">A block is a run of lines between blank lines.</text>
<text x="40" y="444" font-size="13" fill="#9AA0A6">The gutter shows each block's target before it runs.</text>

<!-- classifier -->
<line x1="380" y1="262" x2="416" y2="262" stroke="#9AA0A6" marker-end="url(#ag)"/>
<rect x="420" y="124" width="320" height="276" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.4"/>
<text x="440" y="152" font-size="13" font-weight="600" fill="#E7C55A" letter-spacing="2">CLASSIFIER · FIRST FIT WINS</text>
<g font-size="13">
<text x="440" y="186" fill="#E7C55A">1</text>
<text x="462" y="186" fill="#E8E8E8">A first line <tspan font-family="Menlo, Consolas, monospace">-- @sql</tspan> or <tspan font-family="Menlo, Consolas, monospace">-- @claude</tspan></text>
<text x="462" y="204" fill="#9AA0A6">decides, and is removed.</text>
<text x="440" y="234" fill="#E7C55A">2</text>
<text x="462" y="234" fill="#E8E8E8">A leading <tspan font-family="Menlo, Consolas, monospace">/</tspan> and a letter</text>
<text x="462" y="252" fill="#9AA0A6">is a Claude command: a prompt.</text>
<text x="440" y="282" fill="#E7C55A">3</text>
<text x="462" y="282" fill="#E8E8E8">Only comments: nothing to run.</text>
<text x="440" y="312" fill="#E7C55A">4</text>
<text x="462" y="312" fill="#E8E8E8">An SQL keyword in its shape,</text>
<text x="462" y="330" fill="#9AA0A6">no plain English, no closing ? or . : SQL.</text>
<text x="440" y="360" fill="#E7C55A">5</text>
<text x="462" y="360" fill="#E8E8E8">Anything else is a prompt.</text>
</g>

<!-- targets -->
<path d="M740 200 L816 180" fill="none" stroke="#6FAEE8" stroke-width="1.4" marker-end="url(#ab)"/>
<text x="756" y="176" font-size="13" fill="#6FAEE8">SQL</text>
<path d="M740 324 L816 344" fill="none" stroke="#D98E5F" stroke-width="1.4" marker-end="url(#ao)"/>
<text x="748" y="358" font-size="13" fill="#D98E5F">prompt</text>
<rect x="820" y="124" width="240" height="118" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.4"/>
<text x="840" y="152" font-size="13" font-weight="600" fill="#6FAEE8" letter-spacing="2">CONNECTION</text>
<text x="840" y="180" font-size="14" fill="#E8E8E8">The panel's database.</text>
<text x="840" y="202" font-size="13" fill="#9AA0A6">Opens when it is closed.</text>
<text x="840" y="224" font-size="13" fill="#9AA0A6">Rows fill the Results tab.</text>
<rect x="820" y="282" width="240" height="118" rx="8" fill="#1E1E1E" stroke="#D98E5F" stroke-width="1.4"/>
<text x="840" y="310" font-size="13" font-weight="600" fill="#D98E5F" letter-spacing="2">SESSION</text>
<text x="840" y="338" font-size="14" fill="#E8E8E8">The panel's Claude Code.</text>
<text x="840" y="360" font-size="13" fill="#9AA0A6">Starts when it is stopped.</text>
<text x="840" y="382" font-size="13" fill="#9AA0A6">The turn streams into Session.</text>

<!-- keys -->
<line x1="40" y1="470" x2="1060" y2="470" stroke="#2C2C2C"/>
<g font-size="13">
<g transform="translate(40,490)"><rect width="52" height="28" rx="5" fill="#1E1E1E" stroke="#E7C55A"/><text x="26" y="19" text-anchor="middle" fill="#E7C55A">⌘⏎</text><text x="62" y="12" fill="#E8E8E8">Run</text><text x="62" y="29" fill="#9AA0A6">classified</text></g>
<g transform="translate(220,490)"><rect width="62" height="28" rx="5" fill="#1E1E1E" stroke="#D98E5F"/><text x="31" y="19" text-anchor="middle" fill="#D98E5F">⌘⇧⏎</text><text x="72" y="12" fill="#E8E8E8">Send to Claude</text><text x="72" y="29" fill="#9AA0A6">always a prompt</text></g>
<g transform="translate(440,490)"><rect width="52" height="28" rx="5" fill="#1E1E1E" stroke="#6FAEE8"/><text x="26" y="19" text-anchor="middle" fill="#6FAEE8">⌥⏎</text><text x="62" y="12" fill="#E8E8E8">Run as SQL</text><text x="62" y="29" fill="#9AA0A6">always SQL</text></g>
<g transform="translate(630,490)"><rect width="52" height="28" rx="5" fill="#1E1E1E" stroke="#9AA0A6"/><text x="26" y="19" text-anchor="middle" fill="#E8E8E8">⌃⏎</text><text x="62" y="12" fill="#E8E8E8">Run in the terminal</text><text x="62" y="29" fill="#9AA0A6">selection or line</text></g>
<g transform="translate(860,490)"><rect width="52" height="28" rx="5" fill="#1E1E1E" stroke="#9AA0A6"/><text x="26" y="19" text-anchor="middle" fill="#E8E8E8">⌘.</text><text x="62" y="12" fill="#E8E8E8">Stop</text><text x="62" y="29" fill="#9AA0A6">the run, else the turn</text></g>
</g>

<g font-size="13" fill="#9AA0A6">
<rect x="40" y="549" width="12" height="12" fill="#6FAEE8"/><text x="58" y="560">database</text>
<rect x="140" y="549" width="12" height="12" fill="#D98E5F"/><text x="158" y="560">Claude Code session</text>
<rect x="310" y="549" width="12" height="12" fill="#E7C55A"/><text x="328" y="560">the decision</text>
<text x="1060" y="560" text-anchor="end">comando · docs/workbench</text>
</g>
</svg>
