<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The comando window and its eight regions</title>
<rect width="1200" height="880" fill="#161616"/>
<text x="40" y="42" font-size="13" font-weight="600" fill="#E7C55A" letter-spacing="3">WORKBENCH · THE WINDOW</text>
<text x="40" y="74" font-size="22" font-weight="300" fill="#E8E8E8">One panel, bound to a connection and a session, and what surrounds it</text>

<!-- the window -->
<rect x="40" y="100" width="1120" height="572" rx="10" fill="#1B1B1B" stroke="#3A3A3A" stroke-width="1.2"/>
<circle cx="60" cy="112" r="4.5" fill="none" stroke="#5A5A5A"/>
<circle cx="76" cy="112" r="4.5" fill="none" stroke="#5A5A5A"/>
<circle cx="92" cy="112" r="4.5" fill="none" stroke="#5A5A5A"/>
<text x="600" y="117" text-anchor="middle" font-size="13" fill="#9AA0A6">comando</text>
<g stroke="#3A3A3A" stroke-width="1">
<line x1="40" y1="124" x2="1160" y2="124"/>
<line x1="260" y1="124" x2="260" y2="640"/>
<line x1="260" y1="158" x2="1160" y2="158"/>
<line x1="260" y1="190" x2="1160" y2="190"/>
<line x1="850" y1="190" x2="850" y2="400"/>
<line x1="260" y1="400" x2="1160" y2="400"/>
<line x1="260" y1="432" x2="1160" y2="432"/>
<line x1="260" y1="606" x2="1160" y2="606"/>
<line x1="40" y1="640" x2="1160" y2="640"/>
<line x1="296" y1="190" x2="296" y2="400" stroke="#2A2A2A"/>
</g>

<!-- 1 sidebar -->
<g font-size="13" text-anchor="middle">
<rect x="52" y="134" width="24" height="22" rx="4" fill="none" stroke="#E7C55A"/><text x="64" y="150" fill="#E7C55A">Se</text>
<rect x="81" y="134" width="24" height="22" rx="4" fill="none" stroke="#4A4A4A"/><text x="93" y="150" fill="#9AA0A6">Co</text>
<rect x="110" y="134" width="24" height="22" rx="4" fill="none" stroke="#4A4A4A"/><text x="122" y="150" fill="#9AA0A6">Ki</text>
<rect x="139" y="134" width="24" height="22" rx="4" fill="none" stroke="#4A4A4A"/><text x="151" y="150" fill="#9AA0A6">Br</text>
<rect x="168" y="134" width="24" height="22" rx="4" fill="none" stroke="#4A4A4A"/><text x="180" y="150" fill="#9AA0A6">Sc</text>
<rect x="197" y="134" width="24" height="22" rx="4" fill="none" stroke="#4A4A4A"/><text x="209" y="150" fill="#9AA0A6">Lo</text>
<rect x="226" y="134" width="24" height="22" rx="4" fill="none" stroke="#4A4A4A"/><text x="238" y="150" fill="#9AA0A6">In</text>
</g>
<line x1="52" y1="160" x2="76" y2="160" stroke="#E7C55A" stroke-width="1.6"/>
<text x="56" y="188" font-size="13" fill="#9AA0A6" letter-spacing="1.5">WORKING</text>
<rect x="46" y="198" width="208" height="26" rx="4" fill="#2A2618"/>
<line x1="46" y1="198" x2="46" y2="224" stroke="#E7C55A" stroke-width="2"/>
<circle cx="64" cy="211" r="6" fill="none" stroke="#D98E5F" stroke-width="1.6"/>
<text x="80" y="216" font-size="14" fill="#E8E8E8">tutor</text>
<text x="56" y="252" font-size="13" fill="#9AA0A6" letter-spacing="1.5">IDLE</text>
<circle cx="64" cy="273" r="6" fill="none" stroke="#6A6A6A" stroke-width="1.6"/>
<text x="80" y="278" font-size="14" fill="#C8C8C8">kit</text>
<circle cx="64" cy="301" r="6" fill="none" stroke="#6A6A6A" stroke-width="1.6"/>
<text x="80" y="306" font-size="14" fill="#C8C8C8">review</text>
<text x="56" y="350" font-size="13" fill="#9AA0A6" letter-spacing="1.5">WITHOUT A SESSION</text>
<text x="58" y="376" font-size="13" fill="#C8C8C8">● scratch · local cdb</text>
<circle cx="150" cy="520" r="13" fill="#161616" stroke="#E7C55A" stroke-width="1.4"/><text x="150" y="525" text-anchor="middle" font-size="14" font-weight="600" fill="#E7C55A">1</text>

<!-- 2 panel tabs, 3 corner -->
<text x="278" y="146" font-size="14" fill="#9AA0A6">scratch</text>
<circle cx="356" cy="141" r="5" fill="none" stroke="#D98E5F" stroke-width="1.6"/>
<text x="368" y="146" font-size="14" fill="#E8E8E8">tutor</text>
<line x1="346" y1="157" x2="408" y2="157" stroke="#E7C55A" stroke-width="1.8"/>
<text x="430" y="146" font-size="14" fill="#9AA0A6">notes.md</text>
<circle cx="540" cy="141" r="13" fill="#161616" stroke="#E7C55A" stroke-width="1.4"/><text x="540" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#E7C55A">2</text>
<g font-size="13" text-anchor="middle" fill="#6FAEE8">
<rect x="884" y="131" width="50" height="21" rx="4" fill="none" stroke="#6FAEE8"/><text x="909" y="146">plots</text>
<rect x="940" y="131" width="42" height="21" rx="4" fill="none" stroke="#6FAEE8"/><text x="961" y="146">cdb</text>
<rect x="988" y="131" width="48" height="21" rx="4" fill="none" stroke="#6FAEE8"/><text x="1012" y="146">Edge</text>
</g>
<rect x="1046" y="131" width="21" height="21" rx="3" fill="#121212" stroke="#E7C55A"/>
<path d="M1067 131 L1067 152 L1046 152 Z" fill="#E7C55A"/>
<text x="1085" y="148" text-anchor="middle" font-size="18" fill="#E8E8E8">+</text>
<circle cx="1132" cy="141" r="13" fill="#161616" stroke="#E7C55A" stroke-width="1.4"/><text x="1132" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#E7C55A">3</text>

<!-- 4 header and editor -->
<circle cx="560" cy="174" r="5" fill="#6FAEE8"/>
<text x="572" y="179" font-size="13" fill="#6FAEE8">local cdb</text>
<text x="660" y="179" font-size="13" fill="#9AA0A6">Outline<tspan dx="12">Preview</tspan><tspan dx="12">Run</tspan><tspan dx="12">Stop</tspan><tspan dx="12">Locate</tspan><tspan dx="12">Clear</tspan></text>
<g font-family="Menlo, Consolas, monospace" font-size="13">
<rect x="270" y="205" width="16" height="16" rx="3" fill="none" stroke="#6FAEE8"/>
<text x="308" y="218" fill="#E8E8E8"><tspan fill="#E7C55A">select</tspan> sym, count(), avg(price)</text>
<text x="324" y="238" fill="#E8E8E8"><tspan fill="#E7C55A">from</tspan> trades;</text>
<circle cx="278" cy="273" r="8" fill="none" stroke="#D98E5F" stroke-width="1.4"/>
<text x="308" y="278" fill="#E8E8E8">Which symbol has the highest average?</text>
<text x="308" y="298" fill="#E8E8E8">Plot it per hour.</text>
<rect x="270" y="325" width="16" height="16" rx="3" fill="none" stroke="#6FAEE8"/>
<text x="308" y="338" fill="#E8E8E8"><tspan fill="#E7C55A">select</tspan> * <tspan fill="#E7C55A">from</tspan> trades <tspan fill="#E7C55A">limit</tspan> 10;</text>
</g>
<circle cx="800" cy="360" r="13" fill="#161616" stroke="#E7C55A" stroke-width="1.4"/><text x="800" y="365" text-anchor="middle" font-size="14" font-weight="600" fill="#E7C55A">4</text>

<!-- 5 side pane -->
<text x="868" y="216" font-size="14" fill="#E8E8E8">schema · local cdb</text>
<line x1="866" y1="226" x2="996" y2="226" stroke="#E7C55A" stroke-width="1.4"/>
<g font-family="Menlo, Consolas, monospace" font-size="13" fill="#C8C8C8">
<text x="870" y="254">▾ trades</text>
<text x="894" y="276">ts<tspan x="950" fill="#9AA0A6">TIMESTAMP</tspan></text>
<text x="894" y="298">sym<tspan x="950" fill="#9AA0A6">SYMBOL</tspan></text>
<text x="894" y="320">price<tspan x="950" fill="#9AA0A6">DOUBLE</tspan></text>
<text x="870" y="342">▸ quotes</text>
</g>
<circle cx="1120" cy="360" r="13" fill="#161616" stroke="#E7C55A" stroke-width="1.4"/><text x="1120" y="365" text-anchor="middle" font-size="14" font-weight="600" fill="#E7C55A">5</text>

<!-- 6 lower panel -->
<g font-size="14">
<text x="278" y="421" fill="#E8E8E8">Session</text>
<text x="352" y="421" fill="#9AA0A6">Approvals</text>
<text x="440" y="421" fill="#9AA0A6">Terminal</text>
<text x="518" y="421" fill="#9AA0A6">Results</text>
<text x="590" y="421" fill="#9AA0A6">plot · tutor</text>
</g>
<line x1="276" y1="431" x2="328" y2="431" stroke="#E7C55A" stroke-width="1.8"/>
<rect x="620" y="446" width="300" height="30" rx="9" fill="#2A2618" stroke="#4A4326"/>
<text x="634" y="466" font-size="13" fill="#E8E8E8">Which symbol has the highest average?</text>
<g font-family="Menlo, Consolas, monospace" font-size="13">
<text x="280" y="504" fill="#6CC69A">✓ <tspan fill="#C8C8C8">db_run_sql</tspan><tspan fill="#9AA0A6" dx="14">select sym, avg(price) … sample by 1h</tspan></text>
<text x="280" y="528" fill="#6CC69A">✓ <tspan fill="#C8C8C8">ui_plot</tspan><tspan fill="#9AA0A6" dx="14">hourly average per symbol</tspan></text>
</g>
<line x1="278" y1="548" x2="278" y2="580" stroke="#D98E5F" stroke-width="2"/>
<text x="290" y="569" font-size="14" fill="#E8E8E8">NVDA has the highest average. The plot is in the tab beside Results.</text>
<circle cx="1120" cy="520" r="13" fill="#161616" stroke="#E7C55A" stroke-width="1.4"/><text x="1120" y="525" text-anchor="middle" font-size="14" font-weight="600" fill="#E7C55A">6</text>

<!-- 7 session bar -->
<circle cx="282" cy="623" r="5" fill="none" stroke="#D98E5F" stroke-width="1.6"/>
<text x="294" y="628" font-size="13" fill="#E8E8E8">tutor ⎇ main</text>
<text x="400" y="628" font-size="13" fill="#9AA0A6">16:02 UTC ▸ 12 min 05 s ▸ due 16:30 UTC ▸ 60%</text>
<text x="1096" y="628" text-anchor="end" font-size="13" fill="#9AA0A6">haiku ▾<tspan dx="12">medium ▾</tspan><tspan dx="12">ctx 41k (4%)</tspan><tspan dx="12">Reflect · Compact · Clear</tspan></text>
<circle cx="1132" cy="623" r="13" fill="#161616" stroke="#E7C55A" stroke-width="1.4"/><text x="1132" y="628" text-anchor="middle" font-size="14" font-weight="600" fill="#E7C55A">7</text>

<!-- 8 status bar -->
<text x="56" y="661" font-size="13" fill="#9AA0A6">Copied the view's content</text>
<text x="1096" y="661" text-anchor="end" font-size="13" fill="#9AA0A6">Claude Session 12% (resets 17:19 UTC) · Week 30%<tspan dx="18">1 session working</tspan><tspan dx="18">11:24:05 UTC</tspan></text>
<circle cx="1132" cy="656" r="13" fill="#161616" stroke="#E7C55A" stroke-width="1.4"/><text x="1132" y="661" text-anchor="middle" font-size="14" font-weight="600" fill="#E7C55A">8</text>

<!-- key -->
<g font-size="13">
<g transform="translate(40,712)"><circle cx="13" cy="0" r="13" fill="none" stroke="#E7C55A" stroke-width="1.4"/><text x="13" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#E7C55A">1</text>
<text x="36" y="5" font-weight="600" fill="#E7C55A" letter-spacing="2">SIDEBAR</text>
<text x="36" y="26" fill="#9AA0A6">Seven tabs of resources. A row is</text>
<text x="36" y="44" fill="#9AA0A6">an icon and a name. ⌘B hides it.</text></g>
<g transform="translate(320,712)"><circle cx="13" cy="0" r="13" fill="none" stroke="#E7C55A" stroke-width="1.4"/><text x="13" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#E7C55A">2</text>
<text x="36" y="5" font-weight="600" fill="#E7C55A" letter-spacing="2">PANEL TABS</text>
<text x="36" y="26" fill="#9AA0A6">One tab per panel. ⌘T adds one,</text>
<text x="36" y="44" fill="#9AA0A6">⌘1–9 go to one, ⌘W closes it.</text></g>
<g transform="translate(600,712)"><circle cx="13" cy="0" r="13" fill="none" stroke="#E7C55A" stroke-width="1.4"/><text x="13" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#E7C55A">3</text>
<text x="36" y="5" font-weight="600" fill="#E7C55A" letter-spacing="2">CORNER</text>
<text x="36" y="26" fill="#9AA0A6">Stop refreshing plots, the machine's</text>
<text x="36" y="44" fill="#9AA0A6">cdb, the Edge, the theme, New panel.</text></g>
<g transform="translate(880,712)"><circle cx="13" cy="0" r="13" fill="none" stroke="#E7C55A" stroke-width="1.4"/><text x="13" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#E7C55A">4</text>
<text x="36" y="5" font-weight="600" fill="#E7C55A" letter-spacing="2">HEADER AND EDITOR</text>
<text x="36" y="26" fill="#9AA0A6">The panel's connection and tools.</text>
<text x="36" y="44" fill="#9AA0A6">SQL and prompts in one text.</text></g>
<g transform="translate(40,784)"><circle cx="13" cy="0" r="13" fill="none" stroke="#E7C55A" stroke-width="1.4"/><text x="13" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#E7C55A">5</text>
<text x="36" y="5" font-weight="600" fill="#E7C55A" letter-spacing="2">SIDE PANE</text>
<text x="36" y="26" fill="#9AA0A6">Views beside the editor: schema,</text>
<text x="36" y="44" fill="#9AA0A6">changes, search. ⌘\ hides it.</text></g>
<g transform="translate(320,784)"><circle cx="13" cy="0" r="13" fill="none" stroke="#E7C55A" stroke-width="1.4"/><text x="13" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#E7C55A">6</text>
<text x="36" y="5" font-weight="600" fill="#E7C55A" letter-spacing="2">LOWER PANEL</text>
<text x="36" y="26" fill="#9AA0A6">Session, Approvals, Terminal,</text>
<text x="36" y="44" fill="#9AA0A6">Results (⌃1–⌃4), then views.</text></g>
<g transform="translate(600,784)"><circle cx="13" cy="0" r="13" fill="none" stroke="#E7C55A" stroke-width="1.4"/><text x="13" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#E7C55A">7</text>
<text x="36" y="5" font-weight="600" fill="#E7C55A" letter-spacing="2">SESSION BAR</text>
<text x="36" y="26" fill="#9AA0A6">The focused panel's session: state,</text>
<text x="36" y="44" fill="#9AA0A6">ETA, model, effort, context.</text></g>
<g transform="translate(880,784)"><circle cx="13" cy="0" r="13" fill="none" stroke="#E7C55A" stroke-width="1.4"/><text x="13" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#E7C55A">8</text>
<text x="36" y="5" font-weight="600" fill="#E7C55A" letter-spacing="2">STATUS BAR</text>
<text x="36" y="26" fill="#9AA0A6">The notice, plan usage, who works,</text>
<text x="36" y="44" fill="#9AA0A6">the UTC clock.</text></g>
</g>

<!-- legend -->
<g font-size="13" fill="#9AA0A6">
<rect x="40" y="850" width="12" height="12" fill="#6FAEE8"/><text x="58" y="861">comando and the database</text>
<rect x="250" y="850" width="12" height="12" fill="#D98E5F"/><text x="268" y="861">Claude Code session</text>
<rect x="420" y="850" width="12" height="12" fill="#E7C55A"/><text x="438" y="861">focus and region numbers</text>
<text x="640" y="861">A drawn mock-up, not a screenshot.</text>
<text x="1160" y="861" text-anchor="end">comando · docs/workbench</text>
</g>
</svg>
