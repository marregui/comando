<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The same core, in the app with real adapters and in a test with testkit's fakes</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></radialGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#9AA0A6" stroke-width="1.4"/></marker>
</defs>
<rect width="1200" height="620" fill="url(#bg)"/>
<text x="48" y="48" font-size="13" fill="#E7C55A" letter-spacing="3">MODULE · TESTKIT</text>
<text x="48" y="82" font-size="24" font-weight="300" fill="#E8E8E8">The same rules, with the outside world swapped for fakes</text>

<text x="48" y="130" font-size="13" fill="#9AA0A6" letter-spacing="2">IN THE APP</text>
<line x1="48" y1="142" x2="560" y2="142" stroke="#3A3A3A" stroke-width="1"/>
<rect x="48" y="190" width="190" height="230" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<text x="68" y="226" font-size="20" font-weight="300" fill="#E7C55A">core</text>
<text x="68" y="256" font-size="14" fill="#9AA0A6">the loop</text>
<text x="68" y="278" font-size="14" fill="#9AA0A6">the reducer</text>
<text x="68" y="300" font-size="14" fill="#9AA0A6">the ports</text>
<g fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2">
<rect x="330" y="166" width="230" height="38" rx="6"/>
<rect x="330" y="214" width="230" height="38" rx="6"/>
<rect x="330" y="262" width="230" height="38" rx="6"/>
<rect x="330" y="310" width="230" height="38" rx="6"/>
<rect x="330" y="358" width="230" height="38" rx="6"/>
<rect x="330" y="406" width="230" height="38" rx="6"/>
</g>
<g font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">
<text x="346" y="190">DbRouter</text>
<text x="346" y="238">ClaudeAdapter</text>
<text x="346" y="286">McpServer</text>
<text x="346" y="334">ToolsAdapter</text>
<text x="346" y="382">ComandoUi</text>
<text x="346" y="430">Store</text>
</g>
<g fill="none" stroke="#9AA0A6" stroke-width="1" marker-end="url(#a)">
<path d="M238,305 L326,187"/>
<path d="M238,305 L326,234"/>
<path d="M238,305 L326,282"/>
<path d="M238,305 L326,328"/>
<path d="M238,305 L326,375"/>
<path d="M238,305 L326,422"/>
</g>
<text x="48" y="482" font-size="14" fill="#E8E8E8">Real adapters reach real things:</text>
<text x="48" y="504" font-size="14" fill="#9AA0A6">databases, child processes, a window, files on disk.</text>

<text x="640" y="130" font-size="13" fill="#9AA0A6" letter-spacing="2">IN A TEST</text>
<line x1="640" y1="142" x2="1152" y2="142" stroke="#3A3A3A" stroke-width="1"/>
<rect x="640" y="190" width="190" height="230" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<text x="660" y="226" font-size="20" font-weight="300" fill="#E7C55A">core</text>
<text x="660" y="256" font-size="14" fill="#9AA0A6">the same code,</text>
<text x="660" y="278" font-size="14" fill="#9AA0A6">not one line changed</text>
<rect x="922" y="166" width="230" height="150" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="938" y="194" font-size="13" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">RecordingPorts</text>
<text x="938" y="222" font-size="14" fill="#E8E8E8">all six effect ports in one</text>
<text x="938" y="246" font-size="14" fill="#9AA0A6">does nothing; writes down</text>
<text x="938" y="266" font-size="14" fill="#9AA0A6">each call as one line</text>
<text x="938" y="298" font-size="13" fill="#9AA0A6" font-family="Menlo, Consolas, monospace">calls()</text>
<rect x="922" y="336" width="230" height="108" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="938" y="364" font-size="13" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">FakeClock</text>
<text x="938" y="392" font-size="14" fill="#E8E8E8">time stands still until</text>
<text x="938" y="412" font-size="14" fill="#E8E8E8">the test moves it</text>
<text x="938" y="434" font-size="13" fill="#9AA0A6" font-family="Menlo, Consolas, monospace">advance(millis)</text>
<g fill="none" stroke="#9AA0A6" stroke-width="1" marker-end="url(#a)">
<path d="M830,290 L918,246"/>
<path d="M830,320 L918,384"/>
</g>
<text x="640" y="482" font-size="14" fill="#E8E8E8">The test reads what core asked for:</text>
<text x="640" y="506" font-size="13" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">db.execute 7 local SELECT 1</text>

<g font-size="13" fill="#9AA0A6">
<rect x="48" y="548" width="14" height="14" rx="3" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<text x="70" y="560">the centre</text>
<rect x="160" y="548" width="14" height="14" rx="3" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="182" y="560">a real adapter</text>
<rect x="300" y="548" width="14" height="14" rx="3" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="322" y="560">a fake from testkit</text>
</g>
<text x="48" y="598" font-size="13" fill="#9AA0A6" letter-spacing="1">comando · docs/modules/testkit.md</text>
</svg>
