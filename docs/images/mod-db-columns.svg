<text x="48" y="48" font-size="13" fill="#E7C55A" letter-spacing="3">MODULE · DB · COLUMNAR RESULT</text>
<text x="48" y="82" font-size="24" font-weight="300" fill="#E8E8E8">You see rows; comando keeps columns</text>

<text x="48" y="130" font-size="13" fill="#9AA0A6" letter-spacing="2">WHAT YOU SEE</text>
