<g font-size="14">
<text x="470" y="404" fill="#E8E8E8">The writer, one lane, fills cells below the gold line. Then it moves the line.</text>
<text x="470" y="430" fill="#E8E8E8">Readers, the grid and an agent's tools, only look above the line.</text>
<text x="470" y="456" fill="#9AA0A6">A null is one bit in a bitmap beside its chunk. A timestamp is a long: microseconds, UTC.</text>
</g>

<g font-size="13" fill="#9AA0A6">
<rect x="48" y="494" width="14" height="14" rx="3" fill="#6FAEE8" fill-opacity="0.28" stroke="#6FAEE8" stroke-width="1"/>
<text x="70" y="506">published: safe to read</text>
<rect x="250" y="494" width="14" height="14" rx="3" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1"/>
<text x="272" y="506">not yet published: only the writer touches it</text>
