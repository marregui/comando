<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>A question from one instance to another: the asking session calls instance_ask; its instance publishes the question to the other's inbox on the comando Edge with a response topic and correlation data; the instance asked makes or reuses a consult session and sends it the question as a prompt; the turn's closing text goes back to the asker's reply topic, where the correlation data matches it to the waiting call</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9AA0A6" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="40" y="44" font-size="13" letter-spacing="3" fill="#E7C55A">INSTANCES · ONE QUESTION</text>
  <text x="40" y="78" font-size="24" font-weight="300" fill="#E8E8E8">One comando asks another, through the comando Edge</text>

  <!-- heads: centres 120, 310, 500, 690, 880 -->
  <g fill="#1E1E1E" stroke-width="1.3">
    <rect x="40" y="110" width="160" height="58" rx="8" stroke="#D98E5F"/>
    <rect x="230" y="110" width="160" height="58" rx="8" stroke="#6FAEE8"/>
    <rect x="420" y="110" width="160" height="58" rx="8" stroke="#AEB6C1"/>
    <rect x="610" y="110" width="160" height="58" rx="8" stroke="#6FAEE8"/>
    <rect x="800" y="110" width="160" height="58" rx="8" stroke="#D98E5F"/>
  </g>
  <g text-anchor="middle" font-size="16">
    <text x="120" y="136" fill="#D98E5F">a session</text>
    <text x="310" y="136" fill="#6FAEE8">instance a</text>
    <text x="500" y="136" fill="#AEB6C1">comando Edge</text>
    <text x="690" y="136" fill="#6FAEE8">instance b</text>
    <text x="880" y="136" font-family="Menlo, Consolas, monospace" font-size="15" fill="#D98E5F">consult-a</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#9AA0A6">
    <text x="120" y="156">in instance a</text>
    <text x="310" y="156">its MCP server</text>
    <text x="500" y="156">the MQTT broker</text>
    <text x="690" y="156">its MCP server</text>
    <text x="880" y="156">a session in b</text>
  </g>
  <g stroke="#3A3A3A" stroke-width="1">
    <line x1="120" y1="168" x2="120" y2="500"/><line x1="310" y1="168" x2="310" y2="500"/><line x1="500" y1="168" x2="500" y2="500"/>
    <line x1="690" y1="168" x2="690" y2="500"/><line x1="880" y1="168" x2="880" y2="500"/>
  </g>

  <g stroke="#9AA0A6" stroke-width="1.1" fill="none">
    <line x1="120" y1="212" x2="309" y2="212" marker-end="url(#ar)"/>
    <line x1="310" y1="262" x2="499" y2="262" marker-end="url(#ar)"/>
    <line x1="500" y1="262" x2="689" y2="262" marker-end="url(#ar)"/>
    <line x1="690" y1="312" x2="879" y2="312" marker-end="url(#ar)"/>
    <g stroke-dasharray="6 5">
      <line x1="880" y1="372" x2="691" y2="372" marker-end="url(#ar)"/>
      <line x1="690" y1="422" x2="501" y2="422" marker-end="url(#ar)"/>
      <line x1="500" y1="422" x2="311" y2="422" marker-end="url(#ar)"/>
      <line x1="310" y1="472" x2="121" y2="472" marker-end="url(#ar)"/>
    </g>
  </g>
  <g font-size="13" letter-spacing="2" fill="#9AA0A6">
    <text x="132" y="204">1</text><text x="322" y="254">2</text><text x="702" y="304">3</text>
    <text x="702" y="364">4</text><text x="322" y="414">5</text><text x="132" y="464">6</text>
  </g>
  <g font-size="13" fill="#E8E8E8">
    <text x="152" y="204" font-family="Menlo, Consolas, monospace">instance_ask</text>
    <text x="342" y="254">publish to <tspan font-family="Menlo, Consolas, monospace">…/b/inbox</tspan>, delivered to b</text>
    <text x="722" y="304">the question, as a prompt</text>
    <text x="722" y="364">the turn's closing text</text>
    <text x="342" y="414">publish to <tspan font-family="Menlo, Consolas, monospace">…/a/reply</tspan>, delivered to a</text>
    <text x="152" y="464">the answer</text>
  </g>
  <g font-size="13" fill="#9AA0A6">
    <text x="322" y="282">carries a response topic and correlation data</text>
    <text x="322" y="442">the correlation data finds the waiting call</text>
  </g>

  <g font-size="13" fill="#9AA0A6">
    <text x="40" y="530">Step 6 waits <tspan font-family="Menlo, Consolas, monospace">wait_seconds</tspan>. A slower answer leaves an id, read later with <tspan font-family="Menlo, Consolas, monospace">instance_reply</tspan>.</text>
    <rect x="40" y="546" width="14" height="14" rx="3" fill="#6FAEE8"/><text x="62" y="558">comando</text>
    <rect x="136" y="546" width="14" height="14" rx="3" fill="#D98E5F"/><text x="158" y="558">Claude Code</text>
    <rect x="262" y="546" width="14" height="14" rx="3" fill="#AEB6C1"/><text x="284" y="558">between instances</text>
    <text x="430" y="558">Solid: the question. Dashed: the answer.</text>
    <text x="960" y="558" text-anchor="end">comando · docs/workbench</text>
  </g>
</svg>
