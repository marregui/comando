<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>The tour in twelve stops: the window, starting cdb, a first table, running blocks, reading a result, time partitions, time series, window functions, joins, changing data, asking Claude, and the database from outside the window</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></linearGradient>
  </defs>
  <rect width="1000" height="570" fill="url(#bg)"/>
  <text x="32" y="44" font-size="13" letter-spacing="3" fill="#E7C55A">THE TOUR</text>
  <text x="32" y="78" font-size="24" font-weight="300" fill="#E8E8E8">Twelve stops, one window, one database</text>

  <!-- the route -->
  <g stroke="#E7C55A" stroke-width="1.1" fill="none" opacity="0.75">
    <line x1="254" y1="165" x2="270" y2="165"/><line x1="492" y1="165" x2="508" y2="165"/><line x1="730" y1="165" x2="746" y2="165"/>
    <path d="M857 220 V230 H143 V240"/>
    <line x1="254" y1="295" x2="270" y2="295"/><line x1="492" y1="295" x2="508" y2="295"/><line x1="730" y1="295" x2="746" y2="295"/>
    <path d="M857 350 V360 H143 V370"/>
    <line x1="254" y1="425" x2="270" y2="425"/><line x1="492" y1="425" x2="508" y2="425"/><line x1="730" y1="425" x2="746" y2="425"/>
  </g>

  <!-- boxes -->
  <g fill="#1E1E1E" stroke-width="1.3">
    <rect x="32" y="110" width="222" height="110" rx="8" stroke="#6FAEE8"/>
    <rect x="270" y="110" width="222" height="110" rx="8" stroke="#E7C55A"/>
    <rect x="508" y="110" width="222" height="110" rx="8" stroke="#E7C55A"/>
    <rect x="746" y="110" width="222" height="110" rx="8" stroke="#6FAEE8"/>
    <rect x="32" y="240" width="222" height="110" rx="8" stroke="#6FAEE8"/>
    <rect x="270" y="240" width="222" height="110" rx="8" stroke="#E7C55A"/>
    <rect x="508" y="240" width="222" height="110" rx="8" stroke="#E7C55A"/>
    <rect x="746" y="240" width="222" height="110" rx="8" stroke="#E7C55A"/>
    <rect x="32" y="370" width="222" height="110" rx="8" stroke="#E7C55A"/>
    <rect x="270" y="370" width="222" height="110" rx="8" stroke="#E7C55A"/>
    <rect x="508" y="370" width="222" height="110" rx="8" stroke="#D98E5F"/>
    <rect x="746" y="370" width="222" height="110" rx="8" stroke="#E7C55A"/>
  </g>

  <!-- numbers -->
  <g font-size="13" font-weight="600" text-anchor="middle" fill="#121212">
    <circle cx="58" cy="140" r="13" fill="#6FAEE8"/><text x="58" y="145">1</text>
    <circle cx="296" cy="140" r="13" fill="#E7C55A"/><text x="296" y="145">2</text>
    <circle cx="534" cy="140" r="13" fill="#E7C55A"/><text x="534" y="145">3</text>
    <circle cx="772" cy="140" r="13" fill="#6FAEE8"/><text x="772" y="145">4</text>
    <circle cx="58" cy="270" r="13" fill="#6FAEE8"/><text x="58" y="275">5</text>
    <circle cx="296" cy="270" r="13" fill="#E7C55A"/><text x="296" y="275">6</text>
    <circle cx="534" cy="270" r="13" fill="#E7C55A"/><text x="534" y="275">7</text>
    <circle cx="772" cy="270" r="13" fill="#E7C55A"/><text x="772" y="275">8</text>
    <circle cx="58" cy="400" r="13" fill="#E7C55A"/><text x="58" y="405">9</text>
    <circle cx="296" cy="400" r="13" fill="#E7C55A"/><text x="296" y="405">10</text>
    <circle cx="534" cy="400" r="13" fill="#D98E5F"/><text x="534" y="405">11</text>
    <circle cx="772" cy="400" r="13" fill="#E7C55A"/><text x="772" y="405">12</text>
  </g>

  <!-- titles -->
  <g font-size="15" fill="#E8E8E8">
    <text x="80" y="145">The window</text>
    <text x="318" y="145">Start the database</text>
    <text x="556" y="145">A first table</text>
    <text x="794" y="145">Run, route, stop</text>
    <text x="80" y="275">Read a result</text>
    <text x="318" y="275">Partitions and plans</text>
    <text x="556" y="275">Time series</text>
    <text x="794" y="275">Window functions</text>
    <text x="80" y="405">Joins</text>
    <text x="318" y="405">Change and expire</text>
    <text x="556" y="405">Ask Claude</text>
    <text x="794" y="405">Outside the window</text>
  </g>

  <!-- what each stop teaches -->
  <g font-size="13" fill="#9AA0A6">
    <text x="50" y="178">panels, tabs, sidebar,</text><text x="50" y="198">the command palette</text>
    <text x="288" y="178">one server per machine,</text><text x="288" y="198">one connection: local cdb</text>
    <text x="526" y="178">100,000 trades, stored</text><text x="526" y="198">by column, in time order</text>
    <text x="764" y="178">a block is SQL or a</text><text x="764" y="198">prompt; three keys</text>
    <text x="50" y="308">sort, find, copy, export,</text><text x="50" y="328">plot, keep, explore</text>
    <text x="288" y="308">a folder per day; EXPLAIN</text><text x="288" y="328">shows what a query reads</text>
    <text x="526" y="308">SAMPLE BY, FILL,</text><text x="526" y="328">LATEST ON</text>
    <text x="764" y="308">lag, rank and a running</text><text x="764" y="328">average, row by row</text>
    <text x="50" y="438">a second table, CTEs,</text><text x="50" y="458">subqueries, set operations</text>
    <text x="288" y="438">ALTER, UPDATE, DELETE,</text><text x="288" y="458">dedup, TTL, the log</text>
    <text x="526" y="438">tools read your data; a</text><text x="526" y="458">write waits for your yes</text>
    <text x="764" y="438">HTTP, line protocol,</text><text x="764" y="458">backup, restore, quit</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#9AA0A6">
    <rect x="32" y="508" width="14" height="14" rx="3" fill="#E7C55A"/><text x="54" y="520">cdb, the database</text>
    <rect x="200" y="508" width="14" height="14" rx="3" fill="#6FAEE8"/><text x="222" y="520">comando's window</text>
    <rect x="368" y="508" width="14" height="14" rx="3" fill="#D98E5F"/><text x="390" y="520">Claude Code</text>
    <text x="32" y="550">comando · docs/tutorial</text>
  </g>
</svg>
