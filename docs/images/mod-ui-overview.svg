<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>The ui module: the state loop in core sends the AppState to the shell and receives intents back; the module is six layers, shell, dialogs, panels, widgets, the widget contract and the kit, and each layer uses only the layers below it</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9AA0A6" stroke-width="1.5"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#E7C55A" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="600" fill="url(#bg)"/>
  <text x="40" y="44" font-size="13" letter-spacing="3" fill="#E7C55A">MODULE UI · OVERVIEW</text>
  <text x="40" y="78" font-size="24" font-weight="300" fill="#E8E8E8">State comes in, intents go out, six layers in between</text>

  <!-- the state loop -->
  <rect x="40" y="110" width="210" height="124" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.5"/>
  <text x="58" y="136" font-size="13" letter-spacing="2" fill="#E7C55A">CORE</text>
  <text x="58" y="164" font-family="Menlo, Consolas, monospace" font-size="16" fill="#E8E8E8">StateLoop</text>
  <text x="58" y="190" font-size="13" fill="#9AA0A6">one AppState, one reducer,</text>
  <text x="58" y="210" font-size="13" fill="#9AA0A6">one thread</text>

  <line x1="250" y1="130" x2="398" y2="130" stroke="#E7C55A" stroke-width="1.3" marker-end="url(#arg)"/>
  <text x="324" y="122" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#E8E8E8">AppState</text>
  <line x1="400" y1="156" x2="252" y2="156" stroke="#6FAEE8" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="324" y="176" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#E8E8E8">Intent</text>

  <!-- rules -->
  <text x="40" y="282" font-size="13" letter-spacing="2" fill="#9AA0A6">THE RULES OF THE LAYERS</text>
  <line x1="40" y1="294" x2="340" y2="294" stroke="#3A3A3A" stroke-width="1"/>
  <text x="40" y="322" font-size="14" fill="#E8E8E8">A layer uses only the layers below it.</text>
  <text x="40" y="350" font-size="14" fill="#E8E8E8">No widget imports another widget.</text>
  <text x="40" y="378" font-size="14" fill="#E8E8E8">Nothing here calls an adapter or JDBC.</text>
  <text x="40" y="406" font-size="14" fill="#E8E8E8">A widget keeps no state of its own.</text>
  <text x="40" y="446" font-family="Menlo, Consolas, monospace" font-size="13" fill="#6FAEE8">UiArchitectureTest</text>
  <text x="40" y="466" font-size="13" fill="#9AA0A6">fails the build when a rule breaks.</text>

  <!-- the direction of use -->
  <line x1="384" y1="182" x2="384" y2="494" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="374" y="338" text-anchor="middle" font-size="13" letter-spacing="2" fill="#9AA0A6" transform="rotate(-90 374 338)">USES WHAT IS BELOW</text>

  <!-- the six layers -->
  <g fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.3">
    <rect x="400" y="110" width="560" height="58" rx="8"/>
    <rect x="400" y="176" width="560" height="58" rx="8"/>
    <rect x="400" y="242" width="560" height="58" rx="8"/>
    <rect x="400" y="308" width="560" height="58" rx="8"/>
    <rect x="400" y="374" width="560" height="58" rx="8"/>
    <rect x="400" y="440" width="560" height="58" rx="8"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="16" fill="#6FAEE8">
    <text x="418" y="145">shell</text>
    <text x="418" y="211">dialogs</text>
    <text x="418" y="277">panels</text>
    <text x="418" y="343">widgets</text>
    <text x="418" y="409">widget</text>
    <text x="418" y="475">kit</text>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#E8E8E8">
    <text x="520" y="134">ComandoUi  Commands  LayoutKeeper  QuitFlow</text>
    <text x="520" y="200">ResourceDialog  FoldersDialog  JobsDialog</text>
    <text x="520" y="266">SessionsSidebar  Workspace  LowerPanel  SidePane</text>
    <text x="520" y="332">TranscriptWidget  GridTable  PlotWidget  DiffWidget</text>
    <text x="520" y="398">Widget&lt;V&gt;  WidgetRegistry  WidgetContext</text>
    <text x="520" y="464">Theme  ActionRegistry  Coalescer  Icons  Highlighter</text>
  </g>
  <g font-size="13" fill="#9AA0A6">
    <text x="520" y="154">the window, its menus and keys; the one class app builds</text>
    <text x="520" y="220">modal forms: a resource, the folders, the jobs</text>
    <text x="520" y="286">the regions of the window; they place widgets</text>
    <text x="520" y="352">one folder each, standing alone: render(view), no more</text>
    <text x="520" y="418">the contract every widget keeps, and four capabilities</text>
    <text x="520" y="484">shared craft: theme, actions, async, text, icons, tabs</text>
  </g>

  <!-- legend -->
  <rect x="40" y="528" width="14" height="14" rx="3" fill="#E7C55A"/>
  <text x="62" y="540" font-size="13" fill="#9AA0A6">core: the state loop</text>
  <rect x="220" y="528" width="14" height="14" rx="3" fill="#6FAEE8"/>
  <text x="242" y="540" font-size="13" fill="#9AA0A6">ui: packages under dev.marregui.comando.ui</text>
  <text x="40" y="578" font-size="13" fill="#9AA0A6">comando · docs/modules/ui.md</text>
</svg>
