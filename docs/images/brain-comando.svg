<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">How comando hosts a brain: it finds the folder, hands it to every session, checkpoints the session, shows the brain in its tabs and backs it up to a remote</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#6FAEE8"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" fill="#D98E5F"/></marker>
    <style>
      .cap{font-size:13px;font-weight:600;letter-spacing:2.5px}
      .t{font-size:15px;fill:#E8E8E8}
      .s{font-size:14px;fill:#9AA0A6}
      .m{font-family:Menlo, Consolas, monospace;font-size:13px;fill:#E8E8E8}
      .num{font-size:13px;font-weight:600;fill:#6FAEE8}
      .foot{font-size:13px;fill:#9AA0A6;letter-spacing:.5px}
    </style>
  </defs>
  <rect width="1100" height="510" fill="#161616"/>

  <text x="40" y="44" class="cap" fill="#E7C55A">COMANDO HOSTS THE BRAIN</text>
  <text x="40" y="68" class="s">Five things comando does with a brain. The sessions do the remembering.</text>

  <!-- comando -->
  <rect x="40" y="96" width="300" height="340" rx="6" fill="#1E1E1E" stroke="#6FAEE8"/>
  <text x="60" y="126" class="cap" fill="#6FAEE8">COMANDO</text>
  <g>
    <text x="60" y="164" class="num">1</text><text x="82" y="164" class="t">finds the brain at start</text>
    <text x="82" y="184" class="s">a variable, the manifest, or BRAIN</text>
    <text x="60" y="220" class="num">2</text><text x="82" y="220" class="t">hands it to every session</text>
    <text x="82" y="240" class="s">two launch values carry it</text>
    <text x="60" y="276" class="num">3</text><text x="82" y="276" class="t">checkpoints the session</text>
    <text x="82" y="296" class="s">at 40 % of its context, by default</text>
    <text x="60" y="332" class="num">4</text><text x="82" y="332" class="t">shows it</text>
    <text x="82" y="352" class="s">Brain, Scratchpad and Logbook tabs</text>
    <text x="60" y="388" class="num">5</text><text x="82" y="388" class="t">backs it up</text>
    <text x="82" y="408" class="s">only when you click</text>
  </g>

  <!-- a session -->
  <rect x="400" y="96" width="300" height="154" rx="6" fill="#1E1E1E" stroke="#D98E5F"/>
  <text x="420" y="126" class="cap" fill="#D98E5F">A SESSION · claude</text>
  <text x="420" y="160" class="m">COMANDO_BRAIN=&lt;brain&gt;</text>
  <text x="420" y="186" class="m">autoMemoryDirectory=</text>
  <text x="420" y="204" class="m">  &lt;brain&gt;/MEMORY</text>
  <text x="420" y="234" class="s">reads and writes the brain</text>

  <!-- the brain -->
  <rect x="760" y="96" width="300" height="194" rx="6" fill="#1E1E1E" stroke="#E7C55A"/>
  <text x="780" y="126" class="cap" fill="#E7C55A">THE BRAIN</text>
  <text x="780" y="150" class="s">a folder, and a git repository</text>
  <line x1="780" y1="164" x2="1040" y2="164" stroke="#2A2A2A"/>
  <text x="780" y="192" class="m">MEMORY/</text><text x="900" y="192" class="s">working context</text>
  <text x="780" y="222" class="m">KB/</text><text x="900" y="222" class="s">checked knowledge</text>
  <text x="780" y="252" class="m">SCRATCHPAD/</text><text x="900" y="252" class="s">today's work</text>

  <!-- the remote -->
  <rect x="760" y="366" width="300" height="70" rx="6" fill="#1E1E1E" stroke="#9AA0A6"/>
  <text x="780" y="396" class="cap" fill="#9AA0A6">YOUR GIT REMOTE</text>
  <text x="780" y="420" class="s">one commit per backup</text>

  <!-- arrows -->
  <line x1="340" y1="160" x2="394" y2="160" stroke="#6FAEE8" stroke-width="1.5" marker-end="url(#b)"/>
  <circle cx="368" cy="140" r="11" fill="#161616" stroke="#6FAEE8"/><text x="368" y="145" text-anchor="middle" class="num">2</text>

  <line x1="708" y1="176" x2="752" y2="176" stroke="#D98E5F" stroke-width="1.5" marker-start="url(#o)" marker-end="url(#o)"/>

  <path d="M340,284 H550 V258" fill="none" stroke="#6FAEE8" stroke-width="1.5" marker-end="url(#b)"/>
  <circle cx="368" cy="284" r="11" fill="#161616" stroke="#6FAEE8"/><text x="368" y="289" text-anchor="middle" class="num">3</text>
  <text x="392" y="306" class="m">/reflect --auto</text>
  <text x="392" y="324" class="m">then /compact</text>

  <path d="M340,346 H726 V270 H754" fill="none" stroke="#6FAEE8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <circle cx="368" cy="346" r="11" fill="#161616" stroke="#6FAEE8"/><text x="368" y="351" text-anchor="middle" class="num">4</text>
  <text x="392" y="368" class="s">reads it to draw the tabs</text>

  <line x1="820" y1="290" x2="820" y2="360" stroke="#6FAEE8" stroke-width="1.5" marker-end="url(#b)"/>
  <circle cx="820" cy="322" r="11" fill="#161616" stroke="#6FAEE8"/><text x="820" y="327" text-anchor="middle" class="num">5</text>
  <text x="842" y="327" class="m">git add, commit, push</text>

  <circle cx="760" cy="96" r="11" fill="#161616" stroke="#6FAEE8"/><text x="760" y="101" text-anchor="middle" class="num">1</text>

  <line x1="40" y1="464" x2="1060" y2="464" stroke="#2A2A2A"/>
  <circle cx="46" cy="484" r="5" fill="#6FAEE8"/><text x="60" y="489" class="foot">comando</text>
  <circle cx="146" cy="484" r="5" fill="#D98E5F"/><text x="160" y="489" class="foot">Claude Code session</text>
  <circle cx="320" cy="484" r="5" fill="#E7C55A"/><text x="334" y="489" class="foot">brain</text>
  <text x="1060" y="489" text-anchor="end" class="foot">comando · docs/brain</text>
</svg>
