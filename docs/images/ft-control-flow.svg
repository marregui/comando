<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The control flow of frontear: the control pod writes, signs and publishes a request; alexander, the node's control plane, checks it in a fixed order, applies it, then replies and publishes its state</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#9AA0A6" stroke-width="1.4"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6FAEE8" stroke-width="1.4"/></marker>
</defs>
<rect width="1200" height="620" fill="#161616"/>
<text x="40" y="44" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">FRONTEAR · THE CONTROL FLOW</text>
<text x="40" y="76" font-size="22" font-weight="300" fill="#E8E8E8">A signed request passes every check, or changes nothing</text>

<!-- the pod -->
<rect x="40" y="104" width="310" height="268" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="56" y="128" font-size="13" fill="#6FAEE8" letter-spacing="2">CONTROL POD</text>
<text x="56" y="160" font-size="13" fill="#9AA0A6" letter-spacing="2">1 · WRITE THE REQUEST</text>
<text x="56" y="182" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">$frontear/control/a/PutLink</text>
<text x="56" y="202" font-size="13" fill="#E8E8E8">and a JSON body</text>
<text x="56" y="236" font-size="13" fill="#9AA0A6" letter-spacing="2">2 · SIGN IT</text>
<text x="56" y="258" font-size="13" fill="#E8E8E8">Ed25519 over the topic, the time,</text>
<text x="56" y="276" font-size="13" fill="#E8E8E8">a fresh nonce and the body</text>
<text x="56" y="310" font-size="13" fill="#9AA0A6" letter-spacing="2">3 · PUBLISH IT</text>
<text x="56" y="332" font-size="13" fill="#E8E8E8">QoS 1, with four signature</text>
<text x="56" y="350" font-size="13" fill="#E8E8E8">properties</text>
<line x1="350" y1="238" x2="426" y2="238" stroke="#6FAEE8" stroke-width="1.4" marker-end="url(#b)"/>

<!-- the node's checks -->
<rect x="430" y="104" width="400" height="384" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<text x="446" y="128" font-size="13" fill="#E7C55A" letter-spacing="2">NODE a</text>
<text x="814" y="128" font-size="13" fill="#9AA0A6" letter-spacing="2" text-anchor="end">IF NOT: REASON, PUBACK</text>
<g fill="#242424" stroke="#3A3A3A" stroke-width="1">
<rect x="446" y="144" width="368" height="30" rx="4"/><rect x="446" y="180" width="368" height="30" rx="4"/>
<rect x="446" y="216" width="368" height="30" rx="4"/><rect x="446" y="252" width="368" height="30" rx="4"/>
<rect x="446" y="288" width="368" height="30" rx="4"/><rect x="446" y="324" width="368" height="30" rx="4"/>
<rect x="446" y="360" width="368" height="30" rx="4"/><rect x="446" y="396" width="368" height="30" rx="4"/>
</g>
<rect x="446" y="432" width="368" height="40" rx="4" fill="#2B2618" stroke="#E7C55A" stroke-width="1.2"/>
<g fill="#6FAEE8">
<rect x="446" y="144" width="4" height="30"/><rect x="446" y="180" width="4" height="30"/><rect x="446" y="216" width="4" height="30"/>
<rect x="446" y="252" width="4" height="30"/><rect x="446" y="288" width="4" height="30"/><rect x="446" y="324" width="4" height="30"/>
</g>
<g fill="#AEB6C1"><rect x="446" y="360" width="4" height="30"/><rect x="446" y="396" width="4" height="30"/></g>
<g font-size="13" fill="#E8E8E8">
<text x="462" y="164">1 · properties sound?</text>
<text x="462" y="200">2 · each one well formed?</text>
<text x="462" y="236">3 · key trusted?</text>
<text x="462" y="272">4 · time within 30 seconds?</text>
<text x="462" y="308">5 · signature verifies?</text>
<text x="462" y="344">6 · nonce new?</text>
<text x="462" y="380">7 · a JSON body?</text>
<text x="462" y="416">8 · method known?</text>
<text x="462" y="457" fill="#E7C55A">9 · apply the change</text>
</g>
<g font-size="13" fill="#9AA0A6" text-anchor="end" font-family="Menlo, Consolas, monospace">
<text x="802" y="164">malformed, unsigned 0x87</text>
<text x="802" y="200">malformed 0x87</text>
<text x="802" y="236">unknown-key 0x87</text>
<text x="802" y="272">stale 0x87</text>
<text x="802" y="308">bad-signature 0x87</text>
<text x="802" y="344">replayed 0x87</text>
<text x="802" y="380">bad-request 0x99</text>
<text x="802" y="416">unknown-method 0x90</text>
<text x="802" y="457">failed 0x83</text>
</g>

<!-- what comes back -->
<line x1="830" y1="160" x2="906" y2="160" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="910" y="104" width="250" height="112" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="926" y="128" font-size="13" fill="#9AA0A6" letter-spacing="2">REPLY, TO THE POD</text>
<text x="926" y="152" font-size="13" fill="#E7C55A" font-family="Menlo, Consolas, monospace">{"ok":true}</text>
<text x="926" y="174" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">{"ok":false,"reason":…}</text>
<text x="926" y="198" font-size="13" fill="#9AA0A6">on the response topic you chose</text>

<line x1="830" y1="290" x2="906" y2="290" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="910" y="240" width="250" height="112" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.2"/>
<text x="926" y="264" font-size="13" fill="#9AA0A6" letter-spacing="2">STATE, TO EVERYONE</text>
<text x="926" y="288" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">$frontear/state/a/links</text>
<text x="926" y="312" font-size="13" fill="#9AA0A6">retained: every link and its</text>
<text x="926" y="330" font-size="13" fill="#9AA0A6">counters, for any subscriber</text>

<line x1="830" y1="420" x2="906" y2="420" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="910" y="376" width="250" height="112" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="926" y="400" font-size="13" fill="#9AA0A6" letter-spacing="2">PUBACK, TO THE POD</text>
<text x="926" y="424" font-size="13" fill="#E8E8E8"><tspan font-family="Menlo, Consolas, monospace" fill="#E7C55A">0x00</tspan> when the change is applied</text>
<text x="926" y="448" font-size="13" fill="#9AA0A6">the refusal's code otherwise,</text>
<text x="926" y="466" font-size="13" fill="#9AA0A6">from the right-hand column</text>

<text x="40" y="516" font-size="13" fill="#9AA0A6">The node checks the nonce only after the signature verifies, and applies requests one at a time.</text>
<text x="40" y="536" font-size="13" fill="#9AA0A6">Fields that do not fit the method are refused as bad-request 0x99 too.</text>
<text x="40" y="556" font-size="13" fill="#9AA0A6">A refused request with a response topic still gets its reply, so the sender learns the reason.</text>

<line x1="40" y1="568" x2="1160" y2="568" stroke="#2A2A2A" stroke-width="1"/>
<text x="40" y="596" font-size="13" fill="#9AA0A6">comando · docs/frontear.md</text>
<rect x="520" y="584" width="14" height="14" rx="3" fill="#6FAEE8"/><text x="540" y="596" font-size="13" fill="#9AA0A6">the pod, and the checks of who sent it</text>
<rect x="800" y="584" width="14" height="14" rx="3" fill="#AEB6C1"/><text x="820" y="596" font-size="13" fill="#9AA0A6">checks of what it asks</text>
<rect x="990" y="584" width="14" height="14" rx="3" fill="#E7C55A"/><text x="1010" y="596" font-size="13" fill="#9AA0A6">alexander, the change</text>
</svg>
