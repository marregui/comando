<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>The painted transcript: the whole conversation is a column of items, one per block; only a window of pixels around the view is laid out, only the items that cross the view are painted, and items far away keep their height alone; on the right, the path from a block of core's Transcript through MarkdownDoc and TextBox to an Item that TranscriptCanvas paints</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9AA0A6" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="590" fill="url(#bg)"/>
  <text x="40" y="44" font-size="13" letter-spacing="3" fill="#E7C55A">MODULE UI · THE TRANSCRIPT</text>
  <text x="40" y="78" font-size="24" font-weight="300" fill="#E8E8E8">The whole conversation is kept; only a window of it is laid out</text>

  <!-- the conversation, one item per block -->
  <text x="40" y="118" font-size="13" letter-spacing="2" fill="#9AA0A6">THE CONVERSATION · ONE ITEM PER BLOCK</text>

  <!-- far above -->
  <g fill="none" stroke="#3A3A3A" stroke-width="1">
    <rect x="70" y="136" width="240" height="24" rx="5"/>
    <rect x="70" y="164" width="240" height="36" rx="5"/>
    <rect x="70" y="204" width="240" height="24" rx="5"/>
  </g>
  <g font-size="13" fill="#5F6368">
    <text x="82" y="153">prompt</text><text x="82" y="187">text</text><text x="82" y="221">tool card</text>
  </g>

  <!-- the window laid out -->
  <rect x="56" y="236" width="268" height="232" rx="8" fill="none" stroke="#E7C55A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g fill="#1E1E1E" stroke="#E7C55A" stroke-width="1">
    <rect x="70" y="246" width="240" height="36" rx="5"/>
    <rect x="70" y="286" width="240" height="24" rx="5"/>
    <rect x="70" y="408" width="240" height="24" rx="5"/>
    <rect x="70" y="436" width="240" height="24" rx="5"/>
  </g>
  <g font-size="13" fill="#9AA0A6">
    <text x="82" y="269">text</text><text x="82" y="303">tool card</text>
    <text x="82" y="425">thinking</text><text x="82" y="453">tool card</text>
  </g>

  <!-- the view -->
  <rect x="62" y="316" width="256" height="86" rx="6" fill="#16202B" stroke="#6FAEE8" stroke-width="1.6"/>
  <g fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1">
    <rect x="70" y="324" width="240" height="24" rx="5"/>
    <rect x="70" y="352" width="240" height="42" rx="5"/>
  </g>
  <g font-size="13" fill="#E8E8E8">
    <text x="82" y="341">prompt</text><text x="82" y="378">text</text>
  </g>

  <!-- far below -->
  <g fill="none" stroke="#3A3A3A" stroke-width="1">
    <rect x="70" y="476" width="240" height="24" rx="5"/>
    <rect x="70" y="504" width="240" height="20" rx="5"/>
  </g>
  <g font-size="13" fill="#5F6368">
    <text x="82" y="493">text</text><text x="82" y="519">turn end</text>
  </g>

  <!-- what each zone means -->
  <line x1="324" y1="180" x2="350" y2="180" stroke="#3A3A3A" stroke-width="1"/>
  <text x="358" y="176" font-size="13" fill="#9AA0A6">Far from the view: the layout</text>
  <text x="358" y="194" font-size="13" fill="#9AA0A6">is dropped, the height is kept.</text>

  <line x1="324" y1="268" x2="350" y2="268" stroke="#E7C55A" stroke-width="1.3"/>
  <text x="358" y="264" font-size="13" fill="#E7C55A">The window: laid out.</text>
  <text x="358" y="282" font-size="13" fill="#9AA0A6">Two view heights above and</text>
  <text x="358" y="300" font-size="13" fill="#9AA0A6">below, at least 1 600 px.</text>

  <line x1="318" y1="358" x2="350" y2="358" stroke="#6FAEE8" stroke-width="1.3"/>
  <text x="358" y="354" font-size="13" fill="#6FAEE8">The view: painted.</text>
  <text x="358" y="372" font-size="13" fill="#9AA0A6">Only the items the clip</text>
  <text x="358" y="390" font-size="13" fill="#9AA0A6">crosses are visited.</text>

  <line x1="324" y1="500" x2="350" y2="500" stroke="#3A3A3A" stroke-width="1"/>
  <text x="358" y="496" font-size="13" fill="#9AA0A6">The window slides as you scroll;</text>
  <text x="358" y="514" font-size="13" fill="#9AA0A6">an idle pass fills it in 8 ms slices.</text>

  <!-- from a block to pixels -->
  <text x="640" y="118" font-size="13" letter-spacing="2" fill="#9AA0A6">FROM A BLOCK TO PIXELS</text>
  <g fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.3">
    <rect x="640" y="136" width="320" height="58" rx="8"/>
    <rect x="640" y="216" width="320" height="58" rx="8"/>
    <rect x="640" y="296" width="320" height="58" rx="8"/>
    <rect x="640" y="376" width="320" height="58" rx="8"/>
  </g>
  <rect x="640" y="456" width="320" height="58" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#6FAEE8">
    <text x="656" y="160">Transcript</text>
    <text x="656" y="240">MarkdownDoc.parse</text>
    <text x="656" y="320">TextBox</text>
    <text x="656" y="400">Item</text>
  </g>
  <text x="656" y="480" font-family="Menlo, Consolas, monospace" font-size="14" fill="#E7C55A">TranscriptCanvas</text>
  <g font-size="13" fill="#9AA0A6">
    <text x="656" y="182">core: the session's blocks, in order</text>
    <text x="656" y="262">paragraphs (Para) of runs (Span)</text>
    <text x="656" y="342">lines broken at the width, then kept</text>
    <text x="656" y="422">one per block; it knows its height</text>
    <text x="656" y="502">lays out the window, paints the clip</text>
  </g>
  <g stroke="#9AA0A6" stroke-width="1.3">
    <line x1="800" y1="194" x2="800" y2="213" marker-end="url(#ar)"/>
    <line x1="800" y1="274" x2="800" y2="293" marker-end="url(#ar)"/>
    <line x1="800" y1="354" x2="800" y2="373" marker-end="url(#ar)"/>
    <line x1="800" y1="434" x2="800" y2="453" marker-end="url(#ar)"/>
  </g>

  <!-- legend -->
  <rect x="40" y="544" width="14" height="14" rx="3" fill="#6FAEE8"/>
  <text x="62" y="556" font-size="13" fill="#9AA0A6">painted</text>
  <rect x="140" y="544" width="14" height="14" rx="3" fill="#E7C55A"/>
  <text x="162" y="556" font-size="13" fill="#9AA0A6">laid out</text>
  <rect x="244" y="544" width="14" height="14" rx="3" fill="none" stroke="#5F6368"/>
  <text x="266" y="556" font-size="13" fill="#9AA0A6">height only</text>
  <text x="40" y="578" font-size="13" fill="#9AA0A6">comando · docs/modules/ui.md</text>
  <text x="960" y="556" text-anchor="end" font-size="13" fill="#9AA0A6">Find and copy read the blocks' text and lay out nothing.</text>
</svg>
