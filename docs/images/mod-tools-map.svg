<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>tools: one adapter behind the tool port, four jobs, each reaching one thing outside comando</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></radialGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#9AA0A6" stroke-width="1.4"/></marker>
</defs>
<rect width="1200" height="700" fill="url(#bg)"/>
<text x="48" y="48" font-size="13" fill="#E7C55A" letter-spacing="3">MODULE · TOOLS</text>
<text x="48" y="82" font-size="24" font-weight="300" fill="#E8E8E8">One adapter, four jobs, each with its own helper</text>

<rect x="48" y="246" width="170" height="130" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<text x="64" y="278" font-size="20" font-weight="300" fill="#E7C55A">core</text>
<text x="64" y="312" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">ToolPort</text>
<text x="64" y="340" font-size="13" fill="#9AA0A6">11 kinds of effect</text>

<rect x="262" y="216" width="200" height="190" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="278" y="248" font-size="16" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">ToolsAdapter</text>
<text x="278" y="284" font-size="14" fill="#E8E8E8">never blocks its caller</text>
<text x="278" y="318" font-size="14" fill="#9AA0A6">every job runs on</text>
<text x="278" y="340" font-size="14" fill="#9AA0A6">a thread of its own</text>
<text x="278" y="374" font-size="14" fill="#9AA0A6">and ends in an intent</text>

<g fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2">
<rect x="520" y="120" width="380" height="88" rx="8"/>
<rect x="520" y="222" width="380" height="88" rx="8"/>
<rect x="520" y="324" width="380" height="88" rx="8"/>
<rect x="520" y="426" width="380" height="88" rx="8"/>
</g>
<g font-size="16" fill="#6FAEE8">
<text x="536" y="148">Gradle runs</text>
<text x="536" y="250">Folder trees</text>
<text x="536" y="352">Git changes</text>
<text x="536" y="454">Moves to the Trash</text>
</g>
<g font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">
<text x="536" y="172">GradleBuild  Args  TestReports</text>
<text x="536" y="274">FolderTree</text>
<text x="536" y="376">Git</text>
<text x="536" y="478">ListingLines</text>
</g>
<g font-size="13" fill="#9AA0A6">
<text x="536" y="194">a child process; its output fills a console</text>
<text x="536" y="296">the Kit, Brain and Scratchpad tabs, read on a poll</text>
<text x="536" y="398">status, both versions of a file, roll back, unstage</text>
<text x="536" y="500">then tidies the folder's listing file</text>
</g>

<g fill="#1E1E1E" stroke="#9AA0A6" stroke-width="1.2">
<rect x="960" y="120" width="192" height="88" rx="8"/>
<rect x="960" y="222" width="192" height="88" rx="8"/>
<rect x="960" y="324" width="192" height="88" rx="8"/>
<rect x="960" y="426" width="192" height="88" rx="8"/>
</g>
<text x="976" y="158" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">./gradlew</text>
<text x="976" y="182" font-size="13" fill="#9AA0A6">or gradle-serial</text>
<text x="976" y="272" font-size="14" fill="#E8E8E8">folders on disk</text>
<text x="976" y="362" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">git</text>
<text x="976" y="386" font-size="13" fill="#9AA0A6">as a child process</text>
<text x="976" y="476" font-size="14" fill="#E8E8E8">the desktop's Trash</text>

