<text x="64" y="606">FolderSearch</text>
<text x="440" y="606">KitGit</text>
<text x="816" y="606">ToolSettings</text>
</g>
<g font-size="13" fill="#9AA0A6">
<text x="64" y="628">finds text in those folders, with no index</text>
<text x="440" y="628">the kit's version, and backups by git</text>
<text x="816" y="628">where gradle-serial and the JDK are</text>
</g>

