<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>How data leaves a cdb table by TTL, and how a backup and a restore move a whole store</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></radialGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA0A6"/></marker>
</defs>
<rect width="1100" height="560" fill="url(#bg)"/>
<text x="40" y="46" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">CDB · KEEPING AND REMOVING DATA</text>
<text x="40" y="78" font-size="24" font-weight="300" fill="#E8E8E8">Old days fall off the end; a backup copies the rest</text>

<!-- TTL lane -->
<text x="40" y="126" font-size="13" fill="#9AA0A6" letter-spacing="2">TTL 1 WEEK ON A TABLE PARTITIONED BY DAY</text>
<g fill="#1A1A1A" stroke="#6E7378" stroke-width="1" stroke-dasharray="4 3">
<rect x="60" y="146" width="86" height="58" rx="6"/><rect x="158" y="146" width="86" height="58" rx="6"/>
</g>
<g fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.1">
<rect x="256" y="146" width="86" height="58" rx="6"/><rect x="354" y="146" width="86" height="58" rx="6"/><rect x="452" y="146" width="86" height="58" rx="6"/><rect x="550" y="146" width="86" height="58" rx="6"/><rect x="648" y="146" width="86" height="58" rx="6"/><rect x="746" y="146" width="86" height="58" rx="6"/><rect x="844" y="146" width="86" height="58" rx="6"/>
</g>
<rect x="942" y="146" width="86" height="58" rx="6" fill="#2A2512" stroke="#E7C55A" stroke-width="1.4"/>
<g font-family="Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
<text x="103" y="172" fill="#6E7378">11-10</text><text x="201" y="172" fill="#6E7378">11-11</text>
<text x="299" y="180" fill="#C9CDD2">11-12</text><text x="397" y="180" fill="#C9CDD2">11-13</text><text x="495" y="180" fill="#C9CDD2">11-14</text><text x="593" y="180" fill="#C9CDD2">11-15</text><text x="691" y="180" fill="#C9CDD2">11-16</text><text x="789" y="180" fill="#C9CDD2">11-17</text><text x="887" y="180" fill="#C9CDD2">11-18</text>
<text x="985" y="172" fill="#E7C55A">11-19</text>
</g>
<g font-size="13" font-weight="300" text-anchor="middle">
<text x="103" y="192" fill="#6E7378">dropped</text><text x="201" y="192" fill="#6E7378">dropped</text>
<text x="985" y="192" fill="#E7C55A">newest</text>
</g>
<!-- newest row marker and the TTL window -->
<line x1="1016" y1="204" x2="1016" y2="246" stroke="#E7C55A" stroke-width="1.2"/>
<line x1="330" y1="204" x2="330" y2="246" stroke="#E7C55A" stroke-width="1.2"/>
<line x1="330" y1="238" x2="1016" y2="238" stroke="#E7C55A" stroke-width="1.2"/>
<text x="673" y="262" text-anchor="middle" font-size="13" fill="#E7C55A">one week back from the newest row</text>
<text x="40" y="296" font-size="13" font-weight="300" fill="#C9CDD2">A day goes once it ends before that window starts. cdb drops whole folders: no row is deleted one by one.</text>

<!-- backup lane -->
<line x1="40" y1="324" x2="1060" y2="324" stroke="#2E2E2E" stroke-width="1"/>
<text x="40" y="354" font-size="13" fill="#9AA0A6" letter-spacing="2">BACKUP AND RESTORE</text>
<rect x="60" y="374" width="230" height="92" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.4"/>
<text x="76" y="401" font-size="15" fill="#E7C55A">the data root</text>
<text x="76" y="425" font-size="13" font-weight="300" fill="#C9CDD2">in use: reads and writes</text>
<text x="76" y="444" font-size="13" font-weight="300" fill="#C9CDD2">go on during the backup</text>

<rect x="435" y="374" width="230" height="92" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.2"/>
<text x="451" y="401" font-size="15" fill="#E8E8E8">the backup folder</text>
<text x="451" y="425" font-size="13" font-weight="300" fill="#C9CDD2">a whole store, or nothing:</text>
<text x="451" y="444" font-size="13" font-weight="300" fill="#C9CDD2">never half a copy</text>

<rect x="810" y="374" width="230" height="92" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.2"/>
<text x="826" y="401" font-size="15" fill="#E8E8E8">a new data root</text>
<text x="826" y="425" font-size="13" font-weight="300" fill="#C9CDD2">absent or empty before;</text>
<text x="826" y="444" font-size="13" font-weight="300" fill="#C9CDD2">then you start a server on it</text>

<line x1="290" y1="420" x2="433" y2="420" stroke="#9AA0A6" stroke-width="1.1" marker-end="url(#a)"/>
<text x="362" y="408" text-anchor="middle" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">BACKUP TO '…'</text>
<text x="362" y="440" text-anchor="middle" font-size="13" font-weight="300" fill="#9AA0A6">online, by SQL</text>
<line x1="665" y1="420" x2="808" y2="420" stroke="#9AA0A6" stroke-width="1.1" marker-end="url(#a)"/>
<text x="737" y="408" text-anchor="middle" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">--restore</text>
<text x="737" y="440" text-anchor="middle" font-size="13" font-weight="300" fill="#9AA0A6">offline, by CdbServe</text>

<text x="1060" y="536" text-anchor="end" font-size="13" fill="#9AA0A6" letter-spacing="1">comando · docs/cdb</text>
</svg>
