<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>From a folder tab to the Changes view to the side-by-side comparison with HEAD</title>
<defs><marker id="fa" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#9AA0A6"/></marker></defs>
<rect width="1100" height="560" fill="#161616"/>
<text x="40" y="42" font-size="13" font-weight="600" fill="#E7C55A" letter-spacing="3">WORKBENCH · FILES AND CHANGES</text>
<text x="40" y="74" font-size="22" font-weight="300" fill="#E8E8E8">A tree shows what changed; two more steps show how</text>

<!-- folder tab -->
<text x="40" y="112" font-size="13" fill="#9AA0A6" letter-spacing="2">1 · A FOLDER TAB (KIT)</text>
<rect x="40" y="124" width="290" height="300" rx="8" fill="#1E1E1E" stroke="#6CC69A" stroke-width="1.2"/>
<g font-size="14">
<text x="56" y="152" fill="#E8E8E8" letter-spacing="1.5">KIT</text><text x="92" y="152" font-size="13" fill="#9AA0A6">a1b2c3d</text><text x="152" y="152" fill="#E7C55A">↗</text>
<text x="56" y="182" fill="#C8C8C8">▾ skills</text><text x="112" y="182" fill="#E7C55A">↗</text>
<text x="80" y="208" fill="#C8C8C8">review.md</text><text x="150" y="208" fill="#E7C55A">↗</text>
<text x="80" y="234" fill="#C8C8C8">release.md</text>
<text x="56" y="260" fill="#C8C8C8">▾ notes</text><text x="112" y="260" fill="#E7C55A">•</text>
<text x="80" y="286" fill="#C8C8C8">new-idea.md</text><text x="166" y="286" fill="#E7C55A">•</text>
<text x="56" y="312" fill="#C8C8C8">▸ hooks</text>
<text x="56" y="338" fill="#C8C8C8">CLAUDE.md</text>
</g>
<line x1="40" y1="384" x2="330" y2="384" stroke="#3A3A3A"/>
<text x="56" y="409" font-size="13" fill="#7A7A7A">Filter by name</text>
<text x="40" y="448" font-size="13" fill="#9AA0A6"><tspan fill="#E7C55A">↗</tspan> differs from HEAD, marked down to the file</text>
<text x="40" y="468" font-size="13" fill="#9AA0A6"><tspan fill="#E7C55A">•</tspan> a new file you have not opened yet</text>

<!-- changes -->
<line x1="330" y1="150" x2="386" y2="150" stroke="#9AA0A6" marker-end="url(#fa)"/>
<text x="390" y="112" font-size="13" fill="#9AA0A6" letter-spacing="2">2 · UNCOMMITTED CHANGES (⌘K)</text>
<rect x="390" y="124" width="300" height="300" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<g font-size="14">
<text x="406" y="152" fill="#E8E8E8">kit</text><text x="430" y="152" font-size="13" fill="#9AA0A6">⎇ main · 3</text>
<text x="406" y="186" font-size="13" fill="#9AA0A6" letter-spacing="1.5">CHANGED</text>
<rect x="398" y="196" width="284" height="26" rx="4" fill="#2A2618"/>
<text x="422" y="214" fill="#F3E3A8">skills/review.md</text><text x="560" y="214" font-size="13" fill="#9AA0A6">modified</text>
<text x="406" y="252" font-size="13" fill="#9AA0A6" letter-spacing="1.5">UNTRACKED</text>
<text x="422" y="278" fill="#C8C8C8">notes/new-idea.md</text>
<text x="406" y="314" font-size="13" fill="#9AA0A6" letter-spacing="1.5">REMOVED</text>
<text x="422" y="340" fill="#C8C8C8">old-plan.md</text>
</g>
<text x="390" y="448" font-size="13" fill="#9AA0A6">A double click on a top row opens it for</text>
<text x="390" y="468" font-size="13" fill="#9AA0A6">that folder. Read every 5 s; it never commits.</text>

<!-- comparison -->
<line x1="690" y1="209" x2="746" y2="209" stroke="#9AA0A6" marker-end="url(#fa)"/>
<text x="750" y="112" font-size="13" fill="#9AA0A6" letter-spacing="2">3 · COMPARE WITH HEAD</text>
<rect x="750" y="124" width="310" height="300" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<line x1="905" y1="124" x2="905" y2="424" stroke="#3A3A3A"/>
<line x1="750" y1="156" x2="1060" y2="156" stroke="#3A3A3A"/>
<text x="766" y="146" font-size="13" fill="#9AA0A6">HEAD</text>
<text x="921" y="146" font-size="13" fill="#9AA0A6">working tree <tspan fill="#E7C55A">● edited</tspan></text>
<g font-family="Menlo, Consolas, monospace" font-size="13">
<text x="766" y="184" fill="#C8C8C8"># Review</text><text x="921" y="184" fill="#C8C8C8"># Review</text>
<rect x="752" y="196" width="152" height="24" fill="#3a2222"/><text x="766" y="213" fill="#E8B0B0">Read the diff.</text>
<rect x="906" y="196" width="152" height="24" fill="#22382d"/><text x="921" y="213" fill="#B0E0C4">Read the spec.</text>
<rect x="906" y="220" width="152" height="24" fill="#22382d"/><text x="921" y="237" fill="#B0E0C4">Then the diff.</text>
<text x="766" y="268" fill="#C8C8C8">Run the tests.</text><text x="921" y="268" fill="#C8C8C8">Run the tests.</text>
</g>
<path d="M904 196 L906 196 L906 244 L904 220 Z" fill="#6CC69A" fill-opacity="0.5"/>
<text x="766" y="330" font-size="13" fill="#9AA0A6">red: lines lost</text>
<text x="921" y="330" font-size="13" fill="#9AA0A6">green: lines gained</text>
<text x="921" y="352" font-size="13" fill="#9AA0A6">this side is an editor</text>
<text x="750" y="448" font-size="13" fill="#9AA0A6">F7 and ⇧F7 step through the differences.</text>
<text x="750" y="468" font-size="13" fill="#9AA0A6">The menu rolls back to HEAD or moves to the Trash.</text>

<line x1="40" y1="496" x2="1060" y2="496" stroke="#2C2C2C"/>
<g font-size="13" fill="#9AA0A6">
<rect x="40" y="519" width="12" height="12" fill="#6CC69A"/><text x="58" y="530">the kit's files</text>
<rect x="170" y="519" width="12" height="12" fill="#6FAEE8"/><text x="188" y="530">comando's views</text>
<rect x="320" y="519" width="12" height="12" fill="#E7C55A"/><text x="338" y="530">git's marks and the selection</text>
<text x="1060" y="530" text-anchor="end">comando · docs/workbench</text>
</g>
</svg>
