<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>A frontear mesh: three broker nodes joined by links, their MQTT clients, and the control pod that configures them</title>
<defs>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#E7C55A" stroke-width="1.4"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#6FAEE8" stroke-width="1.4"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#AEB6C1" stroke-width="1.4"/></marker>
</defs>
<rect width="1100" height="600" fill="#161616"/>
<text x="40" y="44" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">FRONTEAR · THE MESH</text>
<text x="40" y="76" font-size="22" font-weight="300" fill="#E8E8E8">Three brokers, linked into one message fabric</text>

<!-- control pod -->
<rect x="410" y="100" width="280" height="80" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="426" y="124" font-size="13" fill="#9AA0A6" letter-spacing="2">CONTROL POD</text>
<text x="426" y="146" font-size="14" fill="#E8E8E8">holds the private key</text>
<text x="426" y="166" font-size="13" fill="#9AA0A6">signs every request it sends</text>
<path d="M410,140 L190,140 L190,236" fill="none" stroke="#6FAEE8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#b)"/>
<path d="M550,180 L550,236" fill="none" stroke="#6FAEE8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#b)"/>
<path d="M690,140 L910,140 L910,236" fill="none" stroke="#6FAEE8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#b)"/>
<text x="204" y="130" font-size="13" fill="#6FAEE8">signed control messages</text>
<text x="706" y="130" font-size="13" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">$frontear/control/c/…</text>

<!-- nodes -->
<rect x="60" y="240" width="260" height="120" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<text x="76" y="264" font-size="13" fill="#9AA0A6" letter-spacing="2">NODE</text>
<text x="304" y="264" font-size="13" fill="#9AA0A6" text-anchor="end" font-family="Menlo, Consolas, monospace">127.0.0.1:1883</text>
<text x="76" y="298" font-size="24" fill="#E7C55A" font-family="Menlo, Consolas, monospace">a</text>
<text x="76" y="324" font-size="14" fill="#E8E8E8">MQTT 5 broker</text>
<text x="76" y="345" font-size="13" fill="#9AA0A6">one log on disk per link</text>

<rect x="420" y="240" width="260" height="120" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<text x="436" y="264" font-size="13" fill="#9AA0A6" letter-spacing="2">NODE</text>
<text x="664" y="264" font-size="13" fill="#9AA0A6" text-anchor="end" font-family="Menlo, Consolas, monospace">127.0.0.1:1884</text>
<text x="436" y="298" font-size="24" fill="#E7C55A" font-family="Menlo, Consolas, monospace">b</text>
<text x="436" y="324" font-size="14" fill="#E8E8E8">MQTT 5 broker</text>
<text x="436" y="345" font-size="13" fill="#9AA0A6">one log on disk per link</text>

<rect x="780" y="240" width="260" height="120" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<text x="796" y="264" font-size="13" fill="#9AA0A6" letter-spacing="2">NODE</text>
<text x="1024" y="264" font-size="13" fill="#9AA0A6" text-anchor="end" font-family="Menlo, Consolas, monospace">127.0.0.1:1885</text>
<text x="796" y="298" font-size="24" fill="#E7C55A" font-family="Menlo, Consolas, monospace">c</text>
<text x="796" y="324" font-size="14" fill="#E8E8E8">MQTT 5 broker</text>
<text x="796" y="345" font-size="13" fill="#9AA0A6">no link of its own</text>

<!-- links -->
<text x="370" y="226" font-size="13" fill="#E7C55A" letter-spacing="2" text-anchor="middle">LINK b</text>
<text x="370" y="272" font-size="13" fill="#E8E8E8" text-anchor="middle" font-family="Menlo, Consolas, monospace">jobs/#</text>
<line x1="324" y1="284" x2="416" y2="284" stroke="#E7C55A" stroke-width="1.6" marker-end="url(#g)"/>
<line x1="416" y1="320" x2="324" y2="320" stroke="#E7C55A" stroke-width="1.6" marker-end="url(#g)"/>
<text x="370" y="342" font-size="13" fill="#E8E8E8" text-anchor="middle" font-family="Menlo, Consolas, monospace">results/#</text>

<text x="730" y="226" font-size="13" fill="#E7C55A" letter-spacing="2" text-anchor="middle">LINK c</text>
<text x="730" y="272" font-size="13" fill="#E8E8E8" text-anchor="middle" font-family="Menlo, Consolas, monospace">jobs/#</text>
<line x1="684" y1="284" x2="776" y2="284" stroke="#E7C55A" stroke-width="1.6" marker-end="url(#g)"/>
<line x1="776" y1="320" x2="684" y2="320" stroke="#E7C55A" stroke-width="1.6" marker-end="url(#g)"/>
<text x="730" y="342" font-size="13" fill="#E8E8E8" text-anchor="middle" font-family="Menlo, Consolas, monospace">results/#</text>

<!-- clients -->
<line x1="190" y1="440" x2="190" y2="364" stroke="#AEB6C1" stroke-width="1.2" marker-end="url(#c)"/>
<rect x="60" y="440" width="260" height="64" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.2"/>
<text x="76" y="464" font-size="13" fill="#9AA0A6" letter-spacing="2">PUBLISHER</text>
<text x="76" y="488" font-size="13" fill="#E8E8E8">publishes <tspan font-family="Menlo, Consolas, monospace">jobs/1</tspan></text>

<line x1="540" y1="440" x2="540" y2="364" stroke="#AEB6C1" stroke-width="1.2" marker-end="url(#c)"/>
<line x1="560" y1="360" x2="560" y2="436" stroke="#AEB6C1" stroke-width="1.2" marker-end="url(#c)"/>
<rect x="420" y="440" width="260" height="64" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.2"/>
<text x="436" y="464" font-size="13" fill="#9AA0A6" letter-spacing="2">ANY MQTT 5 CLIENT</text>
<text x="436" y="488" font-size="13" fill="#E8E8E8">publishes, subscribes, watches state</text>

<line x1="910" y1="360" x2="910" y2="436" stroke="#AEB6C1" stroke-width="1.2" marker-end="url(#c)"/>
<rect x="780" y="440" width="260" height="64" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.2"/>
<text x="796" y="464" font-size="13" fill="#9AA0A6" letter-spacing="2">SUBSCRIBER</text>
<text x="796" y="488" font-size="13" fill="#E8E8E8">gets <tspan font-family="Menlo, Consolas, monospace">jobs/1</tspan>, two hops later</text>

<text x="40" y="540" font-size="13" fill="#9AA0A6">Each node is a full broker. A link forwards the topics you choose, one list per direction, and keeps them on disk while the peer is away.</text>

<line x1="40" y1="556" x2="1060" y2="556" stroke="#2A2A2A" stroke-width="1"/>
<text x="40" y="580" font-size="13" fill="#9AA0A6">comando · docs/frontear.md</text>
<rect x="470" y="568" width="14" height="14" rx="3" fill="#E7C55A"/><text x="490" y="580" font-size="13" fill="#9AA0A6">frontear node and link</text>
<rect x="680" y="568" width="14" height="14" rx="3" fill="#6FAEE8"/><text x="700" y="580" font-size="13" fill="#9AA0A6">control pod, signed</text>
<rect x="870" y="568" width="14" height="14" rx="3" fill="#AEB6C1"/><text x="890" y="580" font-size="13" fill="#9AA0A6">MQTT clients</text>
</svg>
