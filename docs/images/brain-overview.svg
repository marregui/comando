<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">The brain as a mind map: memory, knowledge base and scratchpad on the left; recall, reflect and budgets on the right; comando, the host, below</title>
  <defs>
    <style>
      .cap{font-size:13px;font-weight:600;letter-spacing:2.5px}
      .h{font-size:21px;font-weight:300;fill:#E8E8E8}
      .s{font-size:14px;fill:#9AA0A6}
      .foot{font-size:13px;fill:#9AA0A6;letter-spacing:.5px}
    </style>
  </defs>
  <rect width="1100" height="720" fill="#161616"/>

  <text x="40" y="44" class="cap" fill="#E7C55A">THE BRAIN · MIND MAP</text>
  <text x="40" y="68" class="s">What an AI assistant keeps between sessions, and what keeps it true.</text>

  <!-- branches -->
  <g fill="none" stroke-width="1.5">
    <path d="M484,316 C440,250 430,150 392,144" stroke="#E7C55A"/>
    <path d="M476,350 L392,344" stroke="#E7C55A"/>
    <path d="M484,384 C440,450 430,540 392,544" stroke="#E7C55A"/>
    <path d="M616,316 C660,250 670,150 708,144" stroke="#D98E5F"/>
    <path d="M624,350 L708,344" stroke="#6CC69A"/>
    <path d="M616,384 C660,450 670,540 708,544" stroke="#6CC69A"/>
    <path d="M550,424 L550,548" stroke="#6FAEE8"/>
  </g>
  <g>
    <circle cx="392" cy="144" r="5" fill="#E7C55A"/>
    <circle cx="392" cy="344" r="5" fill="#E7C55A"/>
    <circle cx="392" cy="544" r="5" fill="#E7C55A"/>
    <circle cx="708" cy="144" r="5" fill="#D98E5F"/>
    <circle cx="708" cy="344" r="5" fill="#6CC69A"/>
    <circle cx="708" cy="544" r="5" fill="#6CC69A"/>
    <circle cx="550" cy="548" r="5" fill="#6FAEE8"/>
  </g>

  <!-- centre -->
  <circle cx="550" cy="350" r="88" fill="none" stroke="#E7C55A" stroke-opacity=".25"/>
  <circle cx="550" cy="350" r="74" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.5"/>
  <text x="550" y="338" text-anchor="middle" class="cap" fill="#E7C55A">THE BRAIN</text>
  <text x="550" y="362" text-anchor="middle" class="s" fill="#E8E8E8">a folder of</text>
  <text x="550" y="382" text-anchor="middle" class="s" fill="#E8E8E8">plain files</text>

  <!-- left: the three stores -->
  <g text-anchor="end">
    <text x="372" y="118" class="cap" fill="#E7C55A">MEMORY</text>
    <text x="372" y="146" class="h">working context</text>
    <text x="372" y="170" class="s">an index, plus one fact per file</text>
    <text x="372" y="190" class="s">four types of fact</text>

    <text x="372" y="318" class="cap" fill="#E7C55A">KNOWLEDGE BASE</text>
    <text x="372" y="346" class="h">checked knowledge</text>
    <text x="372" y="370" class="s">documents kept true against sources</text>
    <text x="372" y="390" class="s">every statement passes a gate</text>

    <text x="372" y="518" class="cap" fill="#E7C55A">SCRATCHPAD</text>
    <text x="372" y="546" class="h">today's work</text>
    <text x="372" y="570" class="s">one day folder, a task index</text>
    <text x="372" y="590" class="s">provisional until checked</text>
  </g>

  <!-- right: what happens to it -->
  <g>
    <text x="728" y="118" class="cap" fill="#D98E5F">RECALL</text>
    <text x="728" y="146" class="h">how it comes back</text>
    <text x="728" y="170" class="s">the index loads at every start</text>
    <text x="728" y="190" class="s">a cue matches, its file opens</text>

    <text x="728" y="318" class="cap" fill="#6CC69A">REFLECT</text>
    <text x="728" y="346" class="h">how it is written</text>
    <text x="728" y="370" class="s">a session becomes memory and</text>
    <text x="728" y="390" class="s">checked knowledge, in six steps</text>

    <text x="728" y="518" class="cap" fill="#6CC69A">BUDGETS</text>
    <text x="728" y="546" class="h">how it stays small</text>
    <text x="728" y="570" class="s">caps on the index and each file</text>
    <text x="728" y="590" class="s">merge or shorten, never drop</text>
  </g>

  <!-- below: the host -->
  <g text-anchor="middle">
    <text x="550" y="578" class="cap" fill="#6FAEE8">COMANDO</text>
    <text x="550" y="606" class="h">the host</text>
    <text x="550" y="630" class="s">finds it, hands it to sessions,</text>
    <text x="550" y="650" class="s">shows it, checkpoints, backs it up</text>
  </g>

  <!-- legend and footer -->
  <line x1="40" y1="676" x2="1060" y2="676" stroke="#2A2A2A"/>
  <circle cx="46" cy="696" r="5" fill="#E7C55A"/><text x="60" y="701" class="foot">brain</text>
  <circle cx="126" cy="696" r="5" fill="#D98E5F"/><text x="140" y="701" class="foot">Claude Code session</text>
  <circle cx="300" cy="696" r="5" fill="#6CC69A"/><text x="314" y="701" class="foot">kit: its rules and skills</text>
  <circle cx="490" cy="696" r="5" fill="#6FAEE8"/><text x="504" y="701" class="foot">comando</text>
  <text x="1060" y="701" text-anchor="end" class="foot">comando · docs/brain</text>
</svg>
