<text x="40" y="548" font-size="14" fill="#E8E8E8">count(*) counts rows. avg(temp) skips the NULL: Oslo is (9.5 + 14.0 + 12.5 + 8.0) / 4 = 11.0. sum(rain) adds 2 + 5 + 1 + 0 + 3 = 11.</text>
