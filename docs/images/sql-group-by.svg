<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="632" viewBox="0 0 1100 632" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>How GROUP BY folds rows: twelve weather rows fall into one bucket per city, and each bucket becomes one result row</title>
<rect width="1100" height="632" fill="#161616"/>
<text x="40" y="44" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">CDB SQL · GROUP BY</text>
<text x="40" y="76" font-size="22" font-weight="300" fill="#E8E8E8">GROUP BY sorts rows into buckets, then folds each bucket into one row.</text>

<rect x="40" y="98" width="1020" height="40" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="56" y="123" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace"><tspan fill="#E7C55A">SELECT</tspan> city, count(*) AS readings, avg(temp) AS avg_temp, sum(rain) AS rain <tspan fill="#E7C55A">FROM</tspan> weather <tspan fill="#E7C55A">GROUP BY</tspan> city</text>

<g font-size="13" fill="#9AA0A6" letter-spacing="2">
<text x="40" y="166">1 · THE ROWS</text><text x="390" y="166">2 · ONE BUCKET PER CITY</text><text x="796" y="166">3 · ONE ROW PER BUCKET</text>
</g>

