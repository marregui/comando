<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>The window as its classes: the SessionsSidebar on the left, the Workspace of editor panels and the SidePane on top, the LowerPanel below them, then the SessionBar, the FindBar and the StatusBar; three JSplitPanes of LayoutKeeper divide the regions</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></linearGradient>
  </defs>
  <rect width="1000" height="620" fill="url(#bg)"/>
  <text x="40" y="44" font-size="13" letter-spacing="3" fill="#E7C55A">MODULE UI · THE WINDOW</text>
  <text x="40" y="78" font-size="24" font-weight="300" fill="#E8E8E8">One frame, seven regions, three dividers you can drag</text>

  <!-- frame -->
  <rect x="40" y="106" width="920" height="424" rx="10" fill="#161616" stroke="#6FAEE8" stroke-width="1.5"/>

  <!-- sidebar -->
  <rect x="48" y="114" width="204" height="322" rx="6" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
  <text x="62" y="142" font-family="Menlo, Consolas, monospace" font-size="15" fill="#6FAEE8">SessionsSidebar</text>
  <text x="62" y="164" font-size="13" fill="#9AA0A6">seven tabs, one row of icons</text>
  <g font-size="13" fill="#E8E8E8">
    <text x="62" y="196">Sessions</text>
    <text x="62" y="220">Connections</text>
    <text x="62" y="244">Kit</text>
    <text x="62" y="268">Brain</text>
    <text x="62" y="292">Scratchpad</text>
    <text x="62" y="316">Logbook</text>
    <text x="62" y="340">Instances</text>
  </g>
  <text x="62" y="376" font-size="13" fill="#9AA0A6">collapses to a rail</text>

  <!-- workspace -->
  <rect x="260" y="114" width="440" height="190" rx="6" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
  <text x="274" y="142" font-family="Menlo, Consolas, monospace" font-size="15" fill="#6FAEE8">Workspace</text>
  <text x="274" y="164" font-size="13" fill="#9AA0A6">the open panels as tabs</text>
  <rect x="274" y="180" width="412" height="110" rx="5" fill="#161616" stroke="#3A3A3A" stroke-width="1"/>
  <text x="288" y="206" font-family="Menlo, Consolas, monospace" font-size="13" fill="#E8E8E8">EditorPanel</text>
  <text x="288" y="230" font-size="13" fill="#9AA0A6">a header, the</text>
  <text x="372" y="230" font-family="Menlo, Consolas, monospace" font-size="13" fill="#E8E8E8">CommandEditor</text>
  <text x="480" y="230" font-size="13" fill="#9AA0A6">and the</text>
  <text x="530" y="230" font-family="Menlo, Consolas, monospace" font-size="13" fill="#E8E8E8">OutlinePane</text>
  <text x="288" y="256" font-size="13" fill="#9AA0A6">SQL, a prompt for Claude, a shell command or Markdown</text>
  <text x="288" y="278" font-size="13" fill="#9AA0A6">you type here; a key sends an intent</text>

  <!-- side pane -->
  <rect x="712" y="114" width="240" height="190" rx="6" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
  <text x="726" y="142" font-family="Menlo, Consolas, monospace" font-size="15" fill="#6FAEE8">SidePane</text>
  <text x="726" y="164" font-size="13" fill="#9AA0A6">the partition on the right:</text>
  <text x="726" y="184" font-size="13" fill="#9AA0A6">panels and views placed beside</text>
  <text x="726" y="216" font-size="13" fill="#E8E8E8">a table, a plot, a diff,</text>
  <text x="726" y="238" font-size="13" fill="#E8E8E8">a Markdown page, an agent</text>
  <text x="726" y="270" font-size="13" fill="#9AA0A6">hidden until something is placed</text>

  <!-- lower panel -->
  <rect x="260" y="316" width="692" height="120" rx="6" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
  <text x="274" y="344" font-family="Menlo, Consolas, monospace" font-size="15" fill="#6FAEE8">LowerPanel</text>
  <text x="274" y="366" font-size="13" fill="#9AA0A6">what the panel in front produced</text>
  <g font-size="13" fill="#E8E8E8">
    <rect x="274" y="382" width="92" height="30" rx="5" fill="#161616" stroke="#3A3A3A"/>
    <text x="320" y="402" text-anchor="middle">Session</text>
    <rect x="374" y="382" width="104" height="30" rx="5" fill="#161616" stroke="#3A3A3A"/>
    <text x="426" y="402" text-anchor="middle">Approvals</text>
    <rect x="486" y="382" width="96" height="30" rx="5" fill="#161616" stroke="#3A3A3A"/>
    <text x="534" y="402" text-anchor="middle">Terminal</text>
    <rect x="590" y="382" width="88" height="30" rx="5" fill="#161616" stroke="#3A3A3A"/>
    <text x="634" y="402" text-anchor="middle">Results</text>
    <rect x="686" y="382" width="150" height="30" rx="5" fill="#161616" stroke="#3A3A3A" stroke-dasharray="4 3"/>
    <text x="761" y="402" text-anchor="middle" fill="#9AA0A6">one tab per view</text>
  </g>

  <!-- bars -->
  <rect x="260" y="444" width="692" height="26" rx="5" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
  <text x="274" y="462" font-family="Menlo, Consolas, monospace" font-size="13" fill="#6FAEE8">SessionBar</text>
  <text x="372" y="462" font-size="13" fill="#9AA0A6">the session of the panel in front: model, effort, context, its buttons</text>
  <rect x="48" y="474" width="904" height="22" rx="5" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
  <text x="62" y="490" font-family="Menlo, Consolas, monospace" font-size="13" fill="#6FAEE8">FindBar</text>
  <text x="372" y="490" font-size="13" fill="#9AA0A6">opens on the view that holds the focus, when that view is Searchable</text>
  <rect x="48" y="500" width="904" height="22" rx="5" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
  <text x="62" y="516" font-family="Menlo, Consolas, monospace" font-size="13" fill="#6FAEE8">StatusBar</text>
  <text x="372" y="516" font-size="13" fill="#9AA0A6">a notice on the left; plan usage and running work on the right</text>

  <!-- dividers -->
  <line x1="256" y1="110" x2="256" y2="470" stroke="#E7C55A" stroke-width="2"/>
  <line x1="706" y1="114" x2="706" y2="304" stroke="#E7C55A" stroke-width="2"/>
  <line x1="260" y1="310" x2="952" y2="310" stroke="#E7C55A" stroke-width="2"/>

  <!-- legend -->
  <line x1="40" y1="560" x2="68" y2="560" stroke="#E7C55A" stroke-width="2"/>
  <text x="78" y="565" font-size="13" fill="#9AA0A6">a JSplitPane of</text>
  <text x="174" y="565" font-family="Menlo, Consolas, monospace" font-size="13" fill="#E8E8E8">LayoutKeeper</text>
  <text x="276" y="565" font-size="13" fill="#9AA0A6">: outer (sidebar | rest), editorAndSide (workspace | side), vertical (top | lower)</text>
  <text x="40" y="598" font-size="13" fill="#9AA0A6">comando · docs/modules/ui.md</text>
</svg>
