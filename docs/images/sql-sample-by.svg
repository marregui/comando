<text x="40" y="446" font-size="13" fill="#9AA0A6" letter-spacing="2">THE ANSWER · ONE ROW PER BUCKET · ts IS THE START OF THE BUCKET</text>
<g fill="#E7C55A" fill-opacity="0.13" stroke="#E7C55A" stroke-width="1.2">
<rect x="204" y="456" width="112" height="48" rx="6"/><rect x="324" y="456" width="112" height="48" rx="6"/><rect x="444" y="456" width="112" height="48" rx="6"/><rect x="684" y="456" width="112" height="48" rx="6"/><rect x="804" y="456" width="112" height="48" rx="6"/>
</g>
<rect x="564" y="456" width="112" height="48" rx="6" fill="none" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="4 4"/>
<g font-size="13" fill="#9AA0A6" text-anchor="middle">
<text x="260" y="475">2 readings</text><text x="380" y="475">3 readings</text><text x="500" y="475">2 readings</text><text x="620" y="485">no row</text><text x="740" y="475">2 readings</text><text x="860" y="475">3 readings</text>
</g>
<g font-size="13" fill="#E8E8E8" text-anchor="middle" font-family="Menlo, Consolas, monospace">
<text x="260" y="495">avg 13.75</text><text x="380" y="495">avg 20.83…</text><text x="500" y="495">avg 19.75</text><text x="740" y="495">avg 13.75</text><text x="860" y="495">avg 24.75</text>
</g>

<text x="40" y="540" font-size="13" fill="#9AA0A6" letter-spacing="2">FILL DECIDES WHAT THE EMPTY BUCKET 2026-06-02 00:00 SHOWS</text>
<g fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1">
<rect x="40" y="550" width="196" height="54" rx="8"/><rect x="246" y="550" width="196" height="54" rx="8"/><rect x="452" y="550" width="196" height="54" rx="8"/><rect x="658" y="550" width="196" height="54" rx="8"/><rect x="864" y="550" width="196" height="54" rx="8"/>
</g>
<g font-size="13" fill="#E7C55A" font-family="Menlo, Consolas, monospace">
<text x="54" y="572">FILL(NONE)</text><text x="260" y="572">FILL(NULL)</text><text x="466" y="572">FILL(PREV)</text><text x="672" y="572">FILL(LINEAR)</text><text x="878" y="572">FILL(0)</text>
</g>
<g font-size="13" fill="#E8E8E8">
<text x="54" y="592">no row, the default</text><text x="260" y="592">a row with NULL</text><text x="466" y="592">the bucket before: 19.75</text><text x="672" y="592">halfway between: 16.75</text><text x="878" y="592">the constant: 0.0</text>
</g>

