<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>A message crossing a frontear link: logged and forced before the publisher is acknowledged, sent from the cursor, trimmed once the peer acknowledges</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#9AA0A6" stroke-width="1.4"/></marker></defs>
<rect width="1100" height="640" fill="#161616"/>
<text x="40" y="44" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">MODULE · FRONTEAR · A LINK</text>
<text x="40" y="76" font-size="22" font-weight="300" fill="#E8E8E8">On disk before "received", off disk after the peer's "got it"</text>

<text x="40" y="116" font-size="13" fill="#9AA0A6" letter-spacing="2">FIRST: FROM THE PUBLISHER TO THE LOG</text>
<rect x="40" y="128" width="236" height="92" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.2"/>
<text x="56" y="154" font-size="13" fill="#9AA0A6" letter-spacing="2">1 · PUBLISH</text>
<text x="56" y="178" font-size="14" fill="#AEB6C1">a client, QoS 1</text>
<text x="56" y="202" font-size="13" fill="#9AA0A6">to the local broker</text>
<line x1="276" y1="174" x2="298" y2="174" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="302" y="128" width="236" height="92" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="318" y="154" font-size="13" fill="#9AA0A6" letter-spacing="2">2 · MATCH</text>
<text x="318" y="178" font-size="14" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">TopicTree</text>
<text x="318" y="202" font-size="13" fill="#E8E8E8">finds subscriber $link/&lt;id&gt;</text>
<line x1="538" y1="174" x2="560" y2="174" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="564" y="128" width="236" height="92" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<text x="580" y="154" font-size="13" fill="#9AA0A6" letter-spacing="2">3 · APPEND</text>
<text x="580" y="178" font-size="14" fill="#E7C55A" font-family="Menlo, Consolas, monospace">LinkLog</text>
<text x="580" y="202" font-size="13" fill="#E8E8E8">hop count + 1, into a round</text>
<line x1="800" y1="174" x2="822" y2="174" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="826" y="128" width="234" height="92" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<text x="842" y="154" font-size="13" fill="#9AA0A6" letter-spacing="2">4 · FORCE</text>
<text x="842" y="178" font-size="14" fill="#E7C55A" font-family="Menlo, Consolas, monospace">LogForcer</text>
<text x="842" y="202" font-size="13" fill="#E8E8E8">writes the round, forces it</text>

<path d="M943,220 L943,246 L158,246 L158,225" fill="none" stroke="#9AA0A6" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="550" y="264" font-size="13" fill="#E8E8E8" text-anchor="middle">5 · the publisher's PUBACK leaves only now, reason 0x00</text>

<text x="40" y="312" font-size="13" fill="#9AA0A6" letter-spacing="2">THEN: FROM THE LOG TO THE PEER</text>
<rect x="40" y="324" width="236" height="92" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="56" y="350" font-size="13" fill="#9AA0A6" letter-spacing="2">6 · READ</text>
<text x="56" y="374" font-size="14" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">Link</text>
<text x="56" y="398" font-size="13" fill="#E8E8E8">from the cursor, a window</text>
<line x1="276" y1="370" x2="298" y2="370" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="302" y="324" width="236" height="92" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="318" y="350" font-size="13" fill="#9AA0A6" letter-spacing="2">7 · SEND</text>
<text x="318" y="374" font-size="14" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">MqttClient</text>
<text x="318" y="398" font-size="13" fill="#E8E8E8">PUBLISH at QoS 1</text>
<line x1="538" y1="370" x2="560" y2="370" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="564" y="324" width="236" height="92" rx="8" fill="#1E1E1E" stroke="#AEB6C1" stroke-width="1.2"/>
<text x="580" y="350" font-size="13" fill="#9AA0A6" letter-spacing="2">8 · PEER</text>
<text x="580" y="374" font-size="14" fill="#AEB6C1">the peer's broker</text>
<text x="580" y="398" font-size="13" fill="#9AA0A6">answers with a PUBACK</text>
<line x1="800" y1="370" x2="822" y2="370" stroke="#9AA0A6" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="826" y="324" width="234" height="92" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<text x="842" y="350" font-size="13" fill="#9AA0A6" letter-spacing="2">9 · TRIM</text>
<text x="842" y="374" font-size="14" fill="#E7C55A" font-family="Menlo, Consolas, monospace">cursor</text>
<text x="842" y="398" font-size="13" fill="#E8E8E8">moves past what is acknowledged</text>

<text x="40" y="466" font-size="13" fill="#9AA0A6" letter-spacing="2">THE LOG OF ONE LINK</text>
<rect x="40" y="480" width="250" height="52" rx="6" fill="#1E1E1E" stroke="#3A3A3A" stroke-dasharray="5 4"/>
<rect x="296" y="480" width="250" height="52" rx="6" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.4"/>
<rect x="552" y="480" width="250" height="52" rx="6" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.4"/>
<rect x="808" y="480" width="252" height="52" rx="6" fill="#2A2618" stroke="#E7C55A" stroke-width="1.4"/>
<text x="165" y="511" font-size="13" fill="#9AA0A6" text-anchor="middle">a segment below the cursor</text>
<text x="440" y="511" font-size="13" fill="#E8E8E8" text-anchor="middle">a sealed segment</text>
<text x="677" y="511" font-size="13" fill="#E8E8E8" text-anchor="middle">a sealed segment</text>
<text x="900" y="511" font-size="13" fill="#E8E8E8" text-anchor="middle">the open segment</text>
<line x1="320" y1="470" x2="320" y2="542" stroke="#6FAEE8" stroke-width="2"/>
<text x="320" y="562" font-size="13" fill="#6FAEE8" text-anchor="middle">cursor</text>
<line x1="1010" y1="470" x2="1010" y2="542" stroke="#6FAEE8" stroke-width="2"/>
<text x="1010" y="562" font-size="13" fill="#6FAEE8" text-anchor="middle">tail</text>
<text x="165" y="562" font-size="13" fill="#9AA0A6" text-anchor="middle">deleted by the forcer</text>
<text x="695" y="562" font-size="13" fill="#9AA0A6" text-anchor="middle">waiting: resent after a lost connection</text>

<rect x="600" y="604" width="14" height="14" rx="3" fill="#E7C55A"/><text x="620" y="616" font-size="13" fill="#9AA0A6">on disk</text>
<rect x="700" y="604" width="14" height="14" rx="3" fill="#6FAEE8"/><text x="720" y="616" font-size="13" fill="#9AA0A6">frontear's classes</text>
<rect x="870" y="604" width="14" height="14" rx="3" fill="#AEB6C1"/><text x="890" y="616" font-size="13" fill="#9AA0A6">other processes</text>
<text x="40" y="616" font-size="13" fill="#9AA0A6">comando · docs/modules/frontear</text>
</svg>
