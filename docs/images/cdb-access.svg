<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The four checks a request passes before cdb runs it</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></radialGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E7C55A"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA0A6"/></marker>
</defs>
<rect width="1100" height="500" fill="url(#bg)"/>
<text x="40" y="46" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">CDB · ACCESS</text>
<text x="40" y="78" font-size="24" font-weight="300" fill="#E8E8E8">Four checks stand between a request and your data</text>

<!-- brackets -->
<line x1="130" y1="124" x2="560" y2="124" stroke="#3A3A3A" stroke-width="1"/>
<text x="130" y="114" font-size="13" fill="#9AA0A6" letter-spacing="2">HTTP ONLY</text>
<line x1="590" y1="124" x2="1020" y2="124" stroke="#3A3A3A" stroke-width="1"/>
<text x="590" y="114" font-size="13" fill="#9AA0A6" letter-spacing="2">HTTP AND THE POSTGRESQL WIRE</text>

<text x="40" y="191" font-size="13" fill="#E8E8E8">a request</text>
<line x1="102" y1="186" x2="128" y2="186" stroke="#E7C55A" stroke-width="1.3" marker-end="url(#a)"/>

<!-- gates -->
<rect x="130" y="140" width="200" height="94" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.2"/>
<text x="146" y="167" font-size="15" fill="#E7C55A">1 · Origin</text>
<text x="146" y="191" font-size="13" font-weight="300" fill="#C9CDD2">Does a browser page send</text>
<text x="146" y="210" font-size="13" font-weight="300" fill="#C9CDD2">this request?</text>

<rect x="360" y="140" width="200" height="94" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.2"/>
<text x="376" y="167" font-size="15" fill="#E7C55A">2 · Host</text>
<text x="376" y="191" font-size="13" font-weight="300" fill="#C9CDD2">Is it addressed to this</text>
<text x="376" y="210" font-size="13" font-weight="300" fill="#C9CDD2">machine's own address?</text>

<rect x="590" y="140" width="200" height="94" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.2"/>
<text x="606" y="167" font-size="15" fill="#E7C55A">3 · Secret</text>
<text x="606" y="191" font-size="13" font-weight="300" fill="#C9CDD2">Does it carry one of the</text>
<text x="606" y="210" font-size="13" font-weight="300" fill="#C9CDD2">two secrets?</text>

<rect x="820" y="140" width="200" height="94" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.2"/>
<text x="836" y="167" font-size="15" fill="#E7C55A">4 · Role</text>
<text x="836" y="191" font-size="13" font-weight="300" fill="#C9CDD2">May this secret do what</text>
<text x="836" y="210" font-size="13" font-weight="300" fill="#C9CDD2">the request asks?</text>

<line x1="330" y1="186" x2="358" y2="186" stroke="#E7C55A" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="560" y1="186" x2="588" y2="186" stroke="#E7C55A" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="790" y1="186" x2="818" y2="186" stroke="#E7C55A" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="1020" y1="186" x2="1046" y2="186" stroke="#E7C55A" stroke-width="1.3" marker-end="url(#a)"/>
<text x="1052" y="191" font-size="13" fill="#E7C55A">runs</text>

<!-- refusals -->
<g stroke="#9AA0A6" stroke-width="1.1">
<line x1="230" y1="234" x2="230" y2="276" marker-end="url(#r)"/>
<line x1="460" y1="234" x2="460" y2="276" marker-end="url(#r)"/>
<line x1="690" y1="234" x2="690" y2="276" marker-end="url(#r)"/>
<line x1="920" y1="234" x2="920" y2="276" marker-end="url(#r)"/>
</g>
<g fill="#1A1A1A" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="4 3">
<rect x="130" y="280" width="200" height="70" rx="8"/>
<rect x="360" y="280" width="200" height="70" rx="8"/>
<rect x="590" y="280" width="200" height="70" rx="8"/>
<rect x="820" y="280" width="200" height="70" rx="8"/>
</g>
<text x="146" y="306" font-size="15" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">403</text>
<text x="146" y="330" font-size="13" font-weight="300" fill="#9AA0A6">any Origin header</text>
<text x="376" y="306" font-size="15" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">403</text>
<text x="376" y="330" font-size="13" font-weight="300" fill="#9AA0A6">another Host name</text>
<text x="606" y="306" font-size="15" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">401 · 28P01</text>
<text x="606" y="330" font-size="13" font-weight="300" fill="#9AA0A6">no secret, or a wrong one</text>
<text x="836" y="306" font-size="15" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">403 · 42501</text>
<text x="836" y="330" font-size="13" font-weight="300" fill="#9AA0A6">read-only asks for a change</text>

<!-- roles -->
<rect x="130" y="384" width="430" height="60" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="146" y="409" font-size="14" fill="#E7C55A" font-family="Menlo, Consolas, monospace">secret</text>
<text x="206" y="409" font-size="13" fill="#9AA0A6">the owner</text>
<text x="146" y="430" font-size="13" font-weight="300" fill="#C9CDD2">every statement, and line-protocol writes</text>
<rect x="590" y="384" width="430" height="60" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="606" y="409" font-size="14" fill="#E7C55A" font-family="Menlo, Consolas, monospace">secret.readonly</text>
<text x="742" y="409" font-size="13" fill="#9AA0A6">a reader</text>
<text x="606" y="430" font-size="13" font-weight="300" fill="#C9CDD2">SELECT, SHOW and EXPLAIN only</text>

<text x="1060" y="478" text-anchor="end" font-size="13" fill="#9AA0A6" letter-spacing="1">comando · docs/cdb</text>
</svg>
