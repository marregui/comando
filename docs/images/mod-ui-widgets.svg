<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="656" viewBox="0 0 1000 656" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>The kit of widgets: the state names a view by its type, the WidgetRegistry maps each of the eleven types to the widget class that draws it, and every widget keeps the same three-method contract plus optional capabilities for find, copy, export and zoom</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9AA0A6" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="656" fill="url(#bg)"/>
  <text x="40" y="44" font-size="13" letter-spacing="3" fill="#E7C55A">MODULE UI · THE KIT OF WIDGETS</text>
  <text x="40" y="78" font-size="24" font-weight="300" fill="#E8E8E8">The state names a view; the registry finds who draws it</text>

  <text x="40" y="118" font-size="13" letter-spacing="2" fill="#9AA0A6">VIEW TYPE IN THE STATE</text>
  <text x="620" y="118" font-size="13" letter-spacing="2" fill="#9AA0A6">WIDGET CLASS THAT DRAWS IT</text>

  <!-- registry -->
  <rect x="330" y="132" width="200" height="340" rx="10" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.5"/>
  <text x="430" y="290" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" fill="#E7C55A">WidgetRegistry</text>
  <text x="430" y="316" text-anchor="middle" font-size="13" fill="#9AA0A6">one factory per type,</text>
  <text x="430" y="334" text-anchor="middle" font-size="13" fill="#9AA0A6">registered once</text>

  <g stroke="#3A3A3A" stroke-width="1">
    <line x1="180" y1="152" x2="328" y2="152"/><line x1="180" y1="182" x2="328" y2="182"/><line x1="180" y1="212" x2="328" y2="212"/>
    <line x1="180" y1="242" x2="328" y2="242"/><line x1="180" y1="272" x2="328" y2="272"/><line x1="180" y1="302" x2="328" y2="302"/>
    <line x1="180" y1="332" x2="328" y2="332"/><line x1="180" y1="362" x2="328" y2="362"/><line x1="180" y1="392" x2="328" y2="392"/>
    <line x1="180" y1="422" x2="328" y2="422"/><line x1="180" y1="452" x2="328" y2="452"/>
  </g>
  <g stroke="#9AA0A6" stroke-width="1.2">
    <line x1="532" y1="152" x2="610" y2="152" marker-end="url(#ar)"/><line x1="532" y1="182" x2="610" y2="182" marker-end="url(#ar)"/>
    <line x1="532" y1="212" x2="610" y2="212" marker-end="url(#ar)"/><line x1="532" y1="242" x2="610" y2="242" marker-end="url(#ar)"/>
    <line x1="532" y1="272" x2="610" y2="272" marker-end="url(#ar)"/><line x1="532" y1="302" x2="610" y2="302" marker-end="url(#ar)"/>
    <line x1="532" y1="332" x2="610" y2="332" marker-end="url(#ar)"/><line x1="532" y1="362" x2="610" y2="362" marker-end="url(#ar)"/>
    <line x1="532" y1="392" x2="610" y2="392" marker-end="url(#ar)"/><line x1="532" y1="422" x2="610" y2="422" marker-end="url(#ar)"/>
    <line x1="532" y1="452" x2="610" y2="452" marker-end="url(#ar)"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#E8E8E8">
    <text x="40" y="157">table</text><text x="40" y="187">plot</text><text x="40" y="217">diff</text><text x="40" y="247">markdown</text>
    <text x="40" y="277">text</text><text x="40" y="307">tree</text><text x="40" y="337">search</text><text x="40" y="367">console</text>
    <text x="40" y="397">agent</text><text x="40" y="427">deliverables</text><text x="40" y="457">changes</text>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#6FAEE8">
    <text x="620" y="157">TableViewWidget</text><text x="620" y="187">PlotWidget</text><text x="620" y="217">DiffWidget</text><text x="620" y="247">MarkdownWidget</text>
    <text x="620" y="277">TextWidget</text><text x="620" y="307">TreeWidget</text><text x="620" y="337">SearchWidget</text><text x="620" y="367">ConsoleWidget</text>
    <text x="620" y="397">AgentWidget</text><text x="620" y="427">DeliverablesWidget</text><text x="620" y="457">ChangesWidget</text>
  </g>
  <g font-size="13" fill="#9AA0A6">
    <text x="790" y="157">rows in a grid</text><text x="790" y="187">series on a canvas</text><text x="790" y="217">two texts compared</text><text x="790" y="247">a rendered page</text>
    <text x="790" y="277">plain text</text><text x="790" y="307">a tree of nodes</text><text x="790" y="337">the hits of a search</text><text x="790" y="367">a command's output</text>
    <text x="790" y="397">a subagent's work</text><text x="790" y="427">files a session wrote</text><text x="790" y="457">a repository's changes</text>
  </g>

  <!-- contract -->
  <text x="40" y="512" font-size="13" letter-spacing="2" fill="#9AA0A6">THE CONTRACT: Widget&lt;V&gt;</text>
  <text x="520" y="512" font-size="13" letter-spacing="2" fill="#9AA0A6">CAPABILITIES A WIDGET MAY ADD</text>
  <line x1="40" y1="524" x2="960" y2="524" stroke="#3A3A3A" stroke-width="1"/>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#E8E8E8">
    <text x="40" y="552">component()</text>
    <text x="40" y="576">render(view)</text>
    <text x="40" y="600">unmount()</text>
    <text x="520" y="552">Searchable</text>
    <text x="520" y="576">Copyable</text>
    <text x="740" y="552">Exportable</text>
    <text x="740" y="576">Zoomable</text>
  </g>
  <g font-size="13" fill="#9AA0A6">
    <text x="160" y="552">the Swing component to place</text>
    <text x="160" y="576">show exactly this view, on the EDT</text>
    <text x="160" y="600">let go of timers and listeners</text>
    <text x="620" y="552">find</text>
    <text x="620" y="576">copy</text>
    <text x="840" y="552">save to a file</text>
    <text x="840" y="576">bigger, smaller</text>
  </g>
  <text x="40" y="636" font-size="13" fill="#9AA0A6">comando · docs/modules/ui.md</text>
</svg>
