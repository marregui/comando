<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A session's life as a timeline: what it reads from the brain at start, at a prompt, during the work and at the checkpoint, and what it writes back</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#E7C55A"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#D98E5F"/></marker>
    <style>
      .cap{font-size:13px;font-weight:600;letter-spacing:2.5px}
      .t{font-size:15px;fill:#E8E8E8}
      .s{font-size:14px;fill:#9AA0A6}
      .foot{font-size:13px;fill:#9AA0A6;letter-spacing:.5px}
    </style>
  </defs>
  <rect width="1100" height="540" fill="#161616"/>

  <text x="40" y="44" class="cap" fill="#E7C55A">RECALL · ONE SESSION, FOUR MOMENTS</text>
  <text x="40" y="68" class="s">Reads come down from the brain. Writes go back into it. Little is read until it is needed.</text>

  <!-- the brain, read -->
  <rect x="40" y="92" width="1020" height="42" rx="6" fill="#1E1E1E" stroke="#E7C55A" stroke-opacity=".7"/>
  <text x="550" y="118" text-anchor="middle" class="cap" fill="#E7C55A">THE BRAIN · WHAT THE SESSION READS</text>

  <!-- read arrows -->
  <g stroke="#E7C55A" stroke-width="1.5" fill="none">
    <line x1="90" y1="134" x2="90" y2="254" marker-end="url(#g)"/>
    <line x1="345" y1="134" x2="345" y2="254" marker-end="url(#g)"/>
    <line x1="600" y1="134" x2="600" y2="254" marker-end="url(#g)"/>
    <line x1="855" y1="134" x2="855" y2="254" marker-end="url(#g)"/>
  </g>
  <text x="104" y="180" class="t">the memory index,</text>
  <text x="104" y="200" class="t">whole</text>
  <text x="359" y="180" class="t">the memory files</text>
  <text x="359" y="200" class="t">whose cue matches</text>
  <text x="614" y="180" class="t">KB documents by title,</text>
  <text x="614" y="200" class="t">today's open tasks</text>
  <text x="869" y="180" class="t">the index and the files</text>
  <text x="869" y="200" class="t">this session touched</text>

  <!-- the session's timeline -->
  <line x1="60" y1="270" x2="1052" y2="270" stroke="#D98E5F" stroke-width="2" marker-end="url(#o)"/>
  <g fill="#161616" stroke="#D98E5F" stroke-width="2">
    <circle cx="90" cy="270" r="8"/>
    <circle cx="345" cy="270" r="8"/>
    <circle cx="600" cy="270" r="8"/>
    <circle cx="855" cy="270" r="8"/>
  </g>
  <text x="104" y="300" class="cap" fill="#D98E5F">1 · START</text>
  <text x="104" y="322" class="s">Claude Code loads it</text>
  <text x="359" y="300" class="cap" fill="#D98E5F">2 · A PROMPT</text>
  <text x="359" y="322" class="s">on cue, never all of them</text>
  <text x="614" y="300" class="cap" fill="#D98E5F">3 · THE WORK</text>
  <text x="614" y="322" class="s">tools read and write files</text>
  <text x="869" y="300" class="cap" fill="#D98E5F">4 · THE CHECKPOINT</text>
  <text x="869" y="322" class="s">/reflect, then /compact</text>

  <!-- write arrows -->
  <g stroke="#D98E5F" stroke-width="1.5" fill="none">
    <line x1="600" y1="278" x2="600" y2="420" marker-end="url(#o)"/>
    <line x1="855" y1="278" x2="855" y2="420" marker-end="url(#o)"/>
  </g>
  <text x="614" y="366" class="t">task output and reports,</text>
  <text x="614" y="386" class="t">into the scratchpad</text>
  <text x="869" y="366" class="t">memory rewritten, KB</text>
  <text x="869" y="386" class="t">corrected, indexes kept</text>
  <text x="104" y="376" class="s">nothing is written at start</text>
  <text x="359" y="376" class="s">nothing is written by a prompt</text>

  <!-- the brain, written -->
  <rect x="40" y="426" width="1020" height="42" rx="6" fill="#1E1E1E" stroke="#E7C55A" stroke-opacity=".7"/>
  <text x="550" y="452" text-anchor="middle" class="cap" fill="#E7C55A">THE BRAIN · WHAT THE SESSION WRITES · THE NEXT SESSION STARTS FROM HERE</text>

  <line x1="40" y1="496" x2="1060" y2="496" stroke="#2A2A2A"/>
  <circle cx="46" cy="516" r="5" fill="#E7C55A"/><text x="60" y="521" class="foot">brain</text>
  <circle cx="126" cy="516" r="5" fill="#D98E5F"/><text x="140" y="521" class="foot">Claude Code session</text>
  <text x="1060" y="521" text-anchor="end" class="foot">comando · docs/brain</text>
</svg>
