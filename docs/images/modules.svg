<text x="574" y="638" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >state, intents, reducer, effects, ports, thread kit</text>
<text x="574" y="657" text-anchor="start" font-size="12" font-weight="300" fill="#9A9A9A" font-family="Menlo, monospace" >the JDK only</text>
<line x1="1100" y1="188" x2="1150" y2="188" stroke="#9A9A9A" stroke-width="1.1" marker-end="url(#a)"/>
<path d="M1100,188 H1560 V638 H1042" fill="none" stroke="#9A9A9A" stroke-width="1.1" marker-end="url(#a)"/>
<text x="1552" y="300" text-anchor="end" font-size="13" font-weight="300" fill="#BDBDBD" stroke="#171717" stroke-width="5" paint-order="stroke" stroke-linejoin="round" >app → core</text>
<text x="60" y="716" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >ui depends on core only; mcp stays apart from db, so every route from Claude to the database passes QueryPort.</text>
<text x="60" y="736" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >Dashed: testkit is test scope only, taken by every module's tests.</text>
<text x="60" y="780" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >Gold: the centre every module depends on. Blue: comando's modules. Grey: outside libraries.</text>
<text x="1540" y="780" text-anchor="end" font-size="13" font-weight="300" fill="#8E8E8E" >comando · docs/architecture</text>
