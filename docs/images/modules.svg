<text x="514" y="188" text-anchor="start" font-size="13" font-weight="300" fill="#BDBDBD" >wiring, store files, keychain, intent log, embedded QuestDB, the comando Edge, main</text>
<text x="514" y="207" text-anchor="start" font-size="12" font-weight="300" fill="#9A9A9A" font-family="Menlo, monospace" >every module · Jackson · QuestDB · HiveMQ MQTT client</text>
