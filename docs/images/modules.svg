<text x="60" y="52" text-anchor="start" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">ARCHITECTURE · MODULES</text>
<text x="60" y="84" text-anchor="start" font-size="24" font-weight="300" fill="#F2F2F2" >Eight Gradle modules and what each depends on</text>
