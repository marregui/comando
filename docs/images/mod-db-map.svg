<text x="554" y="194">db-local</text>
<text x="554" y="236">db-staging</text>
<text x="554" y="278">db-reports</text>
</g>
<g font-size="13" fill="#9AA0A6">
<text x="690" y="194">1 strand · 1 JDBC connection</text>
<text x="690" y="236">1 strand · 1 JDBC connection</text>
<text x="690" y="278">1 strand · 1 JDBC connection</text>
</g>
<text x="540" y="320" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">db-timer</text>
<text x="620" y="320" font-size="13" fill="#9AA0A6">health checks, cancel escalation</text>

<rect x="980" y="124" width="172" height="230" rx="8" fill="#1E1E1E" stroke="#9AA0A6" stroke-width="1.2"/>
<text x="996" y="152" font-size="13" fill="#9AA0A6" letter-spacing="2">SERVERS</text>
<text x="996" y="186" font-size="14" fill="#E8E8E8">QuestDB</text>
<text x="996" y="210" font-size="14" fill="#E8E8E8">PostgreSQL</text>
<text x="996" y="246" font-size="13" fill="#9AA0A6">reached through</text>
<text x="996" y="266" font-size="13" fill="#9AA0A6">the PostgreSQL</text>
<text x="996" y="286" font-size="13" fill="#9AA0A6">JDBC driver</text>

<rect x="520" y="400" width="400" height="180" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="540" y="430" font-size="16" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">CdbAdapter</text>
<text x="676" y="430" font-size="13" fill="#9AA0A6">a strand per connection name</text>
