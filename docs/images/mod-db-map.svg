<text x="64" y="360" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">QueryPort</text>

<rect x="262" y="270" width="200" height="130" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="278" y="302" font-size="16" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">DbRouter</text>
<text x="278" y="336" font-size="14" fill="#E8E8E8">asks one question:</text>
<text x="278" y="360" font-size="14" fill="#E8E8E8">is the host cdb?</text>

<rect x="520" y="124" width="400" height="230" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="540" y="154" font-size="16" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">DbAdapter</text>
<text x="668" y="154" font-size="13" fill="#9AA0A6">a lane per connection name</text>
