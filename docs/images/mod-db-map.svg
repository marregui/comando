<rect width="1200" height="690" fill="url(#bg)"/>
<text x="48" y="48" font-size="13" fill="#E7C55A" letter-spacing="3">MODULE · DB</text>
<text x="48" y="82" font-size="24" font-weight="300" fill="#E8E8E8">One door for SQL, two kinds of database behind it</text>

<rect x="48" y="270" width="170" height="130" rx="8" fill="#1E1E1E" stroke="#E7C55A" stroke-width="1.6"/>
<text x="64" y="302" font-size="20" font-weight="300" fill="#E7C55A">core</text>
