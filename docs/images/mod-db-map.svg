<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>db: the router sends each connection to a JDBC lane or to an in-process cdb strand</title>
<defs>
