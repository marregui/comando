<text x="554" y="470">cdb-notes</text>
<text x="554" y="512">cdb-metrics</text>
</g>
<g font-size="13" fill="#9AA0A6">
<text x="690" y="470">runs one statement at a time</text>
<text x="690" y="512">runs one statement at a time</text>
</g>
<text x="540" y="556" font-size="13" fill="#9AA0A6">Two connections on one folder share one open database.</text>

<rect x="980" y="400" width="172" height="180" rx="8" fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2"/>
<text x="996" y="430" font-size="16" fill="#6FAEE8">cdb</text>
<text x="996" y="462" font-size="14" fill="#E8E8E8">comando's own</text>
<text x="996" y="484" font-size="14" fill="#E8E8E8">database</text>
<text x="996" y="518" font-size="13" fill="#9AA0A6">inside this process,</text>
<text x="996" y="538" font-size="13" fill="#9AA0A6">a folder on disk</text>

