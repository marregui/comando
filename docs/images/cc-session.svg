<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>A session's life as a state machine: CLOSED, start, OPENING, init, OPEN (idle and turn running, a prompt starts a turn and a result ends it), stop, CLOSING, the process exits, CLOSED again; a process that cannot start or ends by itself with an exit code other than 0 is FAILED, and a start opens it again. Stop, step by step: interrupt and close stdin, SIGTERM after 3 seconds, SIGKILL 2 seconds later</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#1B1B1B"/><stop offset="1" stop-color="#121212"/></radialGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9AA0A6" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="540" fill="url(#bg)"/>
  <text x="40" y="44" font-size="13" letter-spacing="3" fill="#E7C55A">A SESSION'S LIFE</text>
  <text x="40" y="78" font-size="24" font-weight="300" fill="#E8E8E8">Five states, one process behind them</text>

  <g fill="#1E1E1E" stroke-width="1.3">
    <rect x="40" y="140" width="150" height="60" rx="8" stroke="#6FAEE8"/>
    <rect x="240" y="140" width="150" height="60" rx="8" stroke="#6FAEE8"/>
    <rect x="440" y="112" width="300" height="116" rx="8" stroke="#E7C55A" stroke-width="2"/>
    <rect x="790" y="140" width="170" height="60" rx="8" stroke="#6FAEE8"/>
    <rect x="240" y="300" width="150" height="60" rx="8" stroke="#9AA0A6" stroke-dasharray="5 4"/>
  </g>
  <g fill="#161616" stroke="#D98E5F" stroke-width="1">
    <rect x="456" y="158" width="110" height="52" rx="6"/>
    <rect x="614" y="158" width="110" height="52" rx="6"/>
  </g>
  <g font-size="13" letter-spacing="2">
    <text x="115" y="166" text-anchor="middle" fill="#6FAEE8">CLOSED</text>
    <text x="315" y="166" text-anchor="middle" fill="#6FAEE8">OPENING</text>
    <text x="456" y="138" fill="#E7C55A">OPEN</text>
    <text x="875" y="166" text-anchor="middle" fill="#6FAEE8">CLOSING</text>
    <text x="315" y="326" text-anchor="middle" fill="#E8E8E8">FAILED</text>
  </g>
  <g font-size="13" fill="#9AA0A6" text-anchor="middle">
    <text x="115" y="186">no process</text>
    <text x="315" y="186">claude -p starts</text>
    <text x="875" y="186">the stop sequence</text>
    <text x="315" y="346">the error is kept</text>
  </g>
  <g font-size="14" fill="#E8E8E8" text-anchor="middle">
    <text x="511" y="189">idle</text>
    <text x="669" y="189">turn running</text>
  </g>

  <g stroke="#9AA0A6" stroke-width="1.3" fill="none" marker-end="url(#a)">
    <path d="M190 170 H238"/>
    <path d="M390 170 H438"/>
    <path d="M740 170 H788"/>
    <path d="M566 174 H612"/>
    <path d="M614 196 H568"/>
    <path d="M875 200 V400 H115 V202"/>
    <path d="M285 200 V298"/>
    <path d="M345 300 V202"/>
    <path d="M520 228 V330 H392"/>
  </g>
  <g font-size="13" fill="#E8E8E8">
    <text x="214" y="160" text-anchor="middle">start</text>
    <text x="414" y="160" text-anchor="middle">init</text>
    <text x="764" y="160" text-anchor="middle">stop</text>
    <text x="590" y="152" text-anchor="middle">prompt</text>
    <text x="590" y="224" text-anchor="middle">result</text>
    <text x="277" y="255" text-anchor="end">cannot start</text>
    <text x="353" y="255">start</text>
    <text x="530" y="270">the process ends by itself,</text>
    <text x="530" y="288">exit code not 0</text>
    <text x="500" y="392" text-anchor="middle">the process exits after a stop, or with exit code 0</text>
  </g>

  <text x="40" y="446" font-size="13" letter-spacing="3" fill="#E7C55A">STOP, STEP BY STEP</text>
  <path d="M40 484 H960" stroke="#9AA0A6" stroke-width="1.2"/>
  <g fill="#D98E5F">
    <circle cx="60" cy="484" r="5"/>
    <circle cx="460" cy="484" r="5"/>
    <circle cx="760" cy="484" r="5"/>
  </g>
  <g font-size="13" fill="#E8E8E8">
    <text x="60" y="470">interrupt, then close stdin</text>
    <text x="460" y="470">SIGTERM</text>
    <text x="760" y="470">SIGKILL</text>
  </g>
  <g font-size="13" fill="#9AA0A6">
    <text x="260" y="506" text-anchor="middle">3 s to end by itself</text>
    <text x="610" y="506" text-anchor="middle">2 s more</text>
    <text x="960" y="526" text-anchor="end">comando · docs/claude-code.md</text>
  </g>
</svg>
