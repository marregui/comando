<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The Sessions tab: rows grouped by what each session asks of you, and the marks on a row</title>
<rect width="1000" height="600" fill="#161616"/>
<text x="40" y="42" font-size="13" font-weight="600" fill="#E7C55A" letter-spacing="3">WORKBENCH · THE SESSIONS TAB</text>
<text x="40" y="74" font-size="22" font-weight="300" fill="#E8E8E8">Rows sorted by what each session asks of you</text>

<!-- sidebar mock -->
<rect x="40" y="100" width="330" height="440" rx="8" fill="#1B1B1B" stroke="#3A3A3A"/>
<g font-size="13" text-anchor="middle">
<rect x="54" y="112" width="26" height="22" rx="4" fill="none" stroke="#E7C55A"/><text x="67" y="128" fill="#E7C55A">Se</text>
<rect x="85" y="112" width="26" height="22" rx="4" fill="none" stroke="#4A4A4A"/><text x="98" y="128" fill="#9AA0A6">Co</text>
<rect x="116" y="112" width="26" height="22" rx="4" fill="none" stroke="#4A4A4A"/><text x="129" y="128" fill="#9AA0A6">Ki</text>
<rect x="147" y="112" width="26" height="22" rx="4" fill="none" stroke="#4A4A4A"/><text x="160" y="128" fill="#9AA0A6">Br</text>
<rect x="178" y="112" width="26" height="22" rx="4" fill="none" stroke="#4A4A4A"/><text x="191" y="128" fill="#9AA0A6">Sc</text>
<rect x="209" y="112" width="26" height="22" rx="4" fill="none" stroke="#4A4A4A"/><text x="222" y="128" fill="#9AA0A6">Lo</text>
<rect x="240" y="112" width="26" height="22" rx="4" fill="none" stroke="#4A4A4A"/><text x="253" y="128" fill="#9AA0A6">In</text>
</g>
<line x1="40" y1="146" x2="370" y2="146" stroke="#3A3A3A"/>

<text x="58" y="174" font-size="13" fill="#E7C55A" letter-spacing="1.5">NEEDS YOU</text>
<circle cx="66" cy="197" r="7" fill="none" stroke="#D98E5F" stroke-width="1.6"/>
<text x="84" y="202" font-size="14" fill="#E8E8E8">review</text>
<text x="136" y="202" font-size="13" fill="#E7C55A">⚑1</text>

<text x="58" y="240" font-size="13" fill="#9AA0A6" letter-spacing="1.5">WORKING</text>
<rect x="46" y="250" width="318" height="28" rx="4" fill="#2A2618"/>
<line x1="46" y1="250" x2="46" y2="278" stroke="#E7C55A" stroke-width="2"/>
<path d="M66 257 a7 7 0 1 1 -7 7" fill="none" stroke="#D98E5F" stroke-width="1.8"/>
<text x="84" y="269" font-size="14" fill="#F3E3A8">tutor</text>
<circle cx="344" cy="264" r="8" fill="none" stroke="#9AA0A6"/><text x="344" y="269" text-anchor="middle" font-size="13" fill="#9AA0A6">i</text>
<circle cx="66" cy="297" r="7" fill="none" stroke="#D98E5F" stroke-width="1.6"/>
<text x="84" y="302" font-size="14" fill="#E8E8E8">build</text>
<text x="124" y="302" font-size="13" fill="#E7C55A">↑</text>

<text x="58" y="340" font-size="13" fill="#9AA0A6" letter-spacing="1.5">TO READ</text>
<circle cx="66" cy="363" r="7" fill="none" stroke="#D98E5F" stroke-width="1.6"/>
<text x="84" y="368" font-size="14" fill="#E8E8E8">kit</text>
<text x="110" y="368" font-size="13" fill="#B49AE8">41%</text>

<text x="58" y="406" font-size="13" fill="#9AA0A6" letter-spacing="1.5">IDLE</text>
<circle cx="66" cy="429" r="7" fill="none" stroke="#6A6A6A" stroke-width="1.6"/>
<text x="84" y="434" font-size="14" fill="#8A8A8A">notes</text>

<line x1="40" y1="456" x2="370" y2="456" stroke="#3A3A3A"/>
<text x="58" y="482" font-size="13" fill="#9AA0A6" letter-spacing="1.5">WITHOUT A SESSION</text>
<text x="60" y="506" font-size="13" fill="#C8C8C8"><tspan fill="#E7C55A">●</tspan> scratch · local cdb</text>
<text x="60" y="526" font-size="13" fill="#8A8A8A">○ ideas</text>

<!-- numbered marks -->
<g font-size="13" font-weight="600" text-anchor="middle" fill="#E7C55A">
<circle cx="398" cy="170" r="11" fill="#161616" stroke="#E7C55A"/><text x="398" y="175">1</text>
<circle cx="398" cy="197" r="11" fill="#161616" stroke="#E7C55A"/><text x="398" y="202">2</text>
<circle cx="398" cy="264" r="11" fill="#161616" stroke="#E7C55A"/><text x="398" y="269">3</text>
<circle cx="398" cy="297" r="11" fill="#161616" stroke="#E7C55A"/><text x="398" y="302">4</text>
<circle cx="398" cy="363" r="11" fill="#161616" stroke="#E7C55A"/><text x="398" y="368">5</text>
<circle cx="398" cy="429" r="11" fill="#161616" stroke="#E7C55A"/><text x="398" y="434">6</text>
<circle cx="398" cy="502" r="11" fill="#161616" stroke="#E7C55A"/><text x="398" y="507">7</text>
</g>
<g stroke="#3A3A3A"><line x1="370" y1="170" x2="387" y2="170"/><line x1="370" y1="197" x2="387" y2="197"/><line x1="370" y1="264" x2="387" y2="264"/><line x1="370" y1="297" x2="387" y2="297"/><line x1="370" y1="363" x2="387" y2="363"/><line x1="370" y1="429" x2="387" y2="429"/><line x1="370" y1="502" x2="387" y2="502"/></g>

<!-- notes -->
<g font-size="13">
<g transform="translate(450,112)"><circle cx="11" cy="0" r="11" fill="none" stroke="#E7C55A"/><text x="11" y="5" text-anchor="middle" font-weight="600" fill="#E7C55A">1</text>
<text x="34" y="5" font-weight="600" fill="#E7C55A" letter-spacing="2">FOUR GROUPS</text>
<text x="34" y="25" fill="#9AA0A6">Needs you, Working, To read, Idle: a session sits in the first that fits.</text></g>
<g transform="translate(450,176)"><circle cx="11" cy="0" r="11" fill="none" stroke="#E7C55A"/><text x="11" y="5" text-anchor="middle" font-weight="600" fill="#E7C55A">2</text>
<text x="34" y="5" font-weight="600" fill="#E7C55A" letter-spacing="2">⚑ AND A COUNT</text>
<text x="34" y="25" fill="#9AA0A6">Approvals wait for you. The Approvals tab holds the cards.</text></g>
<g transform="translate(450,240)"><circle cx="11" cy="0" r="11" fill="none" stroke="#E7C55A"/><text x="11" y="5" text-anchor="middle" font-weight="600" fill="#E7C55A">3</text>
<text x="34" y="5" font-weight="600" fill="#E7C55A" letter-spacing="2">THE STATE ICON AND THE CARD</text>
<text x="34" y="25" fill="#9AA0A6">Orange runs, grey is stopped, red failed; it spins while a turn works.</text>
<text x="34" y="43" fill="#9AA0A6">A click on it starts or stops the session. The ⓘ opens the row's card.</text></g>
<g transform="translate(450,322)"><circle cx="11" cy="0" r="11" fill="none" stroke="#E7C55A"/><text x="11" y="5" text-anchor="middle" font-weight="600" fill="#E7C55A">4</text>
<text x="34" y="5" font-weight="600" fill="#E7C55A" letter-spacing="2">↑ AN OLDER CLAUDE CODE</text>
<text x="34" y="25" fill="#9AA0A6">Another running session has a newer one. Start it again to catch up.</text></g>
<g transform="translate(450,386)"><circle cx="11" cy="0" r="11" fill="none" stroke="#E7C55A"/><text x="11" y="5" text-anchor="middle" font-weight="600" fill="#E7C55A">5</text>
<text x="34" y="5" font-weight="600" fill="#E7C55A" letter-spacing="2">THE CONTEXT IN PURPLE</text>
<text x="34" y="25" fill="#9AA0A6">The session's checkpoint is due.</text></g>
<g transform="translate(450,450)"><circle cx="11" cy="0" r="11" fill="none" stroke="#E7C55A"/><text x="11" y="5" text-anchor="middle" font-weight="600" fill="#E7C55A">6</text>
<text x="34" y="5" font-weight="600" fill="#E7C55A" letter-spacing="2">A DIMMED NAME</text>
<text x="34" y="25" fill="#9AA0A6">The session's own panel is closed. A double click opens it.</text></g>
<g transform="translate(450,514)"><circle cx="11" cy="0" r="11" fill="none" stroke="#E7C55A"/><text x="11" y="5" text-anchor="middle" font-weight="600" fill="#E7C55A">7</text>
<text x="34" y="5" font-weight="600" fill="#E7C55A" letter-spacing="2">PANELS NO SESSION HAS</text>
<text x="34" y="25" fill="#9AA0A6">● open, ○ closed, with the connection each is bound to.</text></g>
</g>

<g font-size="13" fill="#9AA0A6">
<rect x="40" y="569" width="12" height="12" fill="#D98E5F"/><text x="58" y="580">a running Claude Code session</text>
<rect x="270" y="569" width="12" height="12" fill="#E7C55A"/><text x="288" y="580">focus and attention</text>
<rect x="440" y="569" width="12" height="12" fill="#B49AE8"/><text x="458" y="580">checkpoint</text>
<text x="960" y="580" text-anchor="end">comando · docs/workbench</text>
</g>
</svg>
