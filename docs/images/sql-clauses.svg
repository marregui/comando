<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="476" viewBox="0 0 1100 476" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The order cdb runs the clauses of a query: FROM, WHERE, GROUP BY, SELECT, ORDER BY, LIMIT, with the rows left after each</title>
<rect width="1100" height="476" fill="#161616"/>
<text x="40" y="44" font-size="13" font-weight="500" fill="#E7C55A" letter-spacing="3">CDB SQL · THE ORDER OF A QUERY</text>
<text x="40" y="76" font-size="22" font-weight="300" fill="#E8E8E8">You write SELECT first. cdb starts at FROM.</text>

<rect x="40" y="98" width="1020" height="40" rx="8" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
<text x="56" y="123" font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace"><tspan fill="#E7C55A">SELECT</tspan> city, avg(temp) AS avg_temp <tspan fill="#E7C55A">FROM</tspan> weather <tspan fill="#E7C55A">WHERE</tspan> temp &gt; 10 <tspan fill="#E7C55A">GROUP BY</tspan> city <tspan fill="#E7C55A">ORDER BY</tspan> avg_temp DESC <tspan fill="#E7C55A">LIMIT</tspan> 2</text>

<g fill="#1E1E1E" stroke="#6FAEE8" stroke-width="1.2">
<rect x="40" y="166" width="160" height="226" rx="8"/><rect x="212" y="166" width="160" height="226" rx="8"/><rect x="384" y="166" width="160" height="226" rx="8"/><rect x="556" y="166" width="160" height="226" rx="8"/><rect x="728" y="166" width="160" height="226" rx="8"/><rect x="900" y="166" width="160" height="226" rx="8" stroke="#E7C55A"/>
</g>
<g fill="#9AA0A6">
<path d="M202,276 L210,281 L202,286 Z"/><path d="M374,276 L382,281 L374,286 Z"/><path d="M546,276 L554,281 L546,286 Z"/><path d="M718,276 L726,281 L718,286 Z"/><path d="M890,276 L898,281 L890,286 Z"/>
</g>
<g font-size="13" fill="#9AA0A6" letter-spacing="2">
<text x="54" y="190">1 · FROM</text><text x="226" y="190">2 · WHERE</text><text x="398" y="190">3 · GROUP BY</text><text x="570" y="190">4 · SELECT</text><text x="742" y="190">5 · ORDER BY</text><text x="914" y="190">6 · LIMIT</text>
</g>
<g font-size="13" fill="#6FAEE8" font-family="Menlo, Consolas, monospace">
<text x="54" y="213">weather</text><text x="226" y="213">temp &gt; 10</text><text x="398" y="213">city</text><text x="570" y="213">city, avg(temp)</text><text x="742" y="213">avg_temp DESC</text><text x="914" y="213" fill="#E7C55A">2</text>
</g>
<g font-size="13" fill="#E8E8E8">
<text x="54" y="234">all 12 rows</text><text x="226" y="234">9 rows pass</text><text x="398" y="234">3 groups</text><text x="570" y="234">1 row a group</text><text x="742" y="234">hottest first</text><text x="914" y="234">the first 2</text>
</g>

<g fill="#6FAEE8" fill-opacity="0.55">
<rect x="54" y="252" width="132" height="6"/><rect x="54" y="263" width="132" height="6"/><rect x="54" y="274" width="132" height="6"/><rect x="54" y="285" width="132" height="6"/><rect x="54" y="296" width="132" height="6"/><rect x="54" y="307" width="132" height="6"/><rect x="54" y="318" width="132" height="6"/><rect x="54" y="329" width="132" height="6"/><rect x="54" y="340" width="132" height="6"/><rect x="54" y="351" width="132" height="6"/><rect x="54" y="362" width="132" height="6"/><rect x="54" y="373" width="132" height="6"/>
<rect x="226" y="252" width="132" height="6"/><rect x="226" y="274" width="132" height="6"/><rect x="226" y="285" width="132" height="6"/><rect x="226" y="296" width="132" height="6"/><rect x="226" y="307" width="132" height="6"/><rect x="226" y="318" width="132" height="6"/><rect x="226" y="329" width="132" height="6"/><rect x="226" y="351" width="132" height="6"/><rect x="226" y="373" width="132" height="6"/>
</g>
<g fill="none" stroke="#5A5A5A" stroke-width="1" stroke-dasharray="3 3">
<rect x="226" y="263" width="132" height="6"/><rect x="226" y="340" width="132" height="6"/><rect x="226" y="362" width="132" height="6"/>
</g>

<g fill="#242424" stroke="#3A3A3A" stroke-width="1">
<rect x="398" y="252" width="132" height="34" rx="5"/><rect x="398" y="296" width="132" height="34" rx="5"/><rect x="398" y="340" width="132" height="34" rx="5"/>
<rect x="570" y="252" width="132" height="34" rx="5"/><rect x="570" y="296" width="132" height="34" rx="5"/><rect x="570" y="340" width="132" height="34" rx="5"/>
<rect x="742" y="252" width="132" height="34" rx="5"/><rect x="742" y="296" width="132" height="34" rx="5"/><rect x="742" y="340" width="132" height="34" rx="5"/>
</g>
<g fill="#E7C55A" fill-opacity="0.13" stroke="#E7C55A" stroke-width="1.2">
<rect x="914" y="252" width="132" height="34" rx="5"/><rect x="914" y="296" width="132" height="34" rx="5"/>
</g>
<rect x="914" y="340" width="132" height="34" rx="5" fill="none" stroke="#5A5A5A" stroke-width="1" stroke-dasharray="3 3"/>
<g font-size="13" fill="#E8E8E8" font-family="Menlo, Consolas, monospace">
<text x="408" y="274">Madrid  5 rows</text><text x="408" y="318">Oslo    2 rows</text><text x="408" y="362">Lima    2 rows</text>
<text x="580" y="274">Madrid  25.0</text><text x="580" y="318">Oslo    13.25</text><text x="580" y="362">Lima    18.75</text>
<text x="752" y="274">Madrid  25.0</text><text x="752" y="318">Lima    18.75</text><text x="752" y="362">Oslo    13.25</text>
<text x="924" y="274">Madrid  25.0</text><text x="924" y="318">Lima    18.75</text><text x="924" y="362" fill="#9AA0A6">cut</text>
</g>

<text x="40" y="424" font-size="14" fill="#E8E8E8">LATEST ON runs after WHERE. SAMPLE BY takes the place of GROUP BY. Window functions (OVER) run at SELECT, DISTINCT after it.</text>
<text x="40" y="458" font-size="13" fill="#9AA0A6" letter-spacing="1">comando · docs/cdb-sql</text>
</svg>
