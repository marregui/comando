<line x1="380" y1="370" x2="436" y2="370" marker-end="url(#a)"/><line x1="580" y1="370" x2="636" y2="370" marker-end="url(#a)"/>
<line x1="380" y1="442" x2="436" y2="442" marker-end="url(#a)"/><line x1="580" y1="442" x2="636" y2="442" marker-end="url(#a)"/>
<line x1="380" y1="514" x2="436" y2="514" marker-end="url(#a)"/><line x1="580" y1="514" x2="636" y2="514" marker-end="url(#a)"/>
</g>

<rect x="560" y="574" width="14" height="14" rx="3" fill="#D98E5F"/><text x="580" y="586" font-size="13" fill="#9AA0A6">Claude Code's events</text>
<rect x="740" y="574" width="14" height="14" rx="3" fill="#E7C55A"/><text x="760" y="586" font-size="13" fill="#9AA0A6">the mapper</text>
<rect x="860" y="574" width="14" height="14" rx="3" fill="#6FAEE8"/><text x="880" y="586" font-size="13" fill="#9AA0A6">blocks and intents</text>
<text x="40" y="586" font-size="13" fill="#9AA0A6">comando · docs/modules/claude</text>
</svg>
